name: MOM_PRIME endpoint and exceptional terminal

on:
  push:
    branches: [cloud/mom-prime]
  pull_request:
    branches: [dtests-handoff]
    paths:
      - HeckeSkeleton/Moments/MOM_PRIME/**
      - .github/workflows/mom-prime.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mom-prime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore compiled dependency progress
        id: dependency-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ./.lake
            ./vendor/class-field-theory/.lake/build
          key: mom-prime-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mom-prime-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-
      - name: Set up the pinned Lean and Mathlib environment
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Download an optional pinned dependency cache
        if: steps.dependency-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 13012376359,13011719707,13018074066
          run-id: 41126752041
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mom-prime-dependencies
      - name: Install compatible dependency facets for Lake to recheck
        if: steps.dependency-cache.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mom-prime-verification
          python3 HeckeSkeleton/Moments/MOM_PRIME/seed_cache.py \
            "$RUNNER_TEMP/mom-prime-dependencies" 2>&1 | tee /tmp/mom-prime-verification/cache.log
      - name: Build the endpoint and exceptional-terminal audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mom-prime-verification
          lean --version | tee /tmp/mom-prime-verification/environment.log
          git rev-parse HEAD >> /tmp/mom-prime-verification/environment.log
          cat lean-toolchain lake-manifest.json >> /tmp/mom-prime-verification/environment.log
          lake --rehash build HeckeSkeleton.Moments.MOM_PRIME.Audit 2>&1 | tee /tmp/mom-prime-verification/build.log
      - name: Check the standard axiom allowlist
        shell: bash
        run: |
          set -euo pipefail
          lake env lean HeckeSkeleton/Moments/MOM_PRIME/Audit.lean 2>&1 | tee /tmp/mom-prime-verification/axioms.log
          python3 - <<'PY' | tee /tmp/mom-prime-verification/allowlist.log
          import re
          from pathlib import Path
          source = Path('HeckeSkeleton/Moments/MOM_PRIME/Audit.lean').read_text()
          expected = set(re.findall(r'^#print axioms (\S+)', source, re.M))
          assert expected, 'Empty axiom audit'
          output = Path('/tmp/mom-prime-verification/axioms.log').read_text()
          pattern = r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          records = dict(re.findall(pattern, output, re.S))
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          missing = expected - records.keys()
          assert not missing, f'Missing audit records: {sorted(missing)}'
          for name in sorted(expected):
              found = {a.strip() for a in records[name].split(',') if a.strip()}
              assert found <= allowed, f'{name}: unexpected axioms {sorted(found - allowed)}'
              print(f'{name}: {sorted(found)}')
          print(f'PASS: {len(expected)} declarations; standard axioms only')
          PY
      - name: Preserve compiled dependency progress
        if: ${{ !cancelled() }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ./.lake
            ./vendor/class-field-theory/.lake/build
          key: mom-prime-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ hashFiles('./lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve build and axiom logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-prime-verification-${{ github.sha }}
          path: /tmp/mom-prime-verification
          if-no-files-found: warn
          retention-days: 30
