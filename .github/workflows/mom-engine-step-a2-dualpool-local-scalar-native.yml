          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tomllib
          
          
          def identity(data):
              return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                      'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
          
          
          def validate_source_pair(original, candidate, contract):
              assert identity(original) == contract['original']
              assert identity(candidate) == contract['candidate']
              forward = original
              for edit in reversed(contract['source_edits']):
                  start, end = edit['original_start'], edit['original_end']
                  old, new = edit['old'].encode(), edit['new'].encode()
                  assert original[start:end] == old
                  assert identity(old)['sha256'] == edit['old_sha256']
                  assert identity(new)['sha256'] == edit['new_sha256']
                  forward = forward[:start] + new + forward[end:]
              assert forward == candidate
              backward = candidate
              for edit in reversed(contract['source_edits']):
                  start, end = edit['candidate_start'], edit['candidate_end']
                  assert candidate[start:end] == edit['new'].encode()
                  backward = backward[:start] + edit['old'].encode() + backward[end:]
              assert backward == original
              for pattern, key in [(rb'^import (.+)$', 'original_imports'),
                                   (rb'^#print axioms (.+)$', 'original_prints')]:
                  assert [x.decode() for x in re.findall(pattern, original, re.M)] == contract[key]
                  assert [x.decode() for x in re.findall(pattern, candidate, re.M)] == contract[key]
              assert [x.decode() for x in re.findall(rb'^set_option\b.*$', candidate, re.M)] == contract['candidate_options']
              assert b'A2_DUALPOOL_DIAGNOSTIC' not in candidate
              assert b'run_tac IO.eprintln' not in candidate and b'run_cmd IO.eprintln' not in candidate
              return {'original': identity(original), 'candidate': identity(candidate),
                      'exact_forward_and_inverse': True,
                      'original_imports': contract['original_imports'],
                      'original_prints': contract['original_prints'],
                      'candidate_options': contract['candidate_options']}
          
          
          def validate_pool_pair(original, candidate, contract):
              overlay = contract['pool_overlay']
              assert identity(original) == overlay['original']
              assert identity(candidate) == overlay['candidate']
              old, new = overlay['old'].encode(), overlay['new'].encode()
              assert original.count(old) == candidate.count(new) == 1
              assert original.replace(old, new, 1) == candidate
              assert candidate.replace(new, old, 1) == original
              assert len(candidate) - len(original) == 6
              assert b'attribute [instance] coveredLeafKeyFintype' not in candidate
              return {'original': identity(original), 'candidate': identity(candidate),
                      'only_change': overlay['only_change'], 'exact_forward_and_inverse': True}
          
          
          def closure(graph, target):
              found, pending = set(), [target]
              while pending:
                  name = pending.pop()
                  if name in found:
                      continue
                  assert name in graph, 'Missing STEP module: ' + name
                  found.add(name)
                  pending.extend(graph[name])
              return sorted(found)
          
          
          def validate_inventory(source_bytes, config_bytes, contract):
              task = contract['task_directory']
              configs = {path: identity(data)['sha256'] for path, data in config_bytes.items()}
              assert configs == contract['config_sha256'] and len(configs) == 7
              assert config_bytes['lean-toolchain'].decode().strip() == 'leanprover/lean4:v4.35.0-rc3'
              lake = tomllib.loads(config_bytes['lakefile.toml'].decode())
              assert lake['weakLeanArgs'] == ['-j2']
              assert lake['leanOptions'] == {'autoImplicit': False, 'relaxedAutoImplicit': False}
              mathlib = [x for x in json.loads(config_bytes['lake-manifest.json'])['packages'] if x['name'] == 'mathlib']
              assert len(mathlib) == 1 and mathlib[0]['rev'] == contract['mathlib_commit']
              imports = re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$',
                                   source_bytes[task + '/Interface.lean'].decode(), re.M)
              expected = {p[:-5].replace('/', '.') for p in source_bytes if p != task + '/Interface.lean'}
              libraries = [x['name'] for x in lake['lean_lib']]
              assert len(source_bytes) == 1009 and len(imports) == len(set(imports)) == 1008
              assert set(imports) == expected and len(libraries) == 20
              graph = {Path(path).stem: re.findall(r'^import HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.([A-Za-z_0-9]+)\s*$', data.decode(), re.M)
                       for path, data in source_bytes.items()}
              actual_closure = closure(graph, contract['target'])
              assert actual_closure == contract['expected_STEP_closure']
              for path, expected_id in contract['required_dependencies'].items():
                  assert identity(source_bytes[path]) == expected_id
              return {'task_source_sha256': {p: identity(b)['sha256'] for p, b in source_bytes.items()},
                      'config_sha256': configs, 'interface_imports': imports, 'libraries': libraries,
                      'target_STEP_closure': actual_closure}
          
          
          def main():
              root = Path.cwd()
              evidence = Path(__file__).resolve().parent
              contract = json.loads((evidence / 'contract.json').read_text())
              assert not contract['fixture_only'], (
                  'UNPUBLISHABLE FIXTURE: rebind a reviewed complete repair and the actual current owner '
                  'before freezing a runnable original normal workflow.')
              phase = sys.argv[1]
              assert phase in ['before', 'after']
              def git(*args):
                  return subprocess.check_output(['git', *args], text=True).strip()
              assert git('rev-parse', contract['base'] + '^{tree}') == contract['base_tree']
              head = git('rev-parse', 'HEAD')
              assert head == os.environ['EXPECTED_SHA']
              assert git('rev-list', '--parents', '-n', '1', 'HEAD').split() == [head, contract['base']]
              changed = git('diff', '--no-renames', '--name-only', contract['base'], 'HEAD').splitlines()
              assert changed == sorted([contract['target_path'], contract['pool_path'], contract['workflow_path']])
              assert git('diff', '--no-renames', '--name-status', contract['base'], 'HEAD').splitlines() == sorted([
                  'M\t' + contract['target_path'], 'M\t' + contract['pool_path'], 'A\t' + contract['workflow_path']])
              original = subprocess.check_output(['git', 'show', contract['base'] + ':' + contract['target_path']])
              candidate = Path(contract['target_path']).read_bytes()
              source_check = validate_source_pair(original, candidate, contract)
              assert git('rev-parse', 'HEAD:' + contract['target_path']) == contract['candidate']['git_blob']
              pool_original = subprocess.check_output(['git', 'show', contract['base'] + ':' + contract['pool_path']])
              pool_candidate = Path(contract['pool_path']).read_bytes()
              pool_check = validate_pool_pair(pool_original, pool_candidate, contract)
              assert git('rev-parse', 'HEAD:' + contract['pool_path']) == contract['pool_overlay']['candidate']['git_blob']
              task = Path(contract['task_directory'])
              source_bytes = {str(p): p.read_bytes() for p in sorted(task.glob('*.lean'))}
              config_bytes = {p: Path(p).read_bytes() for p in contract['config_sha256']}
              inventory = validate_inventory(source_bytes, config_bytes, contract)
              assert os.environ['LEAN_NUM_THREADS'] == '2'
              tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
              assert len(tracked) == contract['expected_tracked_files']
              def tracked_digest(path):
                  p = Path(path)
                  data = os.fsencode(os.readlink(p)) if p.is_symlink() else p.read_bytes()
                  return identity(data)['sha256']
              record = {
                  'stage': 'Complete DualPool original normal verification and fresh loaded namespace audit',
                  'source_base': contract['base'], 'source_base_tree': contract['base_tree'],
                  'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'),
                  'expected_head': os.environ['EXPECTED_SHA'],
                  'changed_paths': changed, 'complete_source_identity': source_check,
                  'Pool_local_registration_identity': pool_check,
                  'coordinator_local_instance_comments': contract['coordinator_local_instance_comments'],
                  'shared_file_options_source': contract['shared_options_source'],
                  'target_modules': ['HeckeSkeleton.Moments.MOM_ENGINE_STEP.' + contract['target']],
                  'original_prints': contract['original_prints'],
                  'tracked_status': git('status', '--porcelain=v1', '--untracked-files=no'),
                  'tracked_sha256': {p: tracked_digest(p) for p in tracked},
                  'full_task_acceptance': False, **inventory,
              }
              assert not record['tracked_status']
              assert json.loads(json.dumps(record)) == record
              (evidence / (phase + '-source.json')).write_text(json.dumps(record, indent=2) + '\n')
              if phase == 'after':
                  assert json.loads((evidence / 'before-source.json').read_text()) == record
                  (evidence / 'source-integrity.json').write_text(json.dumps({
                      'unchanged': True, 'head': head, 'tree': record['tree'],
                      'tracked_files': len(tracked), 'task_modules': 1009,
                      'interface_imports': 1008, 'libraries': 20}, indent=2) + '\n')
              print(phase, head, record['tree'], len(tracked), 1009, 1008, 20, flush=True)
          
          
          if __name__ == '__main__':
              main()
          PY
          cat > a2-dualpool-local-scalar-native/run.py <<'PY'
          import datetime, json, re, subprocess, sys, time
          from pathlib import Path
          name, seconds, *command = sys.argv[1:]
          evidence = Path('a2-dualpool-local-scalar-native')
          wrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]
          record = {'command': command, 'wrapper': wrapper, 'completed': False,
                    'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          receipt = evidence / (name + '-result.json')
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          start = time.monotonic()
          compact = name == 'dependencies'
          show_block = not compact
          with (evidence / (name + '-console.log')).open('w') as log:
              process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  if compact:
                      clean = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      if re.match(r'^[✔✖⚠ℹ]\s+\[\d+/\d+\]', clean):
                          show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')
                      elif re.match(r'^(error|warning|info):', clean):
                          show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')
                      elif clean.startswith('Some required targets logged failures:'):
                          show_block = True
                  if show_block:
                      print(line, end='', flush=True)
              code = process.wait()
          record.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,
                        finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record), flush=True)
          sys.exit(code if code >= 0 else 128 - code)
          PY
