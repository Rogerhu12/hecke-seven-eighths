name: A2 Dual terminal integral normal build and fresh task axiom audit

on:
  push:
    branches: [cloud/mom-engine-step-a2-dual-integral-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-dual-integral-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dual_integral:
    name: Normal DualGaussHybridTerminal
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      ROOT_MODULE: 'DualGaussHybridTerminal'
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-dual-integral-native
          git show --no-patch --format=fuller HEAD > a2-dual-integral-native/checkout.txt
          cat > a2-dual-integral-native/provenance.py <<'PY'
          import hashlib, json, os, re, subprocess, sys, tomllib
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'a2-dual-integral-native'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')
          sources = sorted(str(p) for p in task.glob('*.lean'))
          configs = ['lean-toolchain', 'lakefile.toml', 'lake-manifest.json',
                     'vendor/class-field-theory/lean-toolchain',
                     'vendor/class-field-theory/lakefile.toml',
                     'vendor/class-field-theory/lake-manifest.json', str(task / 'verify.py')]
          interface = (task / 'Interface.lean').read_text()
          imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', interface, re.M)))
          libraries = [x['name'] for x in tomllib.loads(Path('lakefile.toml').read_text())['lean_lib']]
          normal_root = os.environ['ROOT_MODULE']
          assert normal_root == 'DualGaussHybridTerminal', 'Unexpected normal root'
          source_base = '110ad137a9281905cbc6dadf28d40466502c4951'
          source_base_tree = git('rev-parse', source_base + '^{tree}')
          assert source_base_tree == '86d80f351310fcba14956dd9bcfd80a20b47322e'
          assert git('rev-parse', 'HEAD^') == source_base
          assert len(git('rev-list', '--parents', '-n', '1', 'HEAD').split()) == 2
          changed = git('diff', '--name-only', source_base, 'HEAD').splitlines()
          allowed = {
              '.github/workflows/mom-engine-step-a2-dual-integral-native.yml',
              str(task / 'DualGaussHybridTerminal.lean'),
          }
          assert set(changed) == allowed, 'Only the reviewed complete Dual source candidate and this new normal workflow may differ'
          statuses = git('diff', '--name-status', source_base, 'HEAD').splitlines()
          assert set(statuses) == {
              'A\t.github/workflows/mom-engine-step-a2-dual-integral-native.yml',
              'M\t' + str(task / 'DualGaussHybridTerminal.lean'),
          }, 'The workflow must be new and the original Dual module path must remain present'
          original_candidate_sources = {
              str(task / 'DirectCoveredStage.lean'): '243ed35cc7230b41cd4dbaae596b1332e98da6707253d08ba7de58c4650f8372',
              str(task / 'PoolFiniteLeaves.lean'): '7fafdf5687b18cf53f9e6f4792e999198a0ab875396376690e1c625f0a718c01',
              str(task / 'GatedGaussStages.lean'): '74103e801a3bcb1326d9c9dbf5f7b4238b66e034bba021436ad5d7059faf1d96',
              str(task / 'DualGaussHybridTerminal.lean'): 'b2be306ecb762e87a7ccd695a3cd870e438d74b7e5eb1cb32396f89bf24f4b06',
          }
          for path, expected in original_candidate_sources.items():
              parent_bytes = subprocess.check_output(['git', 'show', source_base + ':' + path])
              assert hashlib.sha256(parent_bytes).hexdigest() == expected, 'Unexpected original candidate source: ' + path
          reviewed_source_pins = {
              str(task / 'OriginalAmplifiedCarrier.lean'): '788de94c079afcf9428eb0c592abd1b0090c662ae0949ee3d699a8ac597f871b',
              str(task / 'PoolFiniteLeaves.lean'): '7fafdf5687b18cf53f9e6f4792e999198a0ab875396376690e1c625f0a718c01',
              str(task / 'DualGaussHybridTerminal.lean'): '6de73fb29bd9434bf272000b7b3dd506b6b24d592a23ddcbc99d8192ca295cff',
              str(task / 'OriginalAllocationFingerprint.lean'): '30f35dba5d488d40a93fbee78c1eca888aee327a109af235a9320b2c8e2c1e5b',
              str(task / 'DirectCoveredStage.lean'): '243ed35cc7230b41cd4dbaae596b1332e98da6707253d08ba7de58c4650f8372',
              str(task / 'GatedGaussStages.lean'): '74103e801a3bcb1326d9c9dbf5f7b4238b66e034bba021436ad5d7059faf1d96',
              str(task / 'ActualGaussFiniteLeaves.lean'): 'b81c8566cf067792b4e25363381a746281df5460a1e81dad68590ec090d742e2',
              str(task / 'CanonicalLiteralExtraction.lean'): 'b1bc990df3791577b2e1c0cf609a65fd185715e808253f43533f1b9f9bbcd1bd',
              str(task / 'CanonicalLiteralAtlas.lean'): 'ff8ab19caf36f5a9ec27ec7a6d9612511644a47b05ff33ee1bf8e4d05484b5b2',
              str(task / 'CanonicalLiteralMovingTwist.lean'): 'a9639e024d61244af768073acca6479c31bc217ef0a79e0004b2ed943d9e37a5',
              str(task / 'OrdinaryLiteralExceptionalLeaf.lean'): '09e4b083c71e6773b55fda90ab3412e7f4214552afc8e74f8b96c79705f72a7f',
              str(task / 'ActualExceptionalColumnOrientation.lean'): '2304963616c4daf16c15b860f1bfe5634f31d984f996a4205ef00362c9b2c77c',
              str(task / 'Interface.lean'): 'db81dff1d17c12c72746738c9296a1d4bc87ec27d33958124ce36c79455bb5df',
              str(task / 'verify.py'): '1be80b89c66818fa20e680a6850818ed4499ddf2d7d5789a9b63398c3279c148',
              'lean-toolchain': 'bc84812c94489d1e3e191baa1dc10d5eb684382d7fe9d2a5ab085e72c1c67e47',
              'lakefile.toml': '2d4deb66cc8a08f069ce72e873ea53f0877ac8aa181a57b08676a7a73aad1af0',
              'lake-manifest.json': 'ded459271a8b831db1213d0e0f56e84072a4743f735eb90ed1b65a571459e32c',
              'vendor/class-field-theory/lean-toolchain': '8dc8d6f560141069d9073e370611716ef77ada0da8ffa37e2149f44b2e63ac7a',
              'vendor/class-field-theory/lakefile.toml': '04bb109b87b6bdd3a9fb66b2aaf6d33c97dd6e642718fa944dbb6db1464706cf',
              'vendor/class-field-theory/lake-manifest.json': 'ee22b45c98f5346f1bbd99a16305641d0571ee1244ccbff3b11c079b420d0d49',
          }
          for path, expected in reviewed_source_pins.items():
              assert digest(path) == expected, 'Unexpected reviewed source or original configuration: ' + path
          file_level_option = b'set_option linter.unusedSectionVars false\n'
          assert len(file_level_option) == 42
          proof_candidate_baselines = {
              str(task / 'DualGaussHybridTerminal.lean'): ('76ff520630a30056693bdb762dfd37f2fdcb20379ad4daf39de69e431d12c034', 19937),
          }
          for path, (expected_sha, expected_size) in proof_candidate_baselines.items():
              candidate_bytes = (root / path).read_bytes()
              assert candidate_bytes.count(file_level_option) == candidate_bytes.count(b'set_option ') == 1
              source_lines = candidate_bytes.splitlines(keepends=True)
              last_import = max(i for i, line in enumerate(source_lines) if line.startswith(b'import '))
              assert source_lines[last_import + 1] == file_level_option
              offset = sum(len(line) for line in source_lines[:last_import + 1])
              baseline_bytes = candidate_bytes[:offset] + candidate_bytes[offset + len(file_level_option):]
              assert len(baseline_bytes) == expected_size
              assert hashlib.sha256(baseline_bytes).hexdigest() == expected_sha, 'The exact reviewed proof candidate changed: ' + path
              assert b'A2_OWNER_' not in candidate_bytes and b'run_tac IO.eprintln' not in candidate_bytes and b'run_cmd IO.eprintln' not in candidate_bytes
          candidate_path = str(task / 'DualGaussHybridTerminal.lean')
          candidate_bytes = (root / candidate_path).read_bytes()
          assert len(candidate_bytes) == 19979, 'Unexpected complete Dual candidate size'
          assert git('rev-parse', 'HEAD:' + candidate_path) == '4f1c9601de74b44b856af6357915a92b58d47f0f'
          assert git('rev-parse', source_base + ':' + candidate_path) == '3a3e22d7b410eff51dcae3c8e235121fdb5a1276'
          record = {'source_base': source_base, 'source_base_tree': source_base_tree,
                    'normal_root': normal_root,
                    'one_complete_original_root_and_its_five_original_prints': True,
                    'changed_paths_from_base': changed,
                    'owner_coordination_comments': [6567746611, 6567811743, 6567916957],
                    'file_level_warning_authorization_comment': 6567746611,
                    'file_level_warning_option': 'linter.unusedSectionVars',
                    'file_level_warning_value': False,
                    'file_level_warning_delta_per_source_bytes': 42,
                    'file_level_warning_files': list(proof_candidate_baselines),
                    'proof_candidate_baselines': {p: list(v) for p, v in proof_candidate_baselines.items()},
                    'proof_candidate_baselines_meaning': 'Exact complete new proof candidate after removing only the authorized file-level 42-byte line',
                    'terminal_integral_proof_claim_comment': 6567916957,
                    'terminal_integral_reviewed_prior_source': ['224a456a8d9452c3f4fd21e0c8674b5cf13ed366ad3869f1c9f22f88eb5dabc7', 18061],
                    'terminal_integral_reviewed_exact_edits': [
                        ['private_generic_scalar_integral_helper', 2639, 0, 1555],
                        ['existing_public_integral_proof_only', 12390, 562, 925]],
                    'complete_candidate_git_blob': '4f1c9601de74b44b856af6357915a92b58d47f0f',
                    'complete_candidate_bytes': len(candidate_bytes),
                    'source_candidate_not_yet_owner_adopted': True,
                    'no_diagnostic_auxiliary_or_probe_files_added': True,
                    'original_verifier_and_all_original_declaration_prints_used': True,
                    'fresh_audit_scope': 'Every loaded EngineStep declaration, including private/generated declarations through the original verifier',
                    'interface_and_whole20_acceptance_not_claimed_by_this_single_root_run': True,
                    'original_candidate_sources': original_candidate_sources,
                    'reviewed_source_pins': reviewed_source_pins,
                    'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'expected_head': os.environ['EXPECTED_SHA'],
                    'tracked_status': git('status', '--porcelain=v1', '--untracked-files=no'),
                    'tracked_sha256': {p: digest(p) for p in tracked},
                    'task_source_sha256': {p: digest(p) for p in sources},
                    'config_sha256': {p: digest(p) for p in configs},
                    'interface_imports': imports, 'libraries': libraries}
          assert json.loads(json.dumps(record)) == record, 'Provenance must use only stable JSON-native types'
          phase = sys.argv[1]
          (evidence / (phase + '-source.json')).write_text(json.dumps(record, indent=2) + '\n')
          assert record['head'] == record['expected_head'], 'Unexpected checkout SHA'
          assert not record['tracked_status'], 'Tracked source changes detected'
          assert len(sources) == 1009, 'Task module inventory changed'
          assert len(imports) == 1008, 'Complete Interface import inventory changed'
          assert len(libraries) == 20, 'Library inventory changed'
          assert len(configs) == 7, 'Configuration inventory changed'
          if phase == 'after':
              before = json.loads((evidence / 'before-source.json').read_text())
              assert before == record, 'Source, configuration, index inventory or HEAD changed'
              (evidence / 'source-integrity.json').write_text(json.dumps({
                  'unchanged': True, 'head': record['head'], 'tree': record['tree'],
                  'tracked_files': len(tracked), 'task_modules': len(sources),
                  'interface_imports': len(imports), 'libraries': len(libraries)}, indent=2) + '\n')
          print(f'{phase}: {record["head"]} tree={record["tree"]}; {len(tracked)} tracked files, {len(sources)} task modules, {len(libraries)} libraries')
          PY
          cat > a2-dual-integral-native/run.py <<'PY'
          import datetime, json, re, subprocess, sys, time
          from pathlib import Path
          name, seconds, *command = sys.argv[1:]
          evidence = Path('a2-dual-integral-native')
          wrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]
          record = {'command': command, 'wrapper': wrapper, 'completed': False,
                    'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          receipt = evidence / (name + '-result.json')
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          start = time.monotonic()
          compact = name == 'dependencies'
          show_block = not compact
          with (evidence / (name + '-console.log')).open('w') as log:
              process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  if compact:
                      clean = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      if re.match(r'^[✔✖⚠ℹ]\s+\[\d+/\d+\]', clean):
                          show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')
                      elif re.match(r'^(error|warning|info):', clean):
                          show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')
                      elif clean.startswith('Some required targets logged failures:'):
                          show_block = True
                  if show_block:
                      print(line, end='', flush=True)
              code = process.wait()
          record.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,
                        finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record), flush=True)
          sys.exit(code if code >= 0 else 128 - code)
          PY
          python3 a2-dual-integral-native/provenance.py before
      - name: Provide enough memory mappings for the full legacy import closure
        run: |
          MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > a2-dual-integral-native/memory-mapping.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build this original root's import closure separately
        id: dependencies
        run: |
          python3 -u a2-dual-integral-native/run.py dependencies 1200 \
            lake build "+HeckeSkeleton.Moments.MOM_ENGINE_STEP.${ROOT_MODULE}:deps"
      - name: Compile DualGaussHybridTerminal and freshly audit every loaded task declaration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 -u a2-dual-integral-native/run.py verification 1200 \
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.DualGaussHybridTerminal \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualGaussStage.DualTerminalCalibration.rawCost_le_coverHybrid \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualGaussStage.DualTerminalCalibration.integral_rawPhaseCost_le_cover \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualGaussStage.DualTerminalCalibration.integral_phase_cost_eq_budgets_leaves \
            --declaration HeckeSkeleton.Moments.EngineStep.actual_gauss_dual_cover_hybrid_terminal_bound \
            --declaration HeckeSkeleton.Moments.EngineStep.actual_gauss_dual_hybrid_terminal_bound \
            --evidence a2-dual-integral-native/verify
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a2-dual-integral-native/provenance.py after
      - name: Preserve original compiler logs, timings, source hashes and fresh axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-dual-integral-native-${{ github.sha }}-${{ github.run_attempt }}
          path: a2-dual-integral-native/
          if-no-files-found: error
          retention-days: 14
