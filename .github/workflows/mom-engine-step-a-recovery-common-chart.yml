          def git(root, *args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def identity(data):
              return [len(data), sha(data), hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()]

          def one_replace(data, old, new):
              assert data.count(old) == 1, 'Original proof edit anchor is not unique'
              return data.replace(old, new, 1)

          def validate_source_bytes(stem, original, current):
              pin = PINS[stem]
              assert identity(original) == pin['original'], 'Unexpected direct-parent source: ' + stem
              assert identity(current) == pin['candidate'], 'Unexpected complete proof candidate: ' + stem
              edits = [x for x in EDITS if x['file'] == stem + '.lean']
              expected = original
              for edit in edits:
                  old, new = edit['old'].encode(), edit['new'].encode()
                  offset = edit['original_byte_offset']
                  assert original[offset:offset + len(old)] == old
                  assert sha(old) == edit['old_sha256'] and sha(new) == edit['new_sha256']
                  expected = one_replace(expected, old, new)
              v1 = expected
              v2_edits = [x for x in V2_EDITS if x['file'] == stem + '.lean']
              if v2_edits:
                  assert identity(v1) == pin['v1_candidate'], 'The first seven target repairs must reproduce frozen v1 exactly'
                  for edit in v2_edits:
                      old, new = edit['old'].encode(), edit['new'].encode()
                      offset = edit['original_byte_offset']
                      assert v1[offset:offset + len(old)] == old, 'V2 anchors refer to v1, never to the owner source'
                      assert sha(old) == edit['old_sha256'] and sha(new) == edit['new_sha256']
                      expected = one_replace(expected, old, new)
                  for order in [v2_edits, list(reversed(v2_edits))]:
                      recovered = current
                      for edit in order:
                          recovered = one_replace(recovered, edit['new'].encode(), edit['old'].encode())
                      assert recovered == v1, 'V2 inverse must recover the complete frozen v1 source'
              assert expected == current, 'The complete source must match the first-stage repairs followed by exactly three v2 proof edits'
              if stem == 'CanonicalLiteralTwoStages':
                  intermediate = original
                  for edit in edits[:3]:
                      intermediate = one_replace(intermediate, edit['old'].encode(), edit['new'].encode())
                  assert identity(intermediate) == pin['intermediate']
                  assert len(intermediate) - len(original) == 42 and len(current) - len(intermediate) == 19
              for order in [edits, list(reversed(edits))]:
                  recovered = v1
                  for edit in order:
                      recovered = one_replace(recovered, edit['new'].encode(), edit['old'].encode())
                  assert recovered == original, 'Proof-only inverse must recover the exact owner bytes'
              for pattern, key in [(rb'^import (.+)$', 'original_imports'), (rb'^#print axioms (.+)$', 'original_prints')]:
                  before = [x.decode() for x in re.findall(pattern, original, re.M)]
                  after = [x.decode() for x in re.findall(pattern, current, re.M)]
                  assert before == after == pin[key], 'Original imports or print targets changed'
              assert re.findall(rb'^set_option\b.*$', original, re.M) == re.findall(rb'^set_option\b.*$', current, re.M)
              return {'original': pin['original'], 'candidate': pin['candidate'],
                      'exact_forward_and_two_inverse_orders': True, 'proof_scopes': pin['proof_scopes'],
                      'v1_candidate': identity(v1), 'v2_proof_scopes': pin.get('v2_proof_scopes', []),
                      'repair_sequence': 'owner-to-v1 then v1-to-v2' if v2_edits else 'unchanged B2 two-stage dependency repair',
                      'original_imports': pin['original_imports'], 'original_prints': pin['original_prints']}

          def validate_source_files(root):
              result = {}
              for stem in PINS:
                  path = TASK + '/' + stem + '.lean'
                  original = subprocess.check_output(['git', 'show', SOURCE_BASE + ':' + path], cwd=root)
                  assert git(root, 'rev-parse', SOURCE_BASE + ':' + path) == PINS[stem]['original'][2]
                  result[path] = validate_source_bytes(stem, original, (root / path).read_bytes())
              return result

          def validate_inventory_bytes(source_bytes, config_bytes):
              sources = sorted(source_bytes)
              config = {p: sha(config_bytes[p]) for p in CONFIG_PINS}
              assert config == CONFIG_PINS, 'Fixed verifier or configuration changed'
              assert config_bytes['lean-toolchain'].decode().strip() == 'leanprover/lean4:v4.35.0-rc3'
              lake = tomllib.loads(config_bytes['lakefile.toml'].decode())
              assert lake['weakLeanArgs'] == ['-j2']
              assert lake['leanOptions'] == {'autoImplicit': False, 'relaxedAutoImplicit': False}
              mathlib = [p for p in json.loads(config_bytes['lake-manifest.json'])['packages'] if p['name'] == 'mathlib']
              assert len(mathlib) == 1 and mathlib[0]['rev'] == '0493595ecd5da8ef14742febab99728f98e948e8'
              imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', source_bytes[TASK + '/Interface.lean'].decode(), re.M)))
              libraries = [x['name'] for x in lake['lean_lib']]
              assert len(sources) == 1009 and len(imports) == 1008 and len(libraries) == 20
              graph = {Path(p).stem: re.findall(r'^import HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.([A-Za-z_0-9]+)\s*$', source_bytes[p].decode(), re.M) for p in sources}
              closures = {}
              for target in TARGETS:
                  closure, pending = set(), [target]
                  while pending:
                      name = pending.pop()
                      if name in closure:
                          continue
                      assert name in graph, 'Missing STEP import: ' + name
                      closure.add(name)
                      pending.extend(graph[name])
                  closures[target] = sorted(closure)
              assert closures == EXPECTED_CLOSURES, 'The two original import closures changed'
              union = sorted(set().union(*[set(c) for c in closures.values()]))
              assert not set(EXCLUDED_KNOWN_ROOTS).intersection(union)
              return {'task_source_sha256': {p: sha(source_bytes[p]) for p in sources},
                      'config_sha256': config, 'interface_imports': imports, 'libraries': libraries,
                      'target_STEP_import_closures': closures, 'combined_STEP_import_closure': union,
                      'excluded_known_roots': EXCLUDED_KNOWN_ROOTS}

          def main():
              root = Path.cwd()
              evidence = root / EVIDENCE
              phase = sys.argv[1]
              assert phase in ['before', 'after']
              assert git(root, 'rev-parse', SOURCE_BASE + '^{tree}') == SOURCE_TREE
              parents = git(root, 'rev-list', '--parents', '-n', '1', 'HEAD').split()[1:]
