          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build both original import closures together
        id: dependencies
        run: |
          python3 -u a-recovery-common-chart/run.py dependencies 1200 \
            lake build +HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralCommonLeaf:deps \
            +HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralChartLocations:deps
      - name: Compile both complete original modules and freshly audit every loaded task declaration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 -u a-recovery-common-chart/run.py verification 1200 \
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralCommonLeaf \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralChartLocations \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralCommonLeaf.extraction \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralCommonLeaf.ordinaryBinding \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralCommonLeaf.supportedOrdinaryBinding \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralCommonLeaf.commonRows_eq_withCommonAtoms \
            --declaration HeckeSkeleton.Moments.EngineStep.SecondBlockProfileChart.canonicalLog_left_jointLocation \
            --declaration HeckeSkeleton.Moments.EngineStep.SecondBlockProfileChart.canonicalLog_right_jointLocation \
            --evidence a-recovery-common-chart/verify
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a-recovery-common-chart/provenance.py after
      - name: Preserve original compiler logs, timings, source hashes and fresh axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-recovery-common-chart-native-${{ github.sha }}-${{ github.run_attempt }}
          path: a-recovery-common-chart/
          if-no-files-found: error
          retention-days: 14
