            --declaration HeckeSkeleton.Moments.EngineStep.OriginalClippedGaussProfiles.original_prime_identity \
            --declaration HeckeSkeleton.Moments.EngineStep.OriginalClippedGaussProfiles.rawWindow \
            --declaration HeckeSkeleton.Moments.EngineStep.CompleteMovingRowRecipe.arithmeticAtoms_literal_plain \
            --declaration HeckeSkeleton.Moments.EngineStep.CompleteMovingRowRecipe.arithmeticAtoms_literal_prime \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralTerms.dictionary \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralTerms.reconstructed_centered_coefficient \
            --declaration HeckeSkeleton.Moments.EngineStep.CompleteMovingRowRecipe.literalOriginalDictionary_rectangle \
            --declaration HeckeSkeleton.Moments.EngineStep.CompleteMovingRowRecipe.literalOriginalDictionary_centered \
            --evidence mom-b2-profile-root
      - name: Publish the original module evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-b2-profile-root-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mom-b2-profile-root/
            mom-b2-profile-identity/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify the five repaired literal roots and their eleven original declarations
        run: |
          python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralExtraction \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralAtlas \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralMovingTwist \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralTwoStages \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralPoolAtlas \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralRectangles.Atoms.extract_whole \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralRectangles.Atoms.extract_gaussScale \
            --declaration HeckeSkeleton.Moments.EngineStep.CartesianSourceReindex.supportResidualLabelBranch_index \
