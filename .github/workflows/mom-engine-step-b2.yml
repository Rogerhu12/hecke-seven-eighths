      - name: Verify the four inherited original image modules
        run: |
          python3 -u - <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          prefix = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP.'
          modules = [prefix + name for name in ['ActualCoveredFibre', 'NormalizedOriginalImageMass', 'OriginalTaggedLocalIndex']]
          print_modules = ['ActualCoveredFibre', 'NormalizedOriginalImageMass', 'OriginalAmplifiedCarrier', 'OriginalTaggedLocalIndex']
