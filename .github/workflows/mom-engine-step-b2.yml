        run: |
          python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralProfileScalars \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralProfileScalars.plainFactor_product_of_equal_product \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralProfileScalars.balance_preserves_product \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralRectangles.Atoms.extracted_plainFactor_product \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralRectangles.Atoms.ProfileData.secondInput_left_shape \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralRectangles.Atoms.ProfileData.secondInput_right_shape \
            --declaration HeckeSkeleton.Moments.EngineStep.CanonicalLiteralRectangles.Atoms.ProfileData.secondInput_slot_shape \
            --evidence mom-b2-profile-scalars-root
      - name: Verify all forty-six Actual-independent modules in the owned downstream closure
        run: |
          python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralAllocationAtoms \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralCalibratedDeletion \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralChartLocations \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralCommonLeaf \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalLiteralDirectAtlas \
