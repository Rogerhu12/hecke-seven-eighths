name: A2 owner D literal and column orientation native verification

on:
  push:
    branches: [cloud/mom-engine-step-a2-d-literal-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-d-literal-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-d-literal-native
          git show --no-patch --format=fuller HEAD > a2-d-literal-native/checkout.txt
          cat > a2-d-literal-native/provenance.py <<'PY'
          import hashlib, json, os, re, subprocess, sys, tomllib
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'a2-d-literal-native'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')
          sources = sorted(str(p) for p in task.glob('*.lean'))
          configs = ['lean-toolchain', 'lakefile.toml', 'lake-manifest.json',
                     'vendor/class-field-theory/lean-toolchain',
                     'vendor/class-field-theory/lakefile.toml',
                     'vendor/class-field-theory/lake-manifest.json', str(task / 'verify.py')]
          interface = (task / 'Interface.lean').read_text()
          imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', interface, re.M)))
          libraries = [x['name'] for x in tomllib.loads(Path('lakefile.toml').read_text())['lean_lib']]
          source_base = 'f4015db39681e8517d5af53b26d00f1ee51747cd'
          source_base_tree = git('rev-parse', source_base + '^{tree}')
          assert source_base_tree == '578ffd2d5f2cc891c1637434d37228e031d7823b'
          assert git('rev-parse', 'HEAD^') == source_base
          assert len(git('rev-list', '--parents', '-n', '1', 'HEAD').split()) == 2
          changed = git('diff', '--name-only', source_base, 'HEAD').splitlines()
          assert set(changed) == {'.github/workflows/mom-engine-step-a2-d-literal-native.yml',
                                  'HeckeSkeleton/Moments/MOM_ENGINE_STEP/OrdinaryLiteralExceptionalLeaf.lean'}
          source_relative = str(task / 'OrdinaryLiteralExceptionalLeaf.lean')
          original_source = subprocess.check_output(['git', 'show', source_base + ':' + source_relative])
          candidate_source = (root / source_relative).read_bytes()
          original_source_sha256 = hashlib.sha256(original_source).hexdigest()
          assert len(original_source) == 21240 and original_source_sha256 == 'f49992a4d96d0e86c404cb0e0138d613d30100b8405e1964b9258349ad4daee0'
          assert len(candidate_source) == 21285 and digest(source_relative) == '09e4b083c71e6773b55fda90ab3412e7f4214552afc8e74f8b96c79705f72a7f'
          option = b'set_option linter.unusedSectionVars false in\n'
          anchor = (b'/-- An exact outer scalar identity joins the actual source estimate to\n'
                    b'this original leaf.  The complete occurrence allocations are identified\n'
                    b'after their literal inclusion into the earlier arithmetic cap. -/\n'
                    b'theorem ordinary_exceptional_cost_from_original_atoms\n')
          assert len(option) == 45 and original_source.count(anchor) == 1
          assert b'set_option ' not in original_source and candidate_source.count(b'set_option ') == 1
          assert candidate_source == original_source.replace(anchor, option + anchor, 1)
          assert candidate_source.replace(option + anchor, anchor, 1) == original_source
          assert digest(str(task / 'ActualExceptionalColumnOrientation.lean')) == 'bc70a93db526345f510cb5978feaae632449866839d799222d7b80a5dfe4810a'
          assert digest(str(task / 'ActualGaussFiniteLeaves.lean')) == 'b81c8566cf067792b4e25363381a746281df5460a1e81dad68590ec090d742e2'
          assert digest(str(task / 'verify.py')) == '1be80b89c66818fa20e680a6850818ed4499ddf2d7d5789a9b63398c3279c148'
          record = {'source_base': source_base, 'source_base_tree': source_base_tree,
                    'changed_paths_from_base': changed,
                    'candidate_branch_only': True, 'full_task_acceptance': False,
                    'owner_adoption_performed_by_this_workflow': False,
                    'owner_scope_approval_comment': 6566736051,
                    'approved_scope_declaration': 'HeckeSkeleton.Moments.EngineStep.ordinary_exceptional_cost_from_original_atoms',
                    'original_source_sha256': original_source_sha256,
                    'candidate_scope_added_bytes': 45,
                    'source_inverse_to_parent_verified': True,
                    'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'expected_head': os.environ['EXPECTED_SHA'],
                    'tracked_status': git('status', '--porcelain=v1', '--untracked-files=no'),
                    'tracked_sha256': {p: digest(p) for p in tracked},
                    'task_source_sha256': {p: digest(p) for p in sources},
                    'config_sha256': {p: digest(p) for p in configs},
                    'interface_imports': imports, 'libraries': libraries}
          phase = sys.argv[1]
          (evidence / (phase + '-source.json')).write_text(json.dumps(record, indent=2) + '\n')
          assert record['head'] == record['expected_head'], 'Unexpected checkout SHA'
          assert not record['tracked_status'], 'Tracked source changes detected'
          assert len(sources) == 1009, 'Task module inventory changed'
          assert len(imports) == 1008, 'Complete Interface import inventory changed'
          assert len(libraries) == 20, 'Library inventory changed'
          if phase == 'after':
              before = json.loads((evidence / 'before-source.json').read_text())
              assert before == record, 'Source, configuration, index inventory or HEAD changed'
              (evidence / 'source-integrity.json').write_text(json.dumps({
                  'unchanged': True, 'head': record['head'], 'tree': record['tree'],
                  'tracked_files': len(tracked), 'task_modules': len(sources),
                  'interface_imports': len(imports), 'libraries': len(libraries)}, indent=2) + '\n')
          print(f'{phase}: {record["head"]} tree={record["tree"]}; {len(tracked)} tracked files, {len(sources)} task modules, {len(libraries)} libraries')
          PY
          cat > a2-d-literal-native/run.py <<'PY'
          import datetime, json, re, subprocess, sys, time
          from pathlib import Path
          name, seconds, *command = sys.argv[1:]
          evidence = Path('a2-d-literal-native')
          wrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]
          record = {'command': command, 'wrapper': wrapper, 'completed': False,
                    'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          receipt = evidence / (name + '-result.json')
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          start = time.monotonic()
          compact = name == 'dependencies'
          show_block = not compact
          with (evidence / (name + '-console.log')).open('w') as log:
              process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  if compact:
                      clean = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      if re.match(r'^[✔✖⚠ℹ]\s+\[\d+/\d+\]', clean):
                          show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')
                      elif re.match(r'^(error|warning|info):', clean):
                          show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')
                      elif clean.startswith('Some required targets logged failures:'):
                          show_block = True
                  if show_block:
                      print(line, end='', flush=True)
              code = process.wait()
          record.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,
                        finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record), flush=True)
          sys.exit(code if code >= 0 else 128 - code)
          PY
          python3 a2-d-literal-native/provenance.py before
      - name: Provide enough memory mappings for the full legacy import closure
        run: |
          MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > a2-d-literal-native/memory-mapping.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build the original import closure separately
        id: dependencies
        run: |
          python3 -u a2-d-literal-native/run.py dependencies 1200 \
            lake build +HeckeSkeleton.Moments.MOM_ENGINE_STEP.OrdinaryLiteralExceptionalLeaf:deps \
              +HeckeSkeleton.Moments.MOM_ENGINE_STEP.ActualExceptionalColumnOrientation:deps
      - name: Compile both original modules and freshly audit every loaded task declaration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 -u a2-d-literal-native/run.py verification 1200 \
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.OrdinaryLiteralExceptionalLeaf \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.ActualExceptionalColumnOrientation \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.OrdinaryExceptionalBinding.exceptionalIntegrand_eq \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.OrdinaryExceptionalBinding.exceptionalCost_eq \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.ConstantAtomExtraction.ordinaryExceptionalCost_eq_frames \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.ordinaryExceptionalBindingOnCorrelationSupport \
            --declaration HeckeSkeleton.Moments.EngineStep.ordinary_exceptional_cost_from_original_atoms \
            --declaration HeckeSkeleton.Moments.EngineStep.jointFourierColumn_star_neg \
            --declaration HeckeSkeleton.Moments.EngineStep.PairedFiniteCharacters.swapColumns_thetaClass \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.terminalTranspose_exceptionalCost \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.terminalTranspose_ordinaryCost \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.thetaClassLeaf_terminalTranspose \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.ExceptionalBinding.terminalTranspose \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualHybridLeaf.OrdinaryExceptionalBinding.terminalTranspose \
            --evidence a2-d-literal-native/verify
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a2-d-literal-native/provenance.py after
      - name: Preserve original compiler logs, timings, source hashes and fresh axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-d-literal-native-native-${{ github.sha }}-${{ github.run_attempt }}
          path: a2-d-literal-native/
          if-no-files-found: error
          retention-days: 14
