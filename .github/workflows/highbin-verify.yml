name: HIGHBIN proof verification

on:
  pull_request:
    paths:
      - 'HeckeSkeleton/HighBin.lean'
      - 'HeckeSkeleton/HighBinSupport.lean'
      - 'HeckeSkeleton/HighBinSupport/**'
      - 'HeckeGeneral/Analysis/FiniteEulerRational.lean'
      - 'HeckeGeneral/Analysis/AnnularTest.lean'
      - 'HeckeGeneral/Analysis/PrimeWindowGeometry.lean'
      - 'HeckeGeneral/Analysis/GlobalThetaData.lean'
      - 'HeckeGeneral/Analysis/PhysicalProbeData.lean'
      - 'HeckeSkeleton/ThetaKernel/TestMellin.lean'
      - 'HeckeGeneral/Analysis/PhysicalProbeRows.lean'
      - 'HeckeGeneral/Analysis/PhysicalProbeRowData.lean'
      - 'vendor/flt/FLTReuse/**'
      - 'HeckeGeneral/Analysis/TInputRanges.lean'
      - 'HeckeGeneral/Analysis/RowEulerRegion.lean'
      - 'scripts/highbin_verify.py'
      - 'scripts/highbin_inventory.py'
      - 'scripts/highbin_lean_gate.py'
      - 'docs/highbin/**'
      - '.github/workflows/highbin-verify.yml'

permissions:
  contents: read

jobs:
  proofs:
    name: ${{ matrix.scope }}
    concurrency:
      group: ${{ matrix.scope == 'actual' && format('highbin-{0}', github.head_ref || github.ref_name) || format('highbin-{0}-{1}', github.head_ref || github.ref_name, matrix.scope) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scope: [core, mellin, fourier, actual]
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Release downloaded Mathlib archives
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          configured = os.environ.get('MATHLIB_CACHE_DIR')
          if configured is not None:
              cache_dir = Path(configured)
          else:
              cache_home = os.environ.get('XDG_CACHE_HOME')
              cache_dir = (Path(cache_home) if cache_home is not None else Path.home() / '.cache') / 'mathlib'
          archives = list(cache_dir.glob('*.ltar'))
          size = sum(p.stat().st_size for p in archives if p.is_file())
          for archive in archives:
              if archive.is_file():
                  archive.unlink()
          print(f'Released {size} bytes of downloaded archives; installed Lean objects retained.')
          PY
      # Restore after setup has checked out the dependency repositories.
      # Mathlib provides its own binary cache; duplicating it exhausted the
      # runner disk while compressing the previous whole-.lake archive.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
            .lake/packages/TauCeti/.lake/build
          key: highbin-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ matrix.scope }}-${{ github.sha }}
          restore-keys: |
            highbin-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ matrix.scope }}-
            highbin-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-actual-
            highbin-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-mellin-
            highbin-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-core-
      # A cancelled deep job cannot save its new dependency builds. Merge the
      # latest finite-Fourier checkpoint into its existing deeper cache; Lake
      # still validates source/import/toolchain traces before reusing objects.
      - name: Restore completed finite Fourier dependencies
        if: matrix.scope == 'actual' || matrix.scope == 'mellin'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
            .lake/packages/TauCeti/.lake/build
          key: highbin-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-fourier-${{ github.sha }}
          restore-keys: |
            highbin-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-fourier-
      # Preserve a reusable native dependency checkpoint before starting the
      # expensive arithmetic build, including when a runner later disappears.
      - name: Export restored project objects
        if: matrix.scope == 'actual'
        uses: actions/upload-artifact@v4
        with:
          name: highbin-restored-project-objects
          path: |
            .lake/build/lib/lean/
            vendor/class-field-theory/.lake/build/lib/lean/
            .lake/packages/TauCeti/.lake/build/lib/lean/
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 3
          retention-days: 3
      - name: Serialize native compilers
        run: >-
          python scripts/highbin_lean_gate.py
          --directory "$RUNNER_TEMP/highbin-lean-gate"
          --github-env "$GITHUB_ENV"
      - name: Compile modules and audit public declarations
        id: verification
        run: /usr/bin/time -v timeout --signal=TERM --kill-after=30s 60m python scripts/highbin_verify.py ${{ matrix.scope }}
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highbin-verification-${{ matrix.scope }}
          path: .highbin-verification/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Preserve completed dependency builds
        if: ${{ !cancelled() && steps.verification.outcome != 'skipped' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
            .lake/packages/TauCeti/.lake/build
          key: highbin-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ matrix.scope }}-${{ github.sha }}
