name: A2 Gated single-left warning comparison with complete-source GDB diagnostics only

on:
  push:
    branches: [cloud/mom-engine-step-a2-gated-left-warning-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-gated-left-warning-diagnostic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: gated_left_warning_control
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: '2'
      EXPECTED_SHA: ${{ github.sha }}
      A2_DIAGNOSTIC_VARIANT: gated_left_warning_control
      A2_DIAGNOSTIC_SCRIPT: .github/scripts/mom-engine-step-a2-gated-left-warning-stack-harness.py
      A2_DIAGNOSTIC_MODULE: HeckeSkeleton.Moments.MOM_ENGINE_STEP.GatedGaussStages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-gated-left-warning
          git show --no-patch --format=fuller HEAD > a2-gated-left-warning/checkout.txt
          cat > a2-gated-left-warning/provenance.py <<'PY'
          import hashlib, json, os, re, subprocess, sys, tomllib
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'a2-gated-left-warning'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')
          sources = sorted(str(p) for p in task.glob('*.lean'))
          configs = ['lean-toolchain', 'lakefile.toml', 'lake-manifest.json',
                     'vendor/class-field-theory/lean-toolchain',
                     'vendor/class-field-theory/lakefile.toml',
                     'vendor/class-field-theory/lake-manifest.json', str(task / 'verify.py')]
          interface = (task / 'Interface.lean').read_text()
          imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', interface, re.M)))
          libraries = [x['name'] for x in tomllib.loads(Path('lakefile.toml').read_text())['lean_lib']]
          source_base = 'f0206e8f6575f264498e28a348d1e5f508b95c3a'
          source_base_tree = git('rev-parse', source_base + '^{tree}')
          assert source_base_tree == '0cca3096765475ccce1552d409da8ec23a81a74e', 'Unexpected frozen auxiliary source tree'
          assert git('rev-parse', 'HEAD^') == source_base, 'Diagnostic must be a direct child of the frozen diagnostic head'
          parents = git('rev-list', '--parents', '-n', '1', 'HEAD').split()
          assert len(parents) == 2, 'Diagnostic commit must have one parent'
          changed = git('diff', '--name-only', source_base, 'HEAD').splitlines()
          allowed = {'.github/workflows/mom-engine-step-a2-gated-left-warning-diagnostic.yml',
                     '.github/scripts/mom-engine-step-a2-gated-left-warning-control.py',
                     '.github/scripts/mom-engine-step-a2-gated-left-warning-stack-driver.py',
                     '.github/scripts/mom-engine-step-a2-gated-left-warning-stack-harness.py'}
          assert set(changed) == allowed, 'Only the three reviewed temporary-control scripts and this workflow may differ'
          additions = git('diff', '--name-only', '--diff-filter=A', source_base, 'HEAD').splitlines()
          assert set(additions) == allowed, 'All four temporary-control files must be additions to the frozen auxiliary tree'
          assert os.environ['A2_DIAGNOSTIC_VARIANT'] == 'gated_left_warning_control'
          assert os.environ['A2_DIAGNOSTIC_SCRIPT'] == '.github/scripts/mom-engine-step-a2-gated-left-warning-stack-harness.py'
          assert os.environ['A2_DIAGNOSTIC_MODULE'] == 'HeckeSkeleton.Moments.MOM_ENGINE_STEP.GatedGaussStages'
          pins = {
              str(task / 'DirectCoveredStage.lean'): '243ed35cc7230b41cd4dbaae596b1332e98da6707253d08ba7de58c4650f8372',
              str(task / 'GatedGaussStages.lean'): '74103e801a3bcb1326d9c9dbf5f7b4238b66e034bba021436ad5d7059faf1d96',
              str(task / 'ActualGaussFiniteLeaves.lean'): 'b81c8566cf067792b4e25363381a746281df5460a1e81dad68590ec090d742e2',
              str(task / 'OrdinaryLiteralExceptionalLeaf.lean'): '09e4b083c71e6773b55fda90ab3412e7f4214552afc8e74f8b96c79705f72a7f',
              str(task / 'ActualExceptionalColumnOrientation.lean'): '2304963616c4daf16c15b860f1bfe5634f31d984f996a4205ef00362c9b2c77c',
              str(task / 'verify.py'): '1be80b89c66818fa20e680a6850818ed4499ddf2d7d5789a9b63398c3279c148',
              '.github/scripts/mom-engine-step-a2-direct-terminal-diagnostic.py': '86d769a0130bf0e057ab9fa4ae4fc0508f584b533ff12a7f84493088dc4d9374',
              '.github/scripts/mom-engine-step-a2-gated-terminal-diagnostic.py': '59a1b292289731ecb6f6c31816ae1f7d564e767f6241c361773682c5f6b757e6',
              '.github/workflows/mom-engine-step-a2-direct-gated-diagnostic.yml': 'ce0f96bcd0d095eb1c84e34fe91b6649ecf43a91893d3766df3347b940a3da45',
              '.github/scripts/mom-engine-step-a2-gated-stack-driver.py': '08a51bf300f3c7327d9ac3a4cbebd6b94a5d59baea08217cedde4224728cb2b9',
              '.github/scripts/mom-engine-step-a2-gated-stack-harness.py': '106a4a87350ac6eac1261d5c4dece558a94c2388442e13025354faa0b04965a8',
              '.github/workflows/mom-engine-step-a2-gated-finish-diagnostic.yml': 'd861fe80947c4e5b9ba04f7d13d1947b1c6841d3d56c6545bce490513f22180d',
              '.github/scripts/mom-engine-step-a2-gated-left-warning-control.py': '01211d56ff2f2b71843dfec26b751e042aab4f09e2d05f0aed622d278f4399cb',
              '.github/scripts/mom-engine-step-a2-gated-left-warning-stack-driver.py': '20a2294f551225c6f45b6b99bfc0b43a9ada97051b03d001c92daa94278b5c50',
              '.github/scripts/mom-engine-step-a2-gated-left-warning-stack-harness.py': '2f4e24b6fc30c1dabc9e9227cc146752679b5f8bc35e5f132ad9864c44e0ee35',
          }
          for path, expected in pins.items():
              assert digest(path) == expected, 'Unexpected frozen source or diagnostic wrapper: ' + path
          record = {'source_base': source_base, 'source_base_tree': source_base_tree,
                    'changed_paths_from_base': changed, 'diagnostic_variant': os.environ['A2_DIAGNOSTIC_VARIANT'],
                    'diagnostic_only': True,
                    'diagnostic_module': os.environ['A2_DIAGNOSTIC_MODULE'],
                    'diagnostic_script': os.environ['A2_DIAGNOSTIC_SCRIPT'],
                    'source_and_script_pins': pins,
                    'production_source_changed': False, 'production_warning_exception_approved': False,
                    'temporary_warning_scope': 'HeckeSkeleton.Moments.EngineStep.ActualGaussStage.gated_leaf_left_nonzero',
                    'temporary_warning_option': 'linter.unusedSectionVars',
                    'temporary_warning_value': False, 'temporary_scope_only': True,
                    'all_other_declarations_default': True,
                    'acceptance_evidence': False, 'original_module_native_was_run': False,
                    'original_module_acceptance': False, 'complete_target_module_compiled': False,
                    'complete_module_within_five_minutes': False, 'full_task_acceptance': False,
                    'compiler_outputs_can_be_restored_as_project_cache': False,
                    'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'expected_head': os.environ['EXPECTED_SHA'],
                    'tracked_status': git('status', '--porcelain=v1', '--untracked-files=no'),
                    'tracked_sha256': {p: digest(p) for p in tracked},
                    'task_source_sha256': {p: digest(p) for p in sources},
                    'config_sha256': {p: digest(p) for p in configs},
                    'interface_imports': imports, 'libraries': libraries}
          phase = sys.argv[1]
          (evidence / (phase + '-source.json')).write_text(json.dumps(record, indent=2) + '\n')
          assert record['head'] == record['expected_head'], 'Unexpected checkout SHA'
          assert not record['tracked_status'], 'Tracked source changes detected'
          assert len(sources) == 1009, 'Task module inventory changed'
          assert len(imports) == 1008, 'Complete Interface import inventory changed'
          assert len(libraries) == 20, 'Library inventory changed'
          if phase == 'after':
              before = json.loads((evidence / 'before-source.json').read_text())
              assert before == record, 'Source, configuration, index inventory or HEAD changed'
              (evidence / 'source-integrity.json').write_text(json.dumps({
                  'unchanged': True, 'head': record['head'], 'tree': record['tree'],
                  'tracked_files': len(tracked), 'task_modules': len(sources),
                  'interface_imports': len(imports), 'libraries': len(libraries)}, indent=2) + '\n')
          print(f'{phase}: {record["head"]} tree={record["tree"]}; {len(tracked)} tracked files, {len(sources)} task modules, {len(libraries)} libraries')
          PY
          cat > a2-gated-left-warning/run.py <<'PY'
          import datetime, json, re, subprocess, sys, time
          from pathlib import Path
          name, seconds, *command = sys.argv[1:]
          evidence = Path('a2-gated-left-warning')
          wrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]
          record = {'command': command, 'wrapper': wrapper, 'completed': False,
                    'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          receipt = evidence / (name + '-result.json')
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          start = time.monotonic()
          compact = name == 'dependencies'
          show_block = not compact
          with (evidence / (name + '-console.log')).open('w') as log:
              process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  if compact:
                      clean = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      if re.match(r'^[✔✖⚠ℹ]\s+\[\d+/\d+\]', clean):
                          show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')
                      elif re.match(r'^(error|warning|info):', clean):
                          show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')
                      elif clean.startswith('Some required targets logged failures:'):
                          show_block = True
                  if show_block:
                      print(line, end='', flush=True)
              code = process.wait()
          record.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,
                        finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record), flush=True)
          sys.exit(code if code >= 0 else 128 - code)
          PY
          python3 a2-gated-left-warning/provenance.py before
      - name: Provide enough memory mappings for the full legacy import closure
        run: |
          MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > a2-gated-left-warning/memory-mapping.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build the original import closure separately
        id: dependencies
        run: |
          python3 -u a2-gated-left-warning/run.py dependencies 1200 \
            lake build "+${A2_DIAGNOSTIC_MODULE}:deps"
      - name: Install and verify the standard GDB harness dependency
        id: debugger
        timeout-minutes: 8
        run: |
          python3 -u - <<'PYGDB'
          import json, pathlib, shutil, subprocess
          evidence = pathlib.Path('a2-gated-left-warning')
          evidence.mkdir(exist_ok=True)
          gdb = shutil.which('gdb')
          result = {
              'scope': 'diagnostic-only GDB harness dependency setup',
              'gdb_preinstalled': gdb is not None,
              'dependency_install_attempted': False,
              'installed_or_modified_any_dependency': False,
              'changed_system_security_settings': False,
              'debugger_runs_as_root': False,
              'complete_target_module_compiled': False,
              'original_module_acceptance': False,
              'full_task_acceptance': False,
              'exit_code': 1,
          }
          try:
              if gdb is None:
                  result['dependency_install_attempted'] = True
                  result['installed_or_modified_any_dependency'] = True
                  with (evidence / 'gdb-install.log').open('w') as log:
                      for command in [
                          ['sudo', 'apt-get', 'update'],
                          ['sudo', 'apt-get', 'install', '--yes', '--no-install-recommends', 'gdb'],
                      ]:
                          log.write('COMMAND: ' + ' '.join(command) + '\n')
                          log.flush()
                          subprocess.run(command, stdout=log, stderr=subprocess.STDOUT,
                                         stdin=subprocess.DEVNULL, timeout=180, check=True)
                  gdb = shutil.which('gdb')
              result['gdb_available'] = gdb is not None
              result['gdb_path'] = gdb
              if gdb is None:
                  result['reason'] = 'The standard package install did not provide gdb'
              else:
                  process = subprocess.run([gdb, '--version'], text=True, capture_output=True, timeout=10)
                  result['gdb_version_first_line'] = process.stdout.splitlines()[0] if process.stdout else ''
                  result['version_exit_code'] = process.returncode
                  result['exit_code'] = 0 if process.returncode == 0 else 1
          except (OSError, subprocess.SubprocessError) as error:
              result['reason'] = str(error)
          (evidence / 'harness-dependency.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result), flush=True)
          raise SystemExit(result['exit_code'])
          PYGDB
      - name: Diagnose the complete reversible source using the pinned variant
        id: diagnostic
        run: |
          python3 -u "$A2_DIAGNOSTIC_SCRIPT" \
            --repo "$GITHUB_WORKSPACE" --evidence a2-gated-left-warning/diagnostic
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a2-gated-left-warning/provenance.py after
      - name: Preserve diagnostic output, dependency logs, source hashes and false acceptance flags
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-gated-left-warning-default-gdb-${{ github.sha }}-${{ github.run_attempt }}
          path: a2-gated-left-warning/
          if-no-files-found: error
          retention-days: 14

