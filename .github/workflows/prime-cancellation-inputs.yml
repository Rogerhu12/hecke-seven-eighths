name: Prime cancellation input modules

on:
  push:
    branches: [wire/prime-cancellation-20261031]
  pull_request:
    branches: [dtests-handoff]
    paths:
      - 'HeckeSkeleton/PrimeCancellation*.lean'
      - '.github/workflows/prime-cancellation-inputs.yml'

permissions:
  contents: read

concurrency:
  group: prime-cancellation-inputs-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - HeckeSkeleton.PrimeCancellationBounds
          - HeckeSkeleton.PrimeCancellationCounting
          - HeckeSkeleton.PrimeCancellationHecke
          - HeckeSkeleton.PrimeCancellationPolynomials
          - HeckeSkeleton.PrimeCancellationWindows
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore shared project dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-cancellation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            prime-cancellation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore checked inputs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-cancellation-input-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            prime-cancellation-input-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            prime-cancellation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Compile the input module
        env:
          PRIME_MODULE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p prime-verification
          lean --version | tee prime-verification/environment.log
          lake --fail-fast build "+${PRIME_MODULE}:olean" 2>&1 | tee prime-verification/build.log
      - name: Stop cancelled compiler processes before caching
        if: cancelled()
        run: |
          pkill -TERM -x lake || true
          pkill -TERM -x lean || true
          for PRIME_POLL in {1..10}; do
            if ! pgrep -x lake > /dev/null && ! pgrep -x lean > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          pkill -KILL -x lake || true
          pkill -KILL -x lean || true
      - name: Save checked inputs
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-cancellation-input-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Preserve input verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prime-cancellation-${{ matrix.target }}
          path: prime-verification/
          if-no-files-found: ignore
