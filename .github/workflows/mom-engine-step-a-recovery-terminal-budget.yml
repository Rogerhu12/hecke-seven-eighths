          def git(root, *args):
              return subprocess.check_output(['git', *args], cwd=root, text=True).strip()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def identity(data):
              return [len(data), sha(data), hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()]

          def one_replace(data, old, new):
              assert data.count(old) == 1, 'Original proof edit anchor is not unique'
              return data.replace(old, new, 1)

          def validate_source_bytes(stem, original, current):
              pin = PINS[stem]
              assert identity(original) == pin['original'], 'Unexpected direct-parent source: ' + stem
              assert identity(current) == pin['candidate'], 'Unexpected complete proof candidate: ' + stem
              edits = [x for x in EDITS if x['file'] == stem + '.lean']
              expected = original
              for edit in edits:
                  old, new = edit['old'].encode(), edit['new'].encode()
                  offset = edit['original_byte_offset']
                  assert original[offset:offset + len(old)] == old
                  assert sha(old) == edit['old_sha256'] and sha(new) == edit['new_sha256']
                  expected = one_replace(expected, old, new)
              assert expected == current, 'The candidate must contain exactly the frozen proof edits'
              assert stem == 'CanonicalTerminalBudget'
              assert len(current) - len(original) == 22 and len(edits) == 2
              for order in [edits, list(reversed(edits))]:
                  recovered = current
                  for edit in order:
                      recovered = one_replace(recovered, edit['new'].encode(), edit['old'].encode())
                  assert recovered == original, 'Proof-only inverse must recover the exact owner bytes'
              for pattern, key in [(rb'^import (.+)$', 'original_imports'), (rb'^#print axioms (.+)$', 'original_prints')]:
                  before = [x.decode() for x in re.findall(pattern, original, re.M)]
                  after = [x.decode() for x in re.findall(pattern, current, re.M)]
                  assert before == after == pin[key], 'Original imports or print targets changed'
              assert re.findall(rb'^set_option\b.*$', original, re.M) == re.findall(rb'^set_option\b.*$', current, re.M)
              return {'original': pin['original'], 'candidate': pin['candidate'],
                      'exact_forward_and_two_inverse_orders': True, 'proof_scopes': pin['proof_scopes'],
                      'original_imports': pin['original_imports'], 'original_prints': pin['original_prints']}

          def validate_source_files(root):
              result = {}
              for stem in PINS:
                  path = TASK + '/' + stem + '.lean'
                  original = subprocess.check_output(['git', 'show', SOURCE_BASE + ':' + path], cwd=root)
                  assert git(root, 'rev-parse', SOURCE_BASE + ':' + path) == PINS[stem]['original'][2]
                  result[path] = validate_source_bytes(stem, original, (root / path).read_bytes())
              return result

          def validate_inventory_bytes(source_bytes, config_bytes):
              sources = sorted(source_bytes)
              config = {p: sha(config_bytes[p]) for p in CONFIG_PINS}
              assert config == CONFIG_PINS, 'Fixed verifier or configuration changed'
              assert config_bytes['lean-toolchain'].decode().strip() == 'leanprover/lean4:v4.35.0-rc3'
              lake = tomllib.loads(config_bytes['lakefile.toml'].decode())
              assert lake['weakLeanArgs'] == ['-j2']
              assert lake['leanOptions'] == {'autoImplicit': False, 'relaxedAutoImplicit': False}
              mathlib = [p for p in json.loads(config_bytes['lake-manifest.json'])['packages'] if p['name'] == 'mathlib']
              assert len(mathlib) == 1 and mathlib[0]['rev'] == '0493595ecd5da8ef14742febab99728f98e948e8'
              imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', source_bytes[TASK + '/Interface.lean'].decode(), re.M)))
              libraries = [x['name'] for x in lake['lean_lib']]
              assert len(sources) == 1009 and len(imports) == 1008 and len(libraries) == 20
              graph = {Path(p).stem: re.findall(r'^import HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.([A-Za-z_0-9]+)\s*$', source_bytes[p].decode(), re.M) for p in sources}
              closures = {}
              for target in TARGETS:
                  closure, pending = set(), [target]
                  while pending:
                      name = pending.pop()
                      if name in closure:
                          continue
                      assert name in graph, 'Missing STEP import: ' + name
                      closure.add(name)
                      pending.extend(graph[name])
                  closures[target] = sorted(closure)
              assert closures == EXPECTED_CLOSURES, 'The original TerminalBudget import closure changed'
              union = sorted(set().union(*[set(c) for c in closures.values()]))
              assert not set(EXCLUDED_KNOWN_ROOTS).intersection(union)
              return {'task_source_sha256': {p: sha(source_bytes[p]) for p in sources},
                      'config_sha256': config, 'interface_imports': imports, 'libraries': libraries,
                      'target_STEP_import_closures': closures, 'combined_STEP_import_closure': union,
                      'excluded_known_roots': EXCLUDED_KNOWN_ROOTS}

          def main():
              root = Path.cwd()
              evidence = root / EVIDENCE
              phase = sys.argv[1]
              assert phase in ['before', 'after']
              assert git(root, 'rev-parse', SOURCE_BASE + '^{tree}') == SOURCE_TREE
              parents = git(root, 'rev-list', '--parents', '-n', '1', 'HEAD').split()[1:]
              assert parents == [SOURCE_BASE], 'Auxiliary commit must have the exact single owner parent'
              expected_sources = sorted(TASK + '/' + stem + '.lean' for stem in PINS)
              changed = git(root, 'diff', '--no-renames', '--name-only', SOURCE_BASE, 'HEAD').splitlines()
              assert changed == sorted([WORKFLOW, *expected_sources]), 'Only the complete TerminalBudget proof candidate and this new workflow may change'
              statuses = git(root, 'diff', '--no-renames', '--name-status', SOURCE_BASE, 'HEAD').splitlines()
              assert statuses == sorted(['A\t' + WORKFLOW, *('M\t' + p for p in expected_sources)])
              source_identity = validate_source_files(root)
              source_bytes = {str(p.relative_to(root)): p.read_bytes() for p in (root / TASK).glob('*.lean')}
              config_bytes = {p: (root / p).read_bytes() for p in CONFIG_PINS}
              inventory = validate_inventory_bytes(source_bytes, config_bytes)
              assert os.environ['LEAN_NUM_THREADS'] == '2'
              tracked = subprocess.check_output(['git', 'ls-files', '-z'], cwd=root).decode().split('\0')[:-1]
              record = {'stage': 'Complete g1 TerminalBudget module: normal native and fresh loaded namespace audit',
                        'source_base': SOURCE_BASE, 'source_base_tree': SOURCE_TREE, 'parents': parents,
                        'complete_proof_candidates': source_identity,
                        'target_modules': ['HeckeSkeleton.Moments.MOM_ENGINE_STEP.' + x for x in TARGETS],
                        'original_target_prints': {x: PINS[x]['original_prints'] for x in TARGETS},
                        'full_task_acceptance': False, 'changed_paths_from_base': changed,
                        'head': git(root, 'rev-parse', 'HEAD'), 'tree': git(root, 'rev-parse', 'HEAD^{tree}'),
                        'expected_head': os.environ['EXPECTED_SHA'],
                        'tracked_status': git(root, 'status', '--porcelain=v1', '--untracked-files=no'),
                        'tracked_sha256': {p: sha((root / p).read_bytes()) for p in tracked}, **inventory}
              (evidence / (phase + '-source.json')).write_text(json.dumps(record, indent=2) + '\n')
              assert record['head'] == record['expected_head'], 'Unexpected checkout SHA'
              assert not record['tracked_status'], 'Tracked source changes detected'
              if phase == 'after':
                  before = json.loads((evidence / 'before-source.json').read_text())
                  assert before == record, 'Source, configuration, inventories or HEAD changed'
                  (evidence / 'source-integrity.json').write_text(json.dumps({
                      'unchanged': True, 'head': record['head'], 'tree': record['tree'],
                      'tracked_files': len(tracked), 'task_modules': len(inventory['task_source_sha256']),
                      'interface_imports': len(inventory['interface_imports']),
                      'libraries': len(inventory['libraries'])}, indent=2) + '\n')
              print(f'{phase}: {record["head"]} tree={record["tree"]}; {len(tracked)} tracked files, 1009 task modules, 20 libraries')

          if __name__ == '__main__':
              main()
          PY
          cat > a-recovery-terminal-budget/run.py <<'PY'
          import datetime, json, re, subprocess, sys, time
          from pathlib import Path
          name, seconds, *command = sys.argv[1:]
          evidence = Path('a-recovery-terminal-budget')
          wrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]
          record = {'command': command, 'wrapper': wrapper, 'completed': False,
                    'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          receipt = evidence / (name + '-result.json')
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          start = time.monotonic()
          compact = name == 'dependencies'
          show_block = not compact
          with (evidence / (name + '-console.log')).open('w') as log:
              process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  if compact:
                      clean = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      if re.match(r'^[✔✖⚠ℹ]\s+\[\d+/\d+\]', clean):
                          show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')
                      elif re.match(r'^(error|warning|info):', clean):
                          show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')
                      elif clean.startswith('Some required targets logged failures:'):
                          show_block = True
                  if show_block:
                      print(line, end='', flush=True)
              code = process.wait()
          record.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,
                        finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record), flush=True)
          sys.exit(code if code >= 0 else 128 - code)
          PY
          python3 a-recovery-terminal-budget/provenance.py before
      - name: Provide enough memory mappings for the full legacy import closure
        run: |
          MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > a-recovery-terminal-budget/memory-mapping.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build the original import closure separately
        id: dependencies
        run: |
          python3 -u a-recovery-terminal-budget/run.py dependencies 1200 \
            lake build +HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalTerminalBudget:deps
      - name: Compile the complete original module and freshly audit every loaded task declaration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 -u a-recovery-terminal-budget/run.py verification 1200 \
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.CanonicalTerminalBudget \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualPoolStages.TerminalCalibration.zeroBudget_le \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualPoolStages.TerminalCalibration.tailBudget_le \
            --evidence a-recovery-terminal-budget/verify
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a-recovery-terminal-budget/provenance.py after
      - name: Preserve original compiler logs, timings, source hashes and fresh axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-recovery-terminal-budget-native-${{ github.sha }}-${{ github.run_attempt }}
          path: a-recovery-terminal-budget/
          if-no-files-found: error
          retention-days: 14
