name: A recovery g1 CanonicalTerminalBudget native verification

on:
  push:
    branches: [cloud/mom-engine-step-a-recovery-terminal-budget]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a-recovery-terminal-budget-${{ github.sha }}
  cancel-in-progress: false

jobs:
  terminal_budget:
    name: CanonicalTerminalBudget normal native and fresh audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      EXPECTED_SHA: ${{ github.sha }}
