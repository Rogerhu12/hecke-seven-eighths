name: Moment uniformity and amplification

on:
  push:
    branches: [cloud/mom-uniform-amplify]
  pull_request:
    branches: [dtests-handoff]
    paths:
      - HeckeSkeleton/Moments/MOM_UNIFORM_AMPLIFY/**
      - HeckeSkeleton/Moments.lean
      - .github/workflows/mom-uniform-amplify.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mom-uniform-amplify-${{ github.event_name == 'push' && github.ref_name || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pure:
    name: Pure numerical proofs and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned Lean environment and caches
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'true'
      - name: Compile and audit the independent numerical proofs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mom-uniform-amplify-pure"
          {
            git rev-parse HEAD
            lake env lean --version
            git -C .lake/packages/mathlib rev-parse HEAD
          } | tee "$RUNNER_TEMP/mom-uniform-amplify-pure/environment.log"
          lake --rehash --fail-fast build +HeckeSkeleton.Moments.MOM_UNIFORM_AMPLIFY.PureAudit:olean 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify-pure/build.log"
          lake env lean HeckeSkeleton/Moments/MOM_UNIFORM_AMPLIFY/PureAudit.lean 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify-pure/axioms.log"
      - name: Preserve independent numerical proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-uniform-amplify-pure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mom-uniform-amplify-pure/
          if-no-files-found: warn
          retention-days: 14

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned Lean environment and caches
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'true'
      - name: Record the source and compiler environment
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mom-uniform-amplify"
          {
            git rev-parse HEAD
            lake env lean --version
            git -C .lake/packages/mathlib rev-parse HEAD
          } | tee "$RUNNER_TEMP/mom-uniform-amplify/environment.log"
      - name: Restore previously checked task build products
        id: project_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: mom-uniform-amplify-native-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mom-uniform-amplify-native-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Check out the pinned dependency-cache source
        if: steps.project_cache.outputs.cache-matched-key == ''
        id: foundation_source
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Rogerhu12/hecke-seven-eighths
          ref: 984b0de3ddf8bd9ea8051e0325765532c7c6550f
          path: .mom-foundation-baseline
          persist-credentials: false
      - name: Download successful dependency-export groups
        if: steps.foundation_source.outcome == 'success'
        id: foundation_download
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          github-token: ${{ github.token }}
          repository: Rogerhu12/hecke-seven-eighths
          run-id: 41126752041
          artifact-ids: 13012376359,13011719707,13011754956,13013018508,13017749400,13018611868,13018074066,13015618946,13021712535,13021514563,13021895900,13022623396
          path: ${{ runner.temp }}/mom-foundation-downloads
      - name: Validate and restore the dependency prefix
        if: steps.foundation_download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 HeckeSkeleton/Moments/MOM_UNIFORM_AMPLIFY/restore_foundation.py             "$GITHUB_WORKSPACE/.mom-foundation-baseline"             "$RUNNER_TEMP/mom-foundation-downloads" 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify/foundation-restore.log"
      - name: Compile every new proof and reject nonstandard axioms
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          lake --rehash --fail-fast build +HeckeSkeleton.Moments.MOM_UNIFORM_AMPLIFY.Audit:olean 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify/build.log"
          lake env lean HeckeSkeleton/Moments/MOM_UNIFORM_AMPLIFY/Audit.lean 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify/axioms.log"
      - name: Compile the original skeleton adapter
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          lake --rehash --fail-fast build +HeckeSkeleton.Moments:olean 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify/skeleton-build.log"
      - name: Check the six original task names against the same axiom allowlist
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mom-uniform-amplify'
          names = [
              'HeckeSkeleton.moment_profile_control',
              'HeckeSkeleton.moment_row_eligibility',
              'HeckeSkeleton.moment_finite_sector_reindex',
              'HeckeSkeleton.inverse_sixth_power_masks',
              'HeckeSkeleton.inverse_independent_amplification',
              'HeckeSkeleton.inverse_amplified_witness_models',
          ]
          source = directory / 'OriginalTaskAxioms.lean'
          source_dependencies = [
              'HeckeSkeleton.SourceMomentIndex',
              'HeckeSkeleton.SourceMomentModels',
              'HeckeSkeleton.momentModels',
          ]
          source.write_text('import HeckeSkeleton.Moments\n' +
                            ''.join(f'#print axioms {name}\n'
                                    for name in source_dependencies + names))
          result = subprocess.run(['lake', 'env', 'lean', str(source)],
                                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (directory / 'original-target-axioms.log').write_text(result.stdout)
          print(result.stdout, end='')
          if result.returncode:
              raise SystemExit(result.returncode)
          pattern = r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          records = dict(re.findall(pattern, result.stdout, re.S))
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          failures = []
          for name in names:
              if name not in records:
                  failures.append(f'{name}: audit result missing')
                  continue
              axioms = {item.strip() for item in records[name].split(',') if item.strip()}
              extra = axioms - allowed
              if extra:
                  failures.append(f'{name}: {sorted(extra)}')
          if failures:
              print('Original task targets still have unresolved source dependencies:')
              print('\n'.join(failures))
              raise SystemExit(1)
          print('All six original targets passed the axiom allowlist.')
          PY
      - name: Stop this runner's compilers before a cancelled cache save
        if: cancelled()
        shell: bash
        run: |
          pkill -TERM -x lake || true
          pkill -TERM -x lean || true
          for MOM_POLL in {1..10}; do
            if ! pgrep -x lake > /dev/null && ! pgrep -x lean > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          pkill -KILL -x lake || true
          pkill -KILL -x lean || true
      - name: Preserve checked dependency progress for the next revision
        if: ${{ always() && steps.compile.outcome != '' && steps.compile.outcome != 'skipped' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: mom-uniform-amplify-native-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve complete compilation and axiom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-uniform-amplify-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mom-uniform-amplify/
          if-no-files-found: warn
          retention-days: 14
