name: Moment uniformity and amplification

on:
  push:
    branches: [cloud/mom-uniform-amplify]
  pull_request:
    branches: [dtests-handoff]
    paths:
      - HeckeSkeleton/Moments/MOM_UNIFORM_AMPLIFY/**
      - HeckeSkeleton/Moments.lean
      - .github/workflows/mom-uniform-amplify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-uniform-amplify-${{ github.event_name == 'push' && github.ref_name || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned Lean environment and caches
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'true'
      - name: Record the source and compiler environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mom-uniform-amplify"
          {
            git rev-parse HEAD
            lake env lean --version
            git -C .lake/packages/mathlib rev-parse HEAD
          } | tee "$RUNNER_TEMP/mom-uniform-amplify/environment.log"
      - name: Compile every new proof and reject nonstandard axioms
        shell: bash
        run: |
          set -euo pipefail
          lake build HeckeSkeleton.Moments.MOM_UNIFORM_AMPLIFY.Audit 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify/build.log"
          lake env lean HeckeSkeleton/Moments/MOM_UNIFORM_AMPLIFY/Audit.lean 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify/axioms.log"
      - name: Compile the original skeleton adapter
        shell: bash
        run: |
          set -euo pipefail
          lake build HeckeSkeleton.Moments 2>&1 |
            tee "$RUNNER_TEMP/mom-uniform-amplify/skeleton-build.log"
      - name: Check the six original task names against the same axiom allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mom-uniform-amplify'
          names = [
              'HeckeSkeleton.moment_profile_control',
              'HeckeSkeleton.moment_row_eligibility',
              'HeckeSkeleton.moment_finite_sector_reindex',
              'HeckeSkeleton.inverse_sixth_power_masks',
              'HeckeSkeleton.inverse_independent_amplification',
              'HeckeSkeleton.inverse_amplified_witness_models',
          ]
          source = directory / 'OriginalTaskAxioms.lean'
          source.write_text('import HeckeSkeleton.Moments\n' +
                            ''.join(f'#print axioms {name}\n' for name in names))
          result = subprocess.run(['lake', 'env', 'lean', str(source)],
                                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (directory / 'original-target-axioms.log').write_text(result.stdout)
          print(result.stdout, end='')
          if result.returncode:
              raise SystemExit(result.returncode)
          pattern = r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          records = dict(re.findall(pattern, result.stdout, re.S))
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          failures = []
          for name in names:
              if name not in records:
                  failures.append(f'{name}: audit result missing')
                  continue
              axioms = {item.strip() for item in records[name].split(',') if item.strip()}
              extra = axioms - allowed
              if extra:
                  failures.append(f'{name}: {sorted(extra)}')
          if failures:
              print('Original task targets still have unresolved source dependencies:')
              print('\n'.join(failures))
              raise SystemExit(1)
          print('All six original targets passed the axiom allowlist.')
          PY
      - name: Preserve complete compilation and axiom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-uniform-amplify-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mom-uniform-amplify/
          if-no-files-found: warn
          retention-days: 14
