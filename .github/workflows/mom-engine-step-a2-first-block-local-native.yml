name: A2 FirstBlock local instances and sum repair native verification

on:
  push:
    branches: [cloud/mom-engine-step-a2-first-block-local-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-first-block-local-native-${{ github.sha }}
  cancel-in-progress: false

