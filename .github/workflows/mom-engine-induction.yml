name: Paired moment induction

on:
  pull_request:
    branches: [dtests-handoff]
    paths:
      - HeckeSkeleton/Moments/MOM_ENGINE_INDUCTION/**
      - .github/workflows/mom-engine-induction.yml
      - lean-toolchain
      - lake-manifest.json
      - lakefile.toml
  workflow_dispatch:

permissions:
  contents: read

# PR checks keep using the same PR cache scope across source heads. A manual
# request for the same exact source head shares its concurrency group. Earlier
# heads may finish and save dependency progress; only the final head's own
# build and axiom evidence establish its verification result.
concurrency:
  group: mom-engine-induction-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Lake's ordinary task pool uses this runtime setting. Each Lean
      # subprocess retains the repository's weakLeanArgs = ["-j2"].
      LEAN_NUM_THREADS: "2"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned Lean environment and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"
      # The setup action saves its cache before our explicit proof build.
      # Preserve that build separately, including native Lake traces. Lake
      # checks source and dependency hashes before reusing restored objects.
      - name: Restore project dependency build progress
        id: project-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-clean-${{ env.EXPECTED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-clean-${{ env.EXPECTED_SHA }}-
            mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-skeleton-${{ env.EXPECTED_SHA }}-
            mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-skeleton-
            mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-clean-
            mom-engine-induction-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ env.EXPECTED_SHA }}-
            mom-engine-induction-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Build the exact head and check every clean task declaration
        shell: bash
        run: |
          set -euo pipefail
          task_dir=HeckeSkeleton/Moments/MOM_ENGINE_INDUCTION
          proof_logs="$RUNNER_TEMP/mom-engine-induction"
          mkdir -p "$proof_logs"
          python3 "$task_dir/verify.py" preflight --expected-sha "$EXPECTED_SHA" --output "$proof_logs" 2>&1 | tee "$proof_logs/preflight.log"
          # Preserve completed dependency work before the 180-minute job cap.
          timeout --signal=TERM --kill-after=30s 140m lake build HeckeSkeleton.Moments.MOM_ENGINE_INDUCTION.Audit 2>&1 | tee "$proof_logs/build.log"
          printf '\nMOM_ENGINE_INDUCTION_BUILD_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/build.log"
          lake env lean "$task_dir/Audit.lean" 2>&1 | tee "$proof_logs/axioms.log"
          printf '\nMOM_ENGINE_INDUCTION_AUDIT_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/axioms.log"
          python3 "$task_dir/verify.py" check --expected-sha "$EXPECTED_SHA" --output "$proof_logs" 2>&1 | tee "$proof_logs/verification.log"
      - name: Save completed dependency work even after a proof failure
        if: ${{ !cancelled() && steps.project-cache.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
      - name: Upload compilation and axiom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-engine-induction-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mom-engine-induction/
          if-no-files-found: warn
          retention-days: 14

  # This source adapter imports admitted upstream definitions. Its native
  # compilation and inherited axiom report are a separate, visible result;
  # they do not weaken the allowlist of the clean induction job above.
  # Run the expensive source integration only after the clean gate succeeds.
  # A skipped integration job after a clean failure is not integration evidence.
  skeleton-integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "2"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned Lean environment and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"
      - name: Restore project dependency build progress
        id: project-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-skeleton-${{ env.EXPECTED_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-skeleton-${{ env.EXPECTED_SHA }}-
            mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-skeleton-
            mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-clean-${{ env.EXPECTED_SHA }}-
            mom-engine-induction-project-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-clean-
            mom-engine-induction-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ env.EXPECTED_SHA }}-
            mom-engine-induction-project-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
      - name: Compile the exact source adapter and report inherited axioms
        shell: bash
        run: |
          set -euo pipefail
          task_dir=HeckeSkeleton/Moments/MOM_ENGINE_INDUCTION
          proof_logs="$RUNNER_TEMP/mom-engine-induction-skeleton"
          mkdir -p "$proof_logs"
          python3 "$task_dir/verify.py" skeleton-preflight --expected-sha "$EXPECTED_SHA" --output "$proof_logs" 2>&1 | tee "$proof_logs/preflight.log"
          # A command timeout is a real failed build (exit 124), while the job
          # remains alive to save completed Lake artifacts and diagnostic logs.
          timeout --signal=TERM --kill-after=30s 140m lake build HeckeSkeleton.Moments 2>&1 | tee "$proof_logs/upstream-build.log"
          printf '\nMOM_ENGINE_INDUCTION_SKELETON_UPSTREAM_BUILD_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/upstream-build.log"
          lake env lean "$proof_logs/UpstreamAudit.lean" 2>&1 | tee "$proof_logs/upstream-axioms.log"
          printf '\nMOM_ENGINE_INDUCTION_SKELETON_UPSTREAM_AUDIT_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/upstream-axioms.log"
          lake build HeckeSkeleton.Moments.MOM_ENGINE_INDUCTION.SkeletonFamily 2>&1 | tee "$proof_logs/build.log"
          printf '\nMOM_ENGINE_INDUCTION_SKELETON_BUILD_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/build.log"
          lake env lean "$proof_logs/SkeletonAudit.lean" 2>&1 | tee "$proof_logs/axioms.log"
          printf '\nMOM_ENGINE_INDUCTION_SKELETON_AUDIT_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/axioms.log"
          python3 "$task_dir/verify.py" skeleton-check --expected-sha "$EXPECTED_SHA" --output "$proof_logs" 2>&1 | tee "$proof_logs/verification.log"
      - name: Save completed dependency work even after an integration failure
        if: ${{ !cancelled() && steps.project-cache.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
      - name: Upload separate source integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-engine-induction-skeleton-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mom-engine-induction-skeleton/
          if-no-files-found: warn
          retention-days: 14
