          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build the original import closure separately
        id: dependencies
        run: |
          python3 -u a2-live-source-normal/run.py dependencies 1200 \
            lake build +HeckeSkeleton.Moments.MOM_ENGINE_STEP.LiveSourceConditions:deps
      - name: Compile the complete original module and freshly audit every loaded task declaration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 -u a2-live-source-normal/run.py verification 1200 \
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.LiveSourceConditions \
            --namespace HeckeSkeleton.Moments.EngineStep \
          --declaration HeckeSkeleton.Moments.EngineStep.ActualGaussStage.supported_gated_fiberLeaf_live \
          --declaration HeckeSkeleton.Moments.EngineStep.ActualFirstSource.SecondStages.live_common_old_mask \
          --declaration HeckeSkeleton.Moments.EngineStep.ActualFirstSource.SecondStages.live_errorPrime_avoids_old_mask \
            --evidence a2-live-source-normal/verify
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a2-live-source-normal/provenance.py after
      - name: Preserve original compiler logs, timings, source hashes and fresh axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-live-source-normal-native-${{ github.sha }}-${{ github.run_attempt }}
          path: a2-live-source-normal/
          if-no-files-found: error
          retention-days: 14
