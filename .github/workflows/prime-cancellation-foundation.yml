name: Prime cancellation baseline dependency group

on:
  workflow_call:
    inputs:
      lower:
        required: true
        type: number
      upper:
        required: true
        type: number

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reserve disk space for the complete Lean artifacts
        run: |
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift
          df -h /
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore previous full-build progress
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-cancellation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            prime-cancellation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore progress for this dependency group
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-foundation-${{ inputs.upper }}-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            prime-foundation-${{ inputs.upper }}-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Download earlier dependency groups
        if: inputs.lower > 0
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: prime-foundation-*
          path: prime-foundation-downloads
      - name: Restore earlier complete native artifact groups
        if: inputs.lower > 0
        run: python scripts/prime_cancellation_foundation.py --restore prime-foundation-downloads
      - name: Compile and package this dependency group
        env:
          PRIME_LOWER: ${{ inputs.lower }}
          PRIME_UPPER: ${{ inputs.upper }}
          PRIME_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p prime-verification
          python scripts/prime_cancellation_foundation.py "$PRIME_LOWER" "$PRIME_UPPER" "$PRIME_SHARD" 2>&1 | tee prime-verification/foundation.log
      - name: Upload complete native artifact groups
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prime-foundation-${{ inputs.upper }}-${{ matrix.shard }}
          path: prime-foundation-artifacts/
          compression-level: 0
          retention-days: 7
      - name: Save compilation progress for a later revision
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-foundation-${{ inputs.upper }}-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prime-foundation-logs-${{ inputs.upper }}-${{ matrix.shard }}
          path: prime-verification/
          if-no-files-found: ignore
