name: MOM_ENGINE_STEP proof verification

on:
  push:
    branches: [cloud/mom-engine-step]
  pull_request:
    branches: [dtests-handoff]
    paths:
      - 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/**'
      - '.github/workflows/mom-engine-step.yml'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the exact reviewed source commit
        run: |
          mkdir -p mom-engine-step-verification
          git show --no-patch --format=fuller HEAD > mom-engine-step-verification/checkout.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore project build artifacts
        id: project-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.event.pull_request.head.sha || github.sha }}-
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Compile the single-step interface and audit its complete namespace
        run: |
          python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.Interface \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --evidence mom-engine-step-verification
      - name: Preserve compiler logs and recursive axiom reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-engine-step-verification-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: mom-engine-step-verification/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve completed dependency builds after proof failures
        if: ${{ always() && steps.project-cache.outputs.cache-hit != 'true' && steps.project-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
