name: MOM_ENGINE_STEP proof verification

on:
  pull_request:
    branches: [dtests-handoff]
    paths:
      - 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/**'
      - '.github/workflows/mom-engine-step.yml'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mom-engine-step-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [interface, arithmetic]
    concurrency:
      group: mom-engine-step-job-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ matrix.lane }}-${{ matrix.lane == 'arithmetic' && 'serial-checked-cache-v1' || (github.event.pull_request.head.sha || github.sha) }}
      cancel-in-progress: false
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the exact reviewed source commit
        run: |
          mkdir -p mom-engine-step-verification
          git show --no-patch --format=fuller HEAD > mom-engine-step-verification/checkout.txt
      - name: Provide enough memory mappings for the full legacy import closure
        run: |
          MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > mom-engine-step-verification/memory-mapping.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'true'
      - name: Overlay the saved arithmetic dependencies for the full interface
        if: ${{ matrix.lane == 'interface' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
            .lake/packages/TauCeti/.lake/build
          key: mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-arithmetic-${{ github.event.pull_request.head.sha || github.sha }}-read-only
          restore-keys: |
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-arithmetic-${{ github.event.pull_request.head.sha || github.sha }}-
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-arithmetic-
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-04cc5c645c7f79bb19439b6f8fddbc7fd820882e-arithmetic-
      - name: Restore project build artifacts
        id: project-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
            .lake/packages/TauCeti/.lake/build
          key: mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ matrix.lane }}-
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-04cc5c645c7f79bb19439b6f8fddbc7fd820882e-${{ matrix.lane }}-
            mom-engine-step-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Seed the strict verifier from the pinned successful project checkpoint
        continue-on-error: true
        timeout-minutes: 10
        env:
          MOM_CHECKPOINT_TOKEN: ${{ github.token }}
        run: |
          python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/checkpoint.py \
            --evidence mom-engine-step-verification
      - name: Compile assigned modules and audit their complete task namespace
        env:
          MOM_PROOF_LANE: ${{ matrix.lane }}
        run: |
          if [ "$MOM_PROOF_LANE" = arithmetic ]; then
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
              HeckeSkeleton.Moments.MOM_ENGINE_STEP.LocalAmplifier \
              HeckeSkeleton.Moments.MOM_ENGINE_STEP.LocalCorrelation \
              HeckeSkeleton.Moments.MOM_ENGINE_STEP.LocalCRT \
              HeckeSkeleton.Moments.MOM_ENGINE_STEP.ActualPool \
              HeckeSkeleton.Moments.MOM_ENGINE_STEP.ArithmeticPrimePool \
              HeckeSkeleton.Moments.MOM_ENGINE_STEP.ActualCorrelationBound \
              HeckeSkeleton.Moments.MOM_ENGINE_STEP.ActualFrequencyPartition \
              --serial-build \
              --checked-project-cache \
              --namespace HeckeSkeleton.Moments.EngineStep \
              --evidence mom-engine-step-verification
          else
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
              HeckeSkeleton.Moments.MOM_ENGINE_STEP.Interface \
              --checked-project-cache \
              --namespace HeckeSkeleton.Moments.EngineStep \
              --evidence mom-engine-step-verification
          fi
      - name: Preserve compiler logs and recursive axiom reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-engine-step-verification-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            mom-engine-step-verification/
            wire-low-hybrid-verification/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve completed dependency builds after proof failures
        if: ${{ always() && steps.project-cache.outputs.cache-hit != 'true' && steps.project-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
            .lake/packages/TauCeti/.lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}
