name: A2 four independent finite carrier roots normal build and fresh task axiom audit

on:
  push:
    branches: [cloud/mom-engine-step-a2-g1-fintype-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-g1-fintype-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original_root:
    name: Normal ${{ matrix.root }}
    strategy:
      fail-fast: false
      matrix:
        root: [FirstBlockFiniteLeaves, DirectParentLeaves, PoolFiniteLeaves, DualPoolFiniteLeaves]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      ROOT_MODULE: ${{ matrix.root }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-g1-fintype-native
          git show --no-patch --format=fuller HEAD > a2-g1-fintype-native/checkout.txt
          cat > a2-g1-fintype-native/provenance.py <<'PY'
          import hashlib, json, os, re, subprocess, sys, tomllib
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'a2-g1-fintype-native'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')
          sources = sorted(str(p) for p in task.glob('*.lean'))
          configs = ['lean-toolchain', 'lakefile.toml', 'lake-manifest.json',
                     'vendor/class-field-theory/lean-toolchain',
                     'vendor/class-field-theory/lakefile.toml',
                     'vendor/class-field-theory/lake-manifest.json', str(task / 'verify.py')]
          interface = (task / 'Interface.lean').read_text()
          imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', interface, re.M)))
          libraries = [x['name'] for x in tomllib.loads(Path('lakefile.toml').read_text())['lean_lib']]
          normal_root = os.environ['ROOT_MODULE']
          independent_normal_roots = ['FirstBlockFiniteLeaves', 'DirectParentLeaves', 'PoolFiniteLeaves', 'DualPoolFiniteLeaves']
          assert normal_root in independent_normal_roots, 'Unexpected independent normal root'
          source_base = '784160010d3a5c2a53b476b767b4bf3bd1096e3e'
          source_base_tree = git('rev-parse', source_base + '^{tree}')
          assert source_base_tree == '547e175e975b149d25a428f07e9dd0c27762bc1d', 'Unexpected frozen production owner tree'
          assert git('rev-parse', 'HEAD^') == source_base, 'Unexpected direct parent'
          assert len(git('rev-list', '--parents', '-n', '1', 'HEAD').split()) == 2
          changed = git('diff', '--name-only', source_base, 'HEAD').splitlines()
          candidate_sources = {
