name: Whole-project build

# Builds every lean_lib of the lakefile for each pull request into
# dtests-handoff, so a PR cannot break modules outside its own task, then
# prints the axioms of the closed endpoints, of the remaining Moments
# obligations, and of the final skeleton theorem.
on:
  pull_request:
    branches: [dtests-handoff]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # V2 task branches retain their scoped gates. B now also runs this final
    # whole-project gate while draft, on every head update before review.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.head_ref, 'cloud/mom-v2-')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reserve space for the pinned toolchain and artifacts
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          df -h /
      - name: Install the comparator sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Set up the pinned Lean and Mathlib environment
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore precompiled project artifacts
        uses: ./.github/actions/restore-lake-cache
      - name: Build every project library
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/integration
          git rev-parse HEAD > /tmp/integration/checkout-head.txt
          libs="$(awk '/^\[\[lean_lib\]\]/ {lib = 1; next} lib && /^name *=/ {gsub(/^name *= *"|"$/, ""); print; lib = 0}' lakefile.toml | tr '\n' ' ')"
          echo "Libraries: $libs" | tee /tmp/integration/build.log
          status=0
          timeout --signal=TERM --kill-after=60s 270m lake build $libs 2>&1 |
            tee -a /tmp/integration/build.log |
            awk '/^error:|^✖/ { remaining = 60 }
              /Build completed|Some required targets logged failures|error: build failed/ || remaining > 0 {
                print; fflush(); if (remaining > 0) remaining--
              }' || status=$?
          grep -E '^(error|✖)' /tmp/integration/build.log | head -100 || true
          exit "$status"
      - name: Print axioms of the integrated endpoints
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/integration/IntegrationAxioms.lean <<'EOF'
          import HeckeSkeleton.Main
          import HeckeSkeleton.Moments.MOM_ENGINE_STEP_V2.PairedStep
          import HeckeSevenEighthsSolution

          #print axioms HeckeSkeleton.highBin
          #print axioms HeckeSkeleton.expansionPhysicalParameters
          #print axioms HeckeSkeleton.actualHighPresentation
          #print axioms HeckeSkeleton.expansion_identity
          #print axioms HeckeSkeleton.expansion_principal
          #print axioms HeckeSkeleton.expansion_small
          #print axioms HeckeSkeleton.expansion_large
          #print axioms HeckeSkeleton.expansion_blockCount
          #print axioms HeckeSkeleton.expansion_blocks
          #print axioms HeckeSkeleton.expansion_tail
          #print axioms HeckeSkeleton.expansionSource
          #print axioms HeckeSkeleton.paired_primes_endpoint
          #print axioms HeckeSkeleton.moment_profile_control
          #print axioms HeckeSkeleton.moment_row_eligibility
          #print axioms HeckeSkeleton.moment_finite_sector_reindex
          #print axioms HeckeSkeleton.inverse_sixth_power_masks
          #print axioms HeckeSkeleton.inverse_independent_amplification
          #print axioms HeckeSkeleton.inverse_amplified_witness_models
          #print axioms HeckeSkeleton.canonical_inverse_models
          #print axioms HeckeSkeleton.paired_primes_below_one
          #print axioms HeckeSkeleton.paired_zero_slot_models
          #print axioms HeckeSkeleton.paired_positive_below_one
          #print axioms HeckeSkeleton.paired_positive_endpoint
          #print axioms HeckeSkeleton.inverseSource
          #print axioms HeckeSkeleton.plainSource
          #print axioms HeckeSkeleton.generalHeckeSevenEighths_skeleton
          #print axioms HeckeSevenEighths.heckeL_zeroFree
          #print axioms HeckeSkeleton.Moments.EngineStepV2.Assembly.pairedStepHypothesis
          EOF
          cp /tmp/integration/IntegrationAxioms.lean IntegrationAxioms.lean
          lake env lean IntegrationAxioms.lean 2>&1 | tee /tmp/integration/axioms.log
      - name: Record the challenge and solution declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          template = '''import __MODULE__
          import Lean

          open Lean Elab Command in
          run_cmd do
            let env ← getEnv
            let mut rows : Array Json := #[]
            for name in #[`HeckeSevenEighths.HeckeCharacter,
                `HeckeSevenEighths.IsUnramifiedAt, `HeckeSevenEighths.primeValue,
                `HeckeSevenEighths.coeff] do
              let some (.defnInfo d) := env.find? name
                | throwError "Expected definition {name}"
              let hint := match d.hints with
                | .opaque => "opaque"
                | .abbrev => "abbrev"
                | .regular h => s!"regular {h}"
              rows := rows.push <| Json.mkObj [
                ("name", toJson name.toString),
                ("levels", toJson (d.levelParams.map toString)),
                ("hints", toJson hint),
                ("safety", toJson (reprStr d.safety)),
                ("all", toJson (d.all.map toString)),
                ("type", toJson (reprStr d.type)),
                ("value", toJson (reprStr d.value))]
            liftIO <| IO.FS.writeFile "__OUTPUT__" (Json.arr rows).pretty
          '''
          for module in ("HeckeSevenEighthsChallenge", "HeckeSevenEighthsSolution"):
              output = f"/tmp/integration/{module}-definitions.json"
              Path(f"{module}Definitions.lean").write_text(
                  template.replace("__MODULE__", module).replace("__OUTPUT__", output))
          PY
          lake env lean HeckeSevenEighthsChallengeDefinitions.lean
          lake env lean HeckeSevenEighthsSolutionDefinitions.lean
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/integration')
          challenge = json.loads((root / 'HeckeSevenEighthsChallenge-definitions.json').read_text())
          solution = json.loads((root / 'HeckeSevenEighthsSolution-definitions.json').read_text())
          for left, right in zip(challenge, solution):
              different = [key for key in left if left[key] != right[key]]
              print(left['name'], 'different fields:', different)
              for key in different:
                  if key not in ('type', 'value'):
                      print(key, repr(left[key]), repr(right[key]))
          PY
      - name: Preserve declaration diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: hecke-definitions-${{ github.sha }}
          path: /tmp/integration/*-definitions.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare the Hecke challenge and solution
        shell: bash
        run: |
          set -euo pipefail
          lake comparator --config src/Challenge/comparator.json 2>&1 |
            tee /tmp/integration/comparator.log |
            awk '/^error:/ { remaining = 30 }
              /^(Resolving|Building|Exporting|Running|Your solution|Build completed)/ || remaining > 0 {
                print; fflush(); if (remaining > 0) remaining--
              }'
      - name: Preserve build and axiom logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-build-${{ github.sha }}
          path: /tmp/integration
          if-no-files-found: warn
          retention-days: 30

