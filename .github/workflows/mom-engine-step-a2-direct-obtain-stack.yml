name: A2 Direct application-split declaration finish GDB diagnostic only

on:
  push:
    branches: [cloud/mom-engine-step-a2-direct-obtain-stack]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-direct-obtain-stack-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: direct_default_gdb
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: '2'
      EXPECTED_SHA: ${{ github.sha }}
      A2_DIAGNOSTIC_VARIANT: direct_default_gdb
      A2_DIAGNOSTIC_SCRIPT: .github/scripts/mom-engine-step-a2-direct-obtain-stack-harness.py
      A2_DIAGNOSTIC_MODULE: HeckeSkeleton.Moments.MOM_ENGINE_STEP.DirectCoveredStage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-direct-obtain-stack
          git show --no-patch --format=fuller HEAD > a2-direct-obtain-stack/checkout.txt
          cat > a2-direct-obtain-stack/provenance.py <<'PY'
          import hashlib, json, os, re, subprocess, sys, tomllib
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'a2-direct-obtain-stack'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')
          sources = sorted(str(p) for p in task.glob('*.lean'))
          configs = ['lean-toolchain', 'lakefile.toml', 'lake-manifest.json',
                     'vendor/class-field-theory/lean-toolchain',
                     'vendor/class-field-theory/lakefile.toml',
                     'vendor/class-field-theory/lake-manifest.json', str(task / 'verify.py')]
          interface = (task / 'Interface.lean').read_text()
          imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', interface, re.M)))
          libraries = [x['name'] for x in tomllib.loads(Path('lakefile.toml').read_text())['lean_lib']]
          source_base = '61658c18f1dd6fe967f9abd39966fd5f62b7308c'
          source_base_tree = git('rev-parse', source_base + '^{tree}')
          assert source_base_tree == 'd26b9f9648c595ec4ba446ee236e6740c139bb9d', 'Unexpected frozen auxiliary source tree'
          assert git('rev-parse', 'HEAD^') == source_base, 'Diagnostic must be a direct child of the frozen diagnostic head'
          parents = git('rev-list', '--parents', '-n', '1', 'HEAD').split()
          assert len(parents) == 2, 'Diagnostic commit must have one parent'
          changed = git('diff', '--name-only', source_base, 'HEAD').splitlines()
          allowed = {'.github/workflows/mom-engine-step-a2-direct-obtain-stack.yml',
                     '.github/scripts/mom-engine-step-a2-direct-obtain-stack-driver.py',
                     '.github/scripts/mom-engine-step-a2-direct-obtain-stack-harness.py'}
          assert set(changed) == allowed, 'Only the two reviewed Direct GDB scripts and this workflow may differ'
          additions = git('diff', '--name-only', '--diff-filter=A', source_base, 'HEAD').splitlines()
          assert set(additions) == allowed, 'All three Direct GDB files must be additions to the frozen auxiliary tree'
          assert os.environ['A2_DIAGNOSTIC_VARIANT'] == 'direct_default_gdb'
          assert os.environ['A2_DIAGNOSTIC_SCRIPT'] == '.github/scripts/mom-engine-step-a2-direct-obtain-stack-harness.py'
          assert os.environ['A2_DIAGNOSTIC_MODULE'] == 'HeckeSkeleton.Moments.MOM_ENGINE_STEP.DirectCoveredStage'
          pins = {
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/DirectCoveredStage.lean': '7e9ef16662ac3d88c9823480d2a052b05a1b920b2b9d306485e1fbb80b42eff9',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalAmplifiedCarrier.lean': '788de94c079afcf9428eb0c592abd1b0090c662ae0949ee3d699a8ac597f871b',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/PoolFiniteLeaves.lean': '7fafdf5687b18cf53f9e6f4792e999198a0ab875396376690e1c625f0a718c01',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/DualGaussHybridTerminal.lean': 'b2be306ecb762e87a7ccd695a3cd870e438d74b7e5eb1cb32396f89bf24f4b06',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalAllocationFingerprint.lean': '30f35dba5d488d40a93fbee78c1eca888aee327a109af235a9320b2c8e2c1e5b',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/GatedGaussStages.lean': '74103e801a3bcb1326d9c9dbf5f7b4238b66e034bba021436ad5d7059faf1d96',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualGaussFiniteLeaves.lean': 'b81c8566cf067792b4e25363381a746281df5460a1e81dad68590ec090d742e2',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualGaussCoverHybridTerminal.lean': '079e25914d94531866e713528c6b8f0101df325fd9303a819e65da8c192fe468',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/DirectGaussSource.lean': '812d5035b1f52e6c2586afe9bf01b98c284aa2c92577f1f241e837960f4b30b4',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/OrdinaryLiteralExceptionalLeaf.lean': '09e4b083c71e6773b55fda90ab3412e7f4214552afc8e74f8b96c79705f72a7f',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualExceptionalColumnOrientation.lean': '2304963616c4daf16c15b860f1bfe5634f31d984f996a4205ef00362c9b2c77c',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/Interface.lean': 'db81dff1d17c12c72746738c9296a1d4bc87ec27d33958124ce36c79455bb5df',
              'HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py': '1be80b89c66818fa20e680a6850818ed4499ddf2d7d5789a9b63398c3279c148',
              'lean-toolchain': 'bc84812c94489d1e3e191baa1dc10d5eb684382d7fe9d2a5ab085e72c1c67e47',
              'lakefile.toml': '2d4deb66cc8a08f069ce72e873ea53f0877ac8aa181a57b08676a7a73aad1af0',
              'lake-manifest.json': 'ded459271a8b831db1213d0e0f56e84072a4743f735eb90ed1b65a571459e32c',
              'vendor/class-field-theory/lean-toolchain': '8dc8d6f560141069d9073e370611716ef77ada0da8ffa37e2149f44b2e63ac7a',
              'vendor/class-field-theory/lakefile.toml': '04bb109b87b6bdd3a9fb66b2aaf6d33c97dd6e642718fa944dbb6db1464706cf',
              'vendor/class-field-theory/lake-manifest.json': 'ee22b45c98f5346f1bbd99a16305641d0571ee1244ccbff3b11c079b420d0d49',
              '.github/scripts/mom-engine-step-a2-direct-obtain-diagnostic.py': '559d3b822e2e304fad8c9c5c0a91937263b4c424057228954f9435753adb568b',
              '.github/workflows/mom-engine-step-a2-direct-obtain-native.yml': '80eeb918fb734f50f20a209f0105ab22a96b91f8ff9535cd2d47900608ad1b5b',
              '.github/scripts/mom-engine-step-a2-direct-obtain-stack-driver.py': 'ff0b37c87f949047ac69aa7e588a797bbe96e81976798ddfabdeeeeb26d0ce77',
              '.github/scripts/mom-engine-step-a2-direct-obtain-stack-harness.py': 'd2667a1abda03d799814a5832b2e7ae7e976822924fe3c1daddd472b708631f7',
          }
          for path, expected in pins.items():
              assert digest(path) == expected, 'Unexpected frozen source or diagnostic wrapper: ' + path
          record = {'source_base': source_base, 'source_base_tree': source_base_tree,
                    'changed_paths_from_base': changed, 'diagnostic_variant': os.environ['A2_DIAGNOSTIC_VARIANT'],
                    'diagnostic_only': True,
                    'diagnostic_module': os.environ['A2_DIAGNOSTIC_MODULE'],
                    'diagnostic_script': os.environ['A2_DIAGNOSTIC_SCRIPT'],
                    'source_and_script_pins': pins,
                    'production_source_changed': False, 'new_scope_authorized': False,
                    'source_candidate_head': '61658c18f1dd6fe967f9abd39966fd5f62b7308c',
                    'base_owner_head': 'fcc8dd6a84f709c6666da23b761f1b63643eaffb', 'base_owner_tree': 'e4456fff025aa62aa900503e789af0e190371f8e',
                    'candidate_source_not_adopted_as_owner_production': True,
                    'owner_adoption_performed_by_this_diagnostic': False,
                    'new_warning_scope_count': 0, 'all_original_linters_default': True,
                    'cause_of_after_proof_stall_confirmed': False,
                    'production_approval': False, 'fresh_axiom_audit_performed': False,
                    'acceptance_evidence': False, 'original_module_native_was_run': False,
                    'original_module_acceptance': False, 'complete_target_module_compiled': False,
                    'complete_module_within_five_minutes': False, 'full_task_acceptance': False,
                    'compiler_outputs_can_be_restored_as_project_cache': False,
                    'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'expected_head': os.environ['EXPECTED_SHA'],
                    'tracked_status': git('status', '--porcelain=v1', '--untracked-files=no'),
                    'tracked_sha256': {p: digest(p) for p in tracked},
                    'task_source_sha256': {p: digest(p) for p in sources},
                    'config_sha256': {p: digest(p) for p in configs},
                    'interface_imports': imports, 'libraries': libraries}
          phase = sys.argv[1]
          (evidence / (phase + '-source.json')).write_text(json.dumps(record, indent=2) + '\n')
          assert record['head'] == record['expected_head'], 'Unexpected checkout SHA'
          assert not record['tracked_status'], 'Tracked source changes detected'
          assert len(tracked) == 9581, 'Frozen complete tracked inventory changed'
          assert len(sources) == 1009, 'Task module inventory changed'
          assert len(imports) == 1008, 'Complete Interface import inventory changed'
          assert len(libraries) == 20, 'Library inventory changed'
          assert len(configs) == 7, 'Configuration inventory changed'
          if phase == 'after':
              before = json.loads((evidence / 'before-source.json').read_text())
              assert before == record, 'Source, configuration, index inventory or HEAD changed'
              (evidence / 'source-integrity.json').write_text(json.dumps({
                  'unchanged': True, 'head': record['head'], 'tree': record['tree'],
                  'tracked_files': len(tracked), 'task_modules': len(sources),
                  'interface_imports': len(imports), 'libraries': len(libraries)}, indent=2) + '\n')
          print(f'{phase}: {record["head"]} tree={record["tree"]}; {len(tracked)} tracked files, {len(sources)} task modules, {len(libraries)} libraries')
          PY
          cat > a2-direct-obtain-stack/run.py <<'PY'
          import datetime, json, re, subprocess, sys, time
          from pathlib import Path
          name, seconds, *command = sys.argv[1:]
          evidence = Path('a2-direct-obtain-stack')
          wrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]
          record = {'command': command, 'wrapper': wrapper, 'completed': False,
                    'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          receipt = evidence / (name + '-result.json')
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          start = time.monotonic()
          compact = name == 'dependencies'
          show_block = not compact
          with (evidence / (name + '-console.log')).open('w') as log:
              process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  if compact:
                      clean = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      if re.match(r'^[✔✖⚠ℹ]\s+\[\d+/\d+\]', clean):
                          show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')
                      elif re.match(r'^(error|warning|info):', clean):
                          show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')
                      elif clean.startswith('Some required targets logged failures:'):
                          show_block = True
                  if show_block:
                      print(line, end='', flush=True)
              code = process.wait()
          record.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,
                        finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record), flush=True)
          sys.exit(code if code >= 0 else 128 - code)
          PY
          python3 a2-direct-obtain-stack/provenance.py before
      - name: Provide enough memory mappings for the full legacy import closure
        run: |
          MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > a2-direct-obtain-stack/memory-mapping.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build the original import closure separately
        id: dependencies
        run: |
          python3 -u a2-direct-obtain-stack/run.py dependencies 1200 \
            lake build "+${A2_DIAGNOSTIC_MODULE}:deps"
      - name: Install and verify the standard GDB harness dependency
        id: debugger
        timeout-minutes: 8
        run: |
          python3 -u - <<'PYGDB'
          import json, pathlib, shutil, subprocess
          evidence = pathlib.Path('a2-direct-obtain-stack')
          evidence.mkdir(exist_ok=True)
          gdb = shutil.which('gdb')
          result = {
              'scope': 'diagnostic-only GDB harness dependency setup',
              'gdb_preinstalled': gdb is not None,
              'dependency_install_attempted': False,
              'installed_or_modified_any_dependency': False,
              'changed_system_security_settings': False,
              'debugger_runs_as_root': False,
              'complete_target_module_compiled': False,
              'original_module_acceptance': False,
              'full_task_acceptance': False,
              'exit_code': 1,
          }
          try:
              if gdb is None:
                  result['dependency_install_attempted'] = True
                  result['installed_or_modified_any_dependency'] = True
                  with (evidence / 'gdb-install.log').open('w') as log:
                      for command in [
                          ['sudo', 'apt-get', 'update'],
                          ['sudo', 'apt-get', 'install', '--yes', '--no-install-recommends', 'gdb'],
                      ]:
                          log.write('COMMAND: ' + ' '.join(command) + '\n')
                          log.flush()
                          subprocess.run(command, stdout=log, stderr=subprocess.STDOUT,
                                         stdin=subprocess.DEVNULL, timeout=180, check=True)
                  gdb = shutil.which('gdb')
              result['gdb_available'] = gdb is not None
              result['gdb_path'] = gdb
              if gdb is None:
                  result['reason'] = 'The standard package install did not provide gdb'
              else:
                  process = subprocess.run([gdb, '--version'], text=True, capture_output=True, timeout=10)
                  result['gdb_version_first_line'] = process.stdout.splitlines()[0] if process.stdout else ''
                  result['version_exit_code'] = process.returncode
                  result['exit_code'] = 0 if process.returncode == 0 else 1
          except (OSError, subprocess.SubprocessError) as error:
              result['reason'] = str(error)
          (evidence / 'harness-dependency.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result), flush=True)
          raise SystemExit(result['exit_code'])
          PYGDB
      - name: Diagnose the complete reversible source using the pinned variant
        id: diagnostic
        run: |
          python3 -u "$A2_DIAGNOSTIC_SCRIPT" \
            --repo "$GITHUB_WORKSPACE" --evidence a2-direct-obtain-stack/diagnostic
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a2-direct-obtain-stack/provenance.py after
      - name: Preserve diagnostic output, dependency logs, source hashes and false acceptance flags
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-direct-obtain-stack-default-gdb-${{ github.sha }}-${{ github.run_attempt }}
          path: a2-direct-obtain-stack/
          if-no-files-found: error
          retention-days: 14

