name: Expansion actual definitions and axiom audit

on:
  push:
    branches: [codex/expansion-detector-20261030]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expansion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        group: [pure, actual, skeleton]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reserve space for the pinned Lean toolchain and artifacts
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift
          df -h /
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@ci/lake-cache-test
      - name: Compile original imports and audit transitive axioms
        id: compile
        run: |
          set -euo pipefail
          mkdir -p expansion-verification
          if [ '${{ matrix.group }}' = actual ]; then
            git rev-parse HEAD > expansion-verification/source-commit.txt
            git archive --format=tar HEAD Expansion ExpansionDetector ExpansionInterfaces HeckeGeneral HeckeSkeleton SkeletonInputs PrimeCancellation cloud_tasks scripts lean-toolchain lakefile.toml lake-manifest.json | gzip -n > expansion-verification/sources.tar.gz
            sha256sum expansion-verification/sources.tar.gz > expansion-verification/sources.sha256
          fi
          lean --version | tee expansion-verification/environment.log
          python3 scripts/expansion_verify.py --group '${{ matrix.group }}'
      - name: Preserve exact source manifests and compiler output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: expansion-${{ matrix.group }}-verification
          path: expansion-verification/
          if-no-files-found: warn
