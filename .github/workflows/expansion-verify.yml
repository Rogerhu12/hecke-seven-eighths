name: Expansion actual definitions and axiom audit

on:
  push:
    branches: [codex/expansion-detector-20261030]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expansion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        group: [pure, actual, skeleton]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reserve space for the pinned Lean toolchain and artifacts
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift
          df -h /
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore project artifacts
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: expansion-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            expansion-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Compile original imports and audit transitive axioms
        id: compile
        run: |
          set -euo pipefail
          mkdir -p expansion-verification
          lean --version | tee expansion-verification/environment.log
          python3 scripts/expansion_verify.py --group '${{ matrix.group }}'
      - name: Preserve project compilation progress
        if: ${{ always() && !cancelled() && steps.compile.outcome != '' && steps.compile.outcome != 'skipped' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: expansion-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Preserve exact source manifests and compiler output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: expansion-${{ matrix.group }}-verification
          path: expansion-verification/
          if-no-files-found: warn
