name: A recovery g1 CanonicalLiteralSupport native verification

on:
  push:
    branches: [cloud/mom-engine-step-a-recovery-literal-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a-recovery-literal-support-${{ github.sha }}
  cancel-in-progress: false

jobs:
  literal_support:
    name: CanonicalLiteralSupport normal native and fresh audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      EXPECTED_SHA: ${{ github.sha }}
