name: A2 Tagged local index fvar proof and original fresh audit

on:
  push:
    branches: [cloud/mom-engine-step-a2-tagged-fvar-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-tagged-fvar-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tagged_index:
    name: Normal OriginalTaggedLocalIndex
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      ROOT_MODULE: 'OriginalTaggedLocalIndex'
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-tagged-fvar-native
          git show --no-patch --format=fuller HEAD > a2-tagged-fvar-native/checkout.txt
          cat > a2-tagged-fvar-native/provenance.py <<'PY'
          import hashlib, json, os, re, subprocess, sys, tomllib
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'a2-tagged-fvar-native'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')
          sources = sorted(str(p) for p in task.glob('*.lean'))
          configs = ['lean-toolchain', 'lakefile.toml', 'lake-manifest.json',
                     'vendor/class-field-theory/lean-toolchain',
                     'vendor/class-field-theory/lakefile.toml',
                     'vendor/class-field-theory/lake-manifest.json', str(task / 'verify.py')]
          interface = (task / 'Interface.lean').read_text()
          imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', interface, re.M)))
          libraries = [x['name'] for x in tomllib.loads(Path('lakefile.toml').read_text())['lean_lib']]
          normal_root = os.environ['ROOT_MODULE']
          assert normal_root == 'OriginalTaggedLocalIndex', 'Unexpected normal root'
          source_base = '784160010d3a5c2a53b476b767b4bf3bd1096e3e'
          source_base_tree = git('rev-parse', source_base + '^{tree}')
          assert source_base_tree == '547e175e975b149d25a428f07e9dd0c27762bc1d', 'Unexpected frozen production owner tree'
          assert git('rev-parse', 'HEAD^') == source_base, 'Unexpected direct parent'
          assert len(git('rev-list', '--parents', '-n', '1', 'HEAD').split()) == 2
          changed = git('diff', '--name-only', source_base, 'HEAD').splitlines()
          candidate_path = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalTaggedLocalIndex.lean'
          allowed = {'.github/workflows/mom-engine-step-a2-tagged-fvar-native.yml', candidate_path}
          assert set(changed) == allowed, 'Only the complete reviewed Tagged proof candidate and this new normal workflow may differ'
          assert git('diff', '--name-status', source_base, 'HEAD').splitlines() == [
              'A\t' + '.github/workflows/mom-engine-step-a2-tagged-fvar-native.yml', 'M\t' + candidate_path]
          reviewed_source_pins = {
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalAmplifiedCarrier.lean": "788de94c079afcf9428eb0c592abd1b0090c662ae0949ee3d699a8ac597f871b",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/PoolFiniteLeaves.lean": "dbaf97fb9b6ecb7340565707af33874120f7e5db27e9f71dd8a4410e0144e364",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DualGaussHybridTerminal.lean": "6de73fb29bd9434bf272000b7b3dd506b6b24d592a23ddcbc99d8192ca295cff",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalAllocationFingerprint.lean": "30f35dba5d488d40a93fbee78c1eca888aee327a109af235a9320b2c8e2c1e5b",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DirectCoveredStage.lean": "b57bf05548ee52e0cc5a4b60ae24a74247e54b08021218e54bd6b015b3155cc8",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/GatedGaussStages.lean": "9bfd8faeb0505dd7f47b1d824ba2562ab6cd8d168ceecc077429071c6d7cedef",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualGaussFiniteLeaves.lean": "b81c8566cf067792b4e25363381a746281df5460a1e81dad68590ec090d742e2",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralExtraction.lean": "b1bc990df3791577b2e1c0cf609a65fd185715e808253f43533f1b9f9bbcd1bd",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralAtlas.lean": "ff8ab19caf36f5a9ec27ec7a6d9612511644a47b05ff33ee1bf8e4d05484b5b2",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralMovingTwist.lean": "a9639e024d61244af768073acca6479c31bc217ef0a79e0004b2ed943d9e37a5",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OrdinaryLiteralExceptionalLeaf.lean": "09e4b083c71e6773b55fda90ab3412e7f4214552afc8e74f8b96c79705f72a7f",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualExceptionalColumnOrientation.lean": "2304963616c4daf16c15b860f1bfe5634f31d984f996a4205ef00362c9b2c77c",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/Interface.lean": "db81dff1d17c12c72746738c9296a1d4bc87ec27d33958124ce36c79455bb5df",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py": "1be80b89c66818fa20e680a6850818ed4499ddf2d7d5789a9b63398c3279c148",
              "lean-toolchain": "bc84812c94489d1e3e191baa1dc10d5eb684382d7fe9d2a5ab085e72c1c67e47",
              "lakefile.toml": "2d4deb66cc8a08f069ce72e873ea53f0877ac8aa181a57b08676a7a73aad1af0",
              "lake-manifest.json": "ded459271a8b831db1213d0e0f56e84072a4743f735eb90ed1b65a571459e32c",
              "vendor/class-field-theory/lean-toolchain": "8dc8d6f560141069d9073e370611716ef77ada0da8ffa37e2149f44b2e63ac7a",
              "vendor/class-field-theory/lakefile.toml": "04bb109b87b6bdd3a9fb66b2aaf6d33c97dd6e642718fa944dbb6db1464706cf",
              "vendor/class-field-theory/lake-manifest.json": "ee22b45c98f5346f1bbd99a16305641d0571ee1244ccbff3b11c079b420d0d49",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralChartLocations.lean": "45d84bfb9c15e5cb9793b8283f904bd25f28eea2a4a0a18f9ba64a5bdd48dbe7",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralCommonLeaf.lean": "98436f7828a1b7c7314e7d44cea5f4c48add2eaf7c77c07fcef4eb8a8cc196c4",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalOriginalGaussTuples.lean": "dfa4e97d244f5b237d9401422e9adcd686e03635a7c1376aa76666ee99a5fb9f",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DirectSecondStages.lean": "884eae448a40b42c145a4bba77d44aa19c3a79463a9825436a272f2c6e7559f0",
              "cloud_tasks/MOM_ENGINE_STEP_E.md": "fd62b1e3f7891148293159587a60d7beaa4bfb42dbcf416d1c74bf08c9ac231f",
              "cloud_tasks/MOM_ENGINE_STEP_GROUPS.md": "3c3bc0add6f48504dbc3acab59441677acbb3f79f1f978a92f3e0ff8980a667f",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualCoveredFibre.lean": "92eedf513225df33bfdd8d35baeccf3ce8f86af3e6ad5422226a2b6d4425834e",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralPoolAtlas.lean": "3bdbc3c828fd32f8e90efdd423a5a458592c964596c50e52dfa53e937a4f931c",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralTwoStages.lean": "850fcbe46f3a80b175e3379d098d135d7990c78a819b0939958ae46ced373619",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/NormalizedOriginalImageMass.lean": "5f4d2fa7eddc0bdcd87877ec71716f06f0fc8972d511c864b6d4cea453cf6363",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualCoveredFibreMass.lean": "4959a7555a13623709b19490b3b5df4f10ec7b380b3c98b6118eb79cd0e5d1b2",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralProfileData.lean": "960bde1fa37dcf22398f8aa13382c7100b33b39b60771dcb0c4adc0bffde038c",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralSourceCoefficients.lean": "20e060a7f870b0110866e4a0ed9cc9b667e57b0a36b29cb6334c0eccee464532",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DualPoolTerminal.lean": "95072a7d70746559fe2d603f82999ea5160a4bea18a9b74cd2a6b0db867fa3c7",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalTaggedLocalIndex.lean": "c23f182a1e4fd8bddfeaeb80c64da1f32c8d8255776125c845ce2d326f6ea365",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalArithmeticCarrier.lean": "f8f9b8fe1fc3e430c330da270b924e5a074bd9ac949b21289610782fa34781c8",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/FiniteBranchIndex.lean": "238f0b27b692a1eccd6abfa85afda6951829f873e17f2c572b54b072d9746adc"
          }
          for path, expected in reviewed_source_pins.items():
              assert digest(path) == expected, 'Unexpected reviewed source or original configuration: ' + path
          original_target_identity = {'bytes': 3268, 'sha256': '2a4b131c3b9682d1c852ff8d18c8ed93e3bc1328bf1874cfcf9a6dfc533b020e', 'git_blob': '4c23104791f361f22ca06baea55c818934c046b0'}
          candidate_target_identity = {'bytes': 4701, 'sha256': 'c23f182a1e4fd8bddfeaeb80c64da1f32c8d8255776125c845ce2d326f6ea365', 'git_blob': '7071ed08d238e4200fc0f88c4fc7c3eb737fe4b4'}
          before_fvar_identity = {'bytes': 4605, 'sha256': '9d88ce8f590a6ac1c245b7145f53e92b13074f1e5475311a61603d30f096cbb5', 'git_blob': 'f7437ac2fd645e7e42c17dfdb605e8db62868ba1'}
          before_option_identity = {'bytes': 4563, 'sha256': 'e62d19291dd6fa127463f15c7824aaeddf1960a7b474f5ff68b3ddc6d80c7314', 'git_blob': '2464eee978753d1983e019ea143a2daee3acea9e'}
          combined_D_B2_identity = {'bytes': 6019, 'sha256': '5142394ecda462f3562588a24e154c7f728e7aff907390cb8c60db11b9e4fdf1', 'git_blob': '9789ffba11b00e823bff769b75d9016aa1704bb2'}
          original_target_bytes = subprocess.check_output(['git', 'show', source_base + ':' + candidate_path])
          candidate_target_bytes = (root / candidate_path).read_bytes()
          def source_identity(data):
              return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                      'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
          assert source_identity(original_target_bytes) == original_target_identity
          assert source_identity(candidate_target_bytes) == candidate_target_identity
          assert git('rev-parse', source_base + ':' + candidate_path) == original_target_identity['git_blob']
          assert git('rev-parse', 'HEAD:' + candidate_path) == candidate_target_identity['git_blob']
          def verify_complete_tagged_chain(original, candidate):
              names = ['localIndex_first', 'localIndex_firstDivisor', 'localIndex_second',
                       'localIndex_secondDivisor', 'amplifiedIndexWeight_local']
              terminators = [b'\n\n@[simp] theorem ' + n.encode() + b' ' for n in names[1:4]] + [
                  b'\n\nvariable {bad :', b'\n\nend OriginalArithmeticLabels']
              def bounds(data, name):
                  token = b'theorem ' + name.encode() + b' '
                  assert data.count(token) == 1
                  head = data.index(token)
                  body = data.index(b' := by\n', head) + len(b' := by\n')
                  end = data.index(terminators[names.index(name)], body) + 1
                  return head, body, end
              def helper_bounds(data, name):
                  start = data.index(b'private theorem ' + name.encode() + b'\n')
                  end = data.index(b'variable {K : Type} [Field K] [NumberField K]\n', start)
                  return start, end
              start, stop = helper_bounds(candidate, 'option_eq_none_or_some')
              helper = candidate[start:stop]
              assert len(helper) == 196
              assert hashlib.sha256(helper).hexdigest() == '0bc1ed6c58def4ffa8fe81079e49b1e809f9e6ed016f64e2daba79d2b6f25c74'
              stripped = candidate[:start] + candidate[stop:]
              restored = stripped
              proof_identities = {}
              headers = {}
              for name in reversed(names):
                  oh, ob, oe = bounds(original, name)
                  ch, cb, ce = bounds(restored, name)
                  assert original[oh:ob] == restored[ch:cb], 'Public header changed: ' + name
                  old_proof = original[ob:oe]
                  new_proof = restored[cb:ce]
                  expected = '375dc143e8ae13b7cbdf24de21f56788004bc230af4bbc0673194d4b12d06b24' if name == names[-1] else 'abad4a9e6cd2133c160d8908d42299d4022a9d13c70f069fcd53c895591de9d2'
                  assert len(new_proof) == (1050 if name == names[-1] else 102)
                  assert hashlib.sha256(new_proof).hexdigest() == expected
                  proof_identities[name] = {'original': source_identity(old_proof), 'candidate': source_identity(new_proof)}
                  headers[name] = source_identity(original[oh:ob])
                  restored = restored[:cb] + old_proof + restored[ce:]
              assert restored == original, 'Any bytes outside one helper insertion and five proof bodies changed'
              for token in [b'import ', b'#print axioms ']:
                  assert [l for l in original.splitlines() if l.startswith(token)] == [l for l in candidate.splitlines() if l.startswith(token)]
              assert candidate.count(b'private theorem ') == 1
              assert b'set_option ' not in original and b'set_option ' not in candidate
              assert b'sorry' not in candidate and b'axiom ' not in candidate
              # Reconstruct the full frozen D+B2 source without writing or compiling it.
              D_helper = 'private theorem option_dependent_match_property\n    {α : Type*} {β : Option α → Sort*}\n    (o : Option α) (f0 : o = none → β none)\n    (fs : ∀ a, o = some a → β (some a))\n    (P : ∀ q, β q → Prop)\n    (h0 : ∀ h, P none (f0 h))\n    (hs : ∀ a h, P (some a) (fs a h)) :\n    P o (match (generalizing := false) h : o with\n      | none => f0 h\n      | some a => fs a h) := by\n  cases o with\n  | none => exact h0 rfl\n  | some a => exact hs a rfl\n\n'.encode()
              D_proofs = {'localIndex_first': '  unfold localIndex\n  dsimp only\n  exact option_dependent_match_property\n    (β := fun q => (match q with\n      | none => L.mainCarrier tag\n      | some p => L.errorCarrier tag p.1 p.2).Index)\n    (tag i)\n    (fun h => (L.mainLabels tag).index ⟨i, h⟩)\n    (fun q h => (L.errorLabels tag q.1 q.2).index ⟨i, h⟩)\n    (fun _ j => j.1.val = L.first i)\n    (fun _ => rfl) (fun _ _ => rfl)\n', 'localIndex_firstDivisor': '  unfold localIndex\n  dsimp only\n  exact option_dependent_match_property\n    (β := fun q => (match q with\n      | none => L.mainCarrier tag\n      | some p => L.errorCarrier tag p.1 p.2).Index)\n    (tag i)\n    (fun h => (L.mainLabels tag).index ⟨i, h⟩)\n    (fun q h => (L.errorLabels tag q.1 q.2).index ⟨i, h⟩)\n    (fun _ j => j.2.1.val = L.firstDivisor i)\n    (fun _ => rfl) (fun _ _ => rfl)\n', 'localIndex_second': '  unfold localIndex\n  dsimp only\n  exact option_dependent_match_property\n    (β := fun q => (match q with\n      | none => L.mainCarrier tag\n      | some p => L.errorCarrier tag p.1 p.2).Index)\n    (tag i)\n    (fun h => (L.mainLabels tag).index ⟨i, h⟩)\n    (fun q h => (L.errorLabels tag q.1 q.2).index ⟨i, h⟩)\n    (fun _ j => j.2.2.1.val = L.second i)\n    (fun _ => rfl) (fun _ _ => rfl)\n', 'localIndex_secondDivisor': '  unfold localIndex\n  dsimp only\n  exact option_dependent_match_property\n    (β := fun q => (match q with\n      | none => L.mainCarrier tag\n      | some p => L.errorCarrier tag p.1 p.2).Index)\n    (tag i)\n    (fun h => (L.mainLabels tag).index ⟨i, h⟩)\n    (fun q h => (L.errorLabels tag q.1 q.2).index ⟨i, h⟩)\n    (fun _ j => j.2.2.2.1.val = (L.allocation i).1)\n    (fun _ => rfl) (fun _ _ => rfl)\n'}
              reconstructed_D_B2 = candidate
              for name in reversed(names[:4]):
                  _, body, end = bounds(reconstructed_D_B2, name)
                  reconstructed_D_B2 = reconstructed_D_B2[:body] + D_proofs[name].encode() + reconstructed_D_B2[end:]
              start, stop = helper_bounds(reconstructed_D_B2, 'option_eq_none_or_some')
              reconstructed_D_B2 = reconstructed_D_B2[:start] + D_helper + reconstructed_D_B2[stop:]
              assert source_identity(reconstructed_D_B2) == combined_D_B2_identity
              _, db, de = bounds(reconstructed_D_B2, names[-1])
              _, cb, ce = bounds(candidate, names[-1])
              assert reconstructed_D_B2[db:de] == candidate[cb:ce]
              # Reverse those same five edits to independently recover the candidate.
              back = reconstructed_D_B2
              for name in reversed(names[:4]):
                  _, body, end = bounds(back, name)
                  _, cb, ce = bounds(candidate, name)
                  back = back[:body] + candidate[cb:ce] + back[end:]
              start, stop = helper_bounds(back, 'option_dependent_match_property')
              back = back[:start] + helper + back[stop:]
              assert back == candidate
              return {'owner_to_candidate_exact_six_proof_edits': True,
                      'combined_D_B2_to_candidate_exact_five_proof_edits': True,
                      'combined_D_B2_full_source_reconstructed_and_pinned': source_identity(reconstructed_D_B2),
                      'original_two_definitions_and_all_other_source_bytes_preserved': True,
                      'five_original_public_headers': headers,
                      'private_helper': source_identity(helper), 'five_proof_bodies': proof_identities,
                      'B2_weight_proof_preserved_exactly': True, 'option_changes': False}
          def verify_exact_file_option(candidate):
              option = b'set_option linter.unusedSectionVars false\n'
              anchor = b'import HeckeSkeleton.Moments.MOM_ENGINE_STEP.OriginalAmplifiedCarrier\n'
              assert len(option) == 42
              assert candidate.count(option) == candidate.count(b'set_option ') == 1
              assert candidate.startswith(anchor + option)
              baseline = candidate.replace(option, b'', 1)
              assert source_identity(baseline) == before_option_identity
              assert baseline.count(anchor) == 1
              assert baseline.replace(anchor, anchor + option, 1) == candidate
              return baseline, {'option': 'linter.unusedSectionVars', 'value': False,
                  'scope': 'entire OriginalTaggedLocalIndex file after its original import',
                  'bytes_added': 42, 'only_change_from_complete_e62d_candidate': True,
                  'exact_two_way_source_inverse': True,
                  'all_real_heads_data_proofs_imports_and_original_prints_unchanged': True,
                  'baseline': source_identity(baseline), 'candidate': source_identity(candidate)}
          def verify_exact_fvar_proof_rewrite(candidate):
              old = '  rcases option_eq_none_or_some (tag i) with h | ⟨q, h⟩ <;>\n'.encode()
              new = '  have hcases := option_eq_none_or_some (tag i)\n  rcases hcases with h | ⟨q, h⟩ <;>\n'.encode()
              assert candidate.count(new) == 4 and candidate.count(old) == 0
              baseline = candidate.replace(new, old)
              assert source_identity(baseline) == before_fvar_identity
              assert baseline.count(old) == 4 and baseline.replace(old, new) == candidate
              assert len(candidate) - len(baseline) == 96
              return baseline, {
                  'exact_four_projection_proof_prefix_replacements': True,
                  'bytes_added': 96, 'two_way_full_source_inverse': True,
                  'two_definitions_five_public_heads_B2_weight_and_all_other_bytes_unchanged': True,
                  'original_simp_only_and_rfl_tails_unchanged': True,
                  'no_additional_option_or_budget_change': True,
                  'baseline': source_identity(baseline), 'candidate': source_identity(candidate)}
          before_fvar_bytes, fvar_proof_rewrite = verify_exact_fvar_proof_rewrite(candidate_target_bytes)
          without_option_bytes, file_option_insertion = verify_exact_file_option(before_fvar_bytes)
          proof_rewrite = verify_complete_tagged_chain(original_target_bytes, without_option_bytes)
          original_prints = ['HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.localIndex_first', 'HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.localIndex_secondDivisor', 'HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.amplifiedIndexWeight_local']
          assert re.findall(r'^#print axioms (\S+)$', candidate_target_bytes.decode(), re.M) == original_prints
          record = {'source_base': source_base, 'source_base_tree': source_base_tree,
                    'normal_root': normal_root,
                    'one_complete_original_root_and_its_three_original_prints': True,
                    'changed_paths_from_base': changed,
                    'owner_claim_comment': 6569542416,
                    'all_other_production_sources_unchanged_from_frozen_owner': True,
                    'source_candidate_not_yet_owner_adopted': True,
                    'candidate_path': candidate_path,
                    'original_target_identity': original_target_identity,
                    'combined_D_B2_identity': combined_D_B2_identity,
                    'candidate_target_identity': candidate_target_identity,
                    'before_fvar_identity': before_fvar_identity,
                    'four_projection_fvar_proof_rewrite': fvar_proof_rewrite,
                    'proof_rewrite_before_file_option': proof_rewrite,
                    'before_option_identity': before_option_identity,
                    'file_option_insertion': file_option_insertion, 'option_changes': True,
                    'original_prints': original_prints,
                    'no_diagnostic_auxiliary_or_probe_files_added': True,
                    'original_verifier_and_all_original_declaration_prints_used': True,
                    'fresh_audit_scope': 'Every loaded EngineStep declaration, including private/generated declarations through the original verifier',
                    'all_G1_81_or_ready_not_claimed_by_this_single_root_run': True,
                    'final_Interface_fullfresh_Whole20_after_eight_groups_not_claimed': True,
                    'reviewed_source_pins': reviewed_source_pins,
                    'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'expected_head': os.environ['EXPECTED_SHA'],
                    'tracked_status': git('status', '--porcelain=v1', '--untracked-files=no'),
                    'tracked_sha256': {p: digest(p) for p in tracked},
                    'task_source_sha256': {p: digest(p) for p in sources},
                    'config_sha256': {p: digest(p) for p in configs},
                    'interface_imports': imports, 'libraries': libraries}
          assert json.loads(json.dumps(record)) == record, 'Provenance must use only stable JSON-native types'
          phase = sys.argv[1]
          (evidence / (phase + '-source.json')).write_text(json.dumps(record, indent=2) + '\n')
          assert record['head'] == record['expected_head'], 'Unexpected checkout SHA'
          assert not record['tracked_status'], 'Tracked source changes detected'
          assert len(tracked) == 9579, 'Complete tracked inventory changed'
          assert len(sources) == 1009, 'Task module inventory changed'
          assert len(imports) == 1008, 'Complete Interface import inventory changed'
          assert len(libraries) == 20, 'Library inventory changed'
          assert len(configs) == 7, 'Configuration inventory changed'
          if phase == 'after':
              before = json.loads((evidence / 'before-source.json').read_text())
              assert before == record, 'Source, configuration, index inventory or HEAD changed'
              (evidence / 'source-integrity.json').write_text(json.dumps({
                  'unchanged': True, 'head': record['head'], 'tree': record['tree'],
                  'tracked_files': len(tracked), 'task_modules': len(sources),
                  'interface_imports': len(imports), 'libraries': len(libraries)}, indent=2) + '\n')
          print(f'{phase}: {record["head"]} tree={record["tree"]}; {len(tracked)} tracked files, {len(sources)} task modules, {len(libraries)} libraries')
          PY
          cat > a2-tagged-fvar-native/run.py <<'PY'
          import datetime, json, re, subprocess, sys, time
          from pathlib import Path
          name, seconds, *command = sys.argv[1:]
          evidence = Path('a2-tagged-fvar-native')
          wrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]
          record = {'command': command, 'wrapper': wrapper, 'completed': False,
                    'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          receipt = evidence / (name + '-result.json')
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          start = time.monotonic()
          compact = name == 'dependencies'
          show_block = not compact
          with (evidence / (name + '-console.log')).open('w') as log:
              process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  if compact:
                      clean = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      if re.match(r'^[✔✖⚠ℹ]\s+\[\d+/\d+\]', clean):
                          show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')
                      elif re.match(r'^(error|warning|info):', clean):
                          show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')
                      elif clean.startswith('Some required targets logged failures:'):
                          show_block = True
                  if show_block:
                      print(line, end='', flush=True)
              code = process.wait()
          record.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,
                        finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record), flush=True)
          sys.exit(code if code >= 0 else 128 - code)
          PY
          python3 a2-tagged-fvar-native/provenance.py before
      - name: Provide enough memory mappings for the full legacy import closure
        run: |
          MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > a2-tagged-fvar-native/memory-mapping.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build this original root's import closure separately
        id: dependencies
        run: |
          python3 -u a2-tagged-fvar-native/run.py dependencies 1200 \
            lake build "+HeckeSkeleton.Moments.MOM_ENGINE_STEP.${ROOT_MODULE}:deps"
      - name: Compile OriginalTaggedLocalIndex and freshly audit every loaded task declaration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 -u a2-tagged-fvar-native/run.py verification 1200 \
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.OriginalTaggedLocalIndex \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --declaration HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.localIndex_first \
            --declaration HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.localIndex_secondDivisor \
            --declaration HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.amplifiedIndexWeight_local \
            --evidence a2-tagged-fvar-native/verify
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a2-tagged-fvar-native/provenance.py after
      - name: Preserve original compiler logs, timings, source hashes and fresh axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-tagged-fvar-native-${{ github.sha }}-${{ github.run_attempt }}
          path: a2-tagged-fvar-native/
          if-no-files-found: error
          retention-days: 14
