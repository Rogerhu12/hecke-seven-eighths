                    log.write(line)
                    log.flush()
                code = process.wait()
        except OSError as error:
            error_message = str(error)
        postflight = check_provenance()
        (evidence / 'postflight.json').write_text(json.dumps(postflight, indent=2) + '\n')
        valid = preflight['passed'] and postflight['passed']
        exit_code = (0 if valid else 1) if code == 0 else (code if code is not None else 1)
        result.update({
            'driver_started': code is not None,
            'driver_exit_code': code,
            'exit_code': exit_code,
            'driver_error': error_message,
            'elapsed_seconds': time.monotonic() - started,
            'source_count_before': preflight['source_count'],
            'source_count_after': postflight['source_count'],
            'provenance_unchanged': valid,
            'all_task_sources_unchanged': postflight['all_task_sources_unchanged'],
            'tracked_lean_sources_unchanged': postflight['tracked_lean_sources_unchanged'],
            'all_tracked_files_unchanged': postflight['all_tracked_files_unchanged'],
            'configuration_unchanged': postflight['configuration_unchanged'],
            'compile_input_path': str(compile_input),
            'source_bytes': len(original_bytes),
            'diagnostic_source_sha256': manifest['diagnostic_sha256'],
            'instrumentation_removed_matches_full_original': manifest['exact_full_source_recovered_after_removing_instrumentation'],
            'original_print_axioms_count': 2,
            'driver_evidence_path': str(driver_evidence),
            'output_directory': str(output),
            'outer_timeout_seconds': 195,
            'outer_timeout_kill_after_seconds': 10,
            'any_driver_or_inferior_success_is_not_original_module_acceptance': True,
        })
        (evidence / 'harness-result.json').write_text(json.dumps(result, indent=2) + '\n')
        print(json.dumps(result), flush=True)
        raise SystemExit(exit_code)
