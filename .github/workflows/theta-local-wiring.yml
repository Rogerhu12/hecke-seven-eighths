name: Theta local wiring

on:
  push:
    branches: [codex/wire-theta-local-20261031]
  pull_request:
    branches: [dtests-handoff]
    paths:
      - HeckeSkeleton/ThetaLocal/**
      - HeckeGeneral/Analysis/MarkedThetaReflection.lean
      - HeckeGeneral/Analysis/GlobalThetaData.lean
      - HeckeGeneral/Analysis/LocalThetaInput.lean
      - .github/workflows/theta-local-wiring.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theta-local-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Lean and Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@ci/lake-cache-test
      - name: Build the theta-local adapter and its audit
        run: lake build HeckeSkeleton.ThetaLocal.ProjectAudit
      - name: Check every public declaration against the axiom allowlist
        shell: bash
        run: |
          set -euo pipefail
          lake env lean HeckeSkeleton/ThetaLocal/ProjectAudit.lean | tee /tmp/theta-local-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('HeckeSkeleton/ThetaLocal/ProjectAudit.lean').read_text()
          expected = set(re.findall(r'^#print axioms (\S+)', source, re.M))
          assert expected, 'No declarations listed in the axiom audit'
          output = Path('/tmp/theta-local-axioms.log').read_text()
          pattern = r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          records = dict(re.findall(pattern, output, re.S))
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          missing = expected - records.keys()
          assert not missing, f'Missing audit records: {sorted(missing)}'
          for name in sorted(expected):
              axioms = {item.strip() for item in records[name].split(',') if item.strip()}
              assert axioms <= allowed, f'{name}: unexpected axioms {sorted(axioms - allowed)}'
          print(f'PASS: {len(expected)} declarations; axioms within {sorted(allowed)}')
          PY
