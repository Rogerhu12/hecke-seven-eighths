              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalOriginalGaussTuples.lean": "dfa4e97d244f5b237d9401422e9adcd686e03635a7c1376aa76666ee99a5fb9f",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DirectSecondStages.lean": "884eae448a40b42c145a4bba77d44aa19c3a79463a9825436a272f2c6e7559f0",
              "cloud_tasks/MOM_ENGINE_STEP_E.md": "fd62b1e3f7891148293159587a60d7beaa4bfb42dbcf416d1c74bf08c9ac231f",
              "cloud_tasks/MOM_ENGINE_STEP_GROUPS.md": "3c3bc0add6f48504dbc3acab59441677acbb3f79f1f978a92f3e0ff8980a667f",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/FirstDivisorPoolTerminal.lean": "bf30f0f0ff5447ec1922bc5737c4998a061bdc98624823dbe86a7fa040f965bb",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/FirstDivisorTerminalCalibration.lean": "69c2d68309e50d9b548f4e314c2611e2a809256edf9cdfcdffdc06830283d334",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CommonTerminalCalibration.lean": "804e3b21740954fcdafba49288a0a27aa28bcebc9292f8d44831a277f2e09a34",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalTerminalBudget.lean": "e9ea1af616a888a246dd9a532f0bbb1b6576a223276b29a878c5683560fe4ebf",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalMaskCardinality.lean": "58e72148c817bedf729cfc57d344d7293dec247a936f052ff72e4995bd3ac4c7",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalFirstTerminalCalibration.lean": "64ea223adb1cd06a833dd5806ccc78f0255dd9ef62429465ac86919c66bee297",
              "cloud_tasks/README.md": "0d97e9fa7e0deeea6237423b45a7dc863368a38e74edc10b7932d781d6b4f391",
              ".github/groups/group_build.py": "df3332a6f1d7fd1c4487bf8d2ee86e586265ebba9ebbf21e9dbc322ff742a1c2",
              ".github/groups/skeleton.py": "462e28934f21679cbe1cad548536c869c37a91749d8cfbfdda56f8c3f1341122",
              ".github/probe/probe_map.py": "78f2a76122f3fe2b79491960286accbbf2ebb169fc59c85be6ff93a2e50e346d",
              ".github/groups/g1.txt": "19809e5489ca407279db695b0ca0e51c7aa9edf091ab20b0e5c26ca4f004806a",
              ".github/groups/interface.json": "5c460e4c2d681149d790b6078732ae7591f98a961a832a3c44fac8d2873689f2",
              ".github/workflows/mom-step-group.yml": "8e993d7ab5b16abb58957f6f35bfce3565e6428704ac21872bcff91adae53643"
          }
          for path, expected in reviewed_source_pins.items():
              assert digest(path) == expected, 'Unexpected frozen source or original configuration: ' + path
          candidate_path = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/FirstDivisorPoolTerminal.lean'
          pool_path = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/PoolFiniteLeaves.lean'
          original_target_identity = {'bytes': 14735, 'sha256': 'a3d18156bebe86694354b26a1c74884723df14b80a389257cce8dceac91ee814', 'git_blob': 'b773c0d6da073dd6e9051008044c19469931f9ca'}
          candidate_target_identity = {'bytes': 14877, 'sha256': 'bf30f0f0ff5447ec1922bc5737c4998a061bdc98624823dbe86a7fa040f965bb', 'git_blob': '68b0a5e6de930ef51c00041a6cb5cc448939b82b'}
          original_pool_identity = {'bytes': 13461, 'sha256': 'd2ffeb40fa9db40b4526f17aa9de69cd23e0679091cd4088cacda1b63be18b75', 'git_blob': 'ac94d17f95bfc4640aedf52004b79131747d7ebd'}
          candidate_pool_identity = {'bytes': 13467, 'sha256': '7984bec055c28f421ccd1b8cc8215290763cb58d14c49bc9dbc436ce08813b98', 'git_blob': 'ec4568bab1589edf73a099bdc99e66f6b9f25595'}
          def source_identity(data):
              return {'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),
                      'git_blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
          def verify_exact_target_edits(original, candidate):
              assert source_identity(original) == {'bytes': 14735, 'sha256': 'a3d18156bebe86694354b26a1c74884723df14b80a389257cce8dceac91ee814', 'git_blob': 'b773c0d6da073dd6e9051008044c19469931f9ca'}
              assert source_identity(candidate) == {'bytes': 14877, 'sha256': 'bf30f0f0ff5447ec1922bc5737c4998a061bdc98624823dbe86a7fa040f965bb', 'git_blob': '68b0a5e6de930ef51c00041a6cb5cc448939b82b'}
              edits = [{'name': 'zero_budget_calibration_product_exponent', 'old_start_char': 9520, 'old_line': 191, 'old': '    (by simpa only [T.calibration_tag] using hbudget b)\n', 'new': '    (by\n      rw [T.calibration_tag]\n      change T.zeroExponent b + (T.profile b).productExponent * ε ≤ budget\n      exact hbudget b)\n', 'new_start_char': 9520, 'new_line': 191, 'declaration': 'zeroBudget_le_original_profiles'}, {'name': 'zero_budget_explicit_tag_le_arguments', 'old_start_char': 9813, 'old_line': 195, 'old': '(by exact_mod_cast Q.tag_le b)', 'new': '(by exact_mod_cast OriginalTupleMultiplicities.tag_le T Q b)', 'new_start_char': 9892, 'new_line': 198, 'declaration': 'zeroBudget_le_original_profiles'}, {'name': 'tail_budget_explicit_tag_le_arguments', 'old_start_char': 12427, 'old_line': 241, 'old': '(by exact_mod_cast Q.tag_le b)', 'new': '(by exact_mod_cast OriginalTupleMultiplicities.tag_le T Q b)', 'new_start_char': 12536, 'new_line': 244, 'declaration': 'tailBudget_le_original_profiles'}]
              forward = original.decode()
              for edit in sorted(edits,key=lambda x:x['old_start_char'],reverse=True):
                  start=edit['old_start_char']
                  assert forward[start:start+len(edit['old'])] == edit['old'], edit['name']
                  forward=forward[:start]+edit['new']+forward[start+len(edit['old']):]
              assert forward.encode() == candidate
              backward=candidate.decode()
              for edit in sorted(edits,key=lambda x:x['new_start_char'],reverse=True):
                  start=edit['new_start_char']
                  assert backward[start:start+len(edit['new'])] == edit['new'], edit['name']
                  backward=backward[:start]+edit['old']+backward[start+len(edit['new']):]
              assert backward.encode() == original
              return {'exact_three_existing_proof_ranges':True,'two_way_complete_source_inverse':True,
                      'eleven_original_heads_four_data_blocks_and_other_proofs_unchanged':True,
                      'no_option_instance_assumption_carrier_or_budget_change':True}
          def verify_pool_local_registration(original, candidate):
              assert source_identity(original) == {'bytes': 13461, 'sha256': 'd2ffeb40fa9db40b4526f17aa9de69cd23e0679091cd4088cacda1b63be18b75', 'git_blob': 'ac94d17f95bfc4640aedf52004b79131747d7ebd'}
              assert source_identity(candidate) == {'bytes': 13467, 'sha256': '7984bec055c28f421ccd1b8cc8215290763cb58d14c49bc9dbc436ce08813b98', 'git_blob': 'ec4568bab1589edf73a099bdc99e66f6b9f25595'}
              old=b'attribute [instance] coveredLeafKeyFintype\n'
              new=b'attribute [local instance] coveredLeafKeyFintype\n'
              assert original.count(old)==1 and candidate.count(new)==1
              assert candidate==original.replace(old,new,1)
              assert original==candidate.replace(new,old,1)
              assert len(candidate)==len(original)+6
              return {'only_registration_scope_local':True,'bytes_delta':6,'two_way_complete_source_inverse':True,
                      'public_abbrev_instance_term_all_original_heads_data_and_proofs_unchanged':True,
                      'coordinator_comments':[6571400398,6572087480]}
          original_target_bytes=subprocess.check_output(['git','show',source_base+':'+candidate_path])
          candidate_target_bytes=(root/candidate_path).read_bytes()
          original_pool_bytes=subprocess.check_output(['git','show',source_base+':'+pool_path])
          candidate_pool_bytes=(root/pool_path).read_bytes()
          proof_rewrite=verify_exact_target_edits(original_target_bytes,candidate_target_bytes)
          pool_registration=verify_pool_local_registration(original_pool_bytes,candidate_pool_bytes)
          for path, old_identity, new_identity in [(candidate_path,original_target_identity,candidate_target_identity),
                                                  (pool_path,original_pool_identity,candidate_pool_identity)]:
              assert git('rev-parse',source_base+':'+path)==old_identity['git_blob']
              assert git('rev-parse','HEAD:'+path)==new_identity['git_blob']
          original_prints = ['HeckeSkeleton.Moments.EngineStep.ActualPoolStages.FirstDivisorWindows.zeroBudget_le_original_profiles', 'HeckeSkeleton.Moments.EngineStep.ActualPoolStages.FirstDivisorWindows.tailBudget_le_original_profiles', 'HeckeSkeleton.Moments.EngineStep.first_terminal_tuple_multiplicity_subpower']
          assert re.findall(r'^#print axioms (\S+)$',candidate_target_bytes.decode(),re.M)==original_prints
          assert re.findall(r'^#print axioms (\S+)$',original_target_bytes.decode(),re.M)==original_prints
          assert re.findall(r'^#print axioms (\S+)$',candidate_pool_bytes.decode(),re.M)==re.findall(r'^#print axioms (\S+)$',original_pool_bytes.decode(),re.M)
          lake_config=tomllib.loads(Path('lakefile.toml').read_text())
          assert lake_config['weakLeanArgs']==['-j2']
          assert lake_config['leanOptions']=={'autoImplicit':False,'relaxedAutoImplicit':False}
          record = {'source_base':source_base,'source_base_tree':source_base_tree,'normal_root':normal_root,
                    'changed_paths_from_base':changed,'owner_claim_comment':6572602229,
                    'coordinator_local_instance_comments':[6571400398,6572087480],
                    'one_complete_real_root_and_its_three_original_prints':True,
                    'source_candidate_not_yet_owner_adopted':True,
                    'candidate_path':candidate_path,'original_target_identity':original_target_identity,
                    'candidate_target_identity':candidate_target_identity,'proof_rewrite':proof_rewrite,
                    'pool_dependency_path':pool_path,'original_pool_identity':original_pool_identity,
                    'candidate_pool_identity':candidate_pool_identity,'pool_registration':pool_registration,
                    'no_global_cache_restored':True,'no_other_consumer_changes':True,
                    'original_prints':original_prints,
                    'no_diagnostic_auxiliary_or_probe_files_added':True,
                    'original_verifier_and_all_original_declaration_prints_used':True,
                    'fresh_audit_scope':'Every loaded EngineStep declaration, including private/generated declarations through the original verifier',
