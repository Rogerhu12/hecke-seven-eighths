name: A2 First divisor pool proof repairs normal build and fresh task axiom audit

on:
  push:
    branches: [cloud/mom-engine-step-a2-first-divisor-pool-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-first-divisor-pool-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  first_divisor_pool:
    name: Normal FirstDivisorPoolTerminal
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      ROOT_MODULE: 'FirstDivisorPoolTerminal'
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-first-divisor-pool-native
          git show --no-patch --format=fuller HEAD > a2-first-divisor-pool-native/checkout.txt
          cat > a2-first-divisor-pool-native/provenance.py <<'PY'
          import hashlib, json, os, re, subprocess, sys, tomllib
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'a2-first-divisor-pool-native'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')
          sources = sorted(str(p) for p in task.glob('*.lean'))
          configs = ['lean-toolchain', 'lakefile.toml', 'lake-manifest.json',
                     'vendor/class-field-theory/lean-toolchain',
                     'vendor/class-field-theory/lakefile.toml',
                     'vendor/class-field-theory/lake-manifest.json', str(task / 'verify.py')]
          interface = (task / 'Interface.lean').read_text()
          imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', interface, re.M)))
          libraries = [x['name'] for x in tomllib.loads(Path('lakefile.toml').read_text())['lean_lib']]
          normal_root = os.environ['ROOT_MODULE']
          assert normal_root == 'FirstDivisorPoolTerminal', 'Unexpected normal root'
          source_base = 'd90f7b55d06812fe388dd36c3bfb4bb39343d721'
          source_base_tree = git('rev-parse', source_base + '^{tree}')
          assert source_base_tree == 'daaa8fd23cc5322a54044a3d5ff0c86de29eafeb', 'Unexpected frozen complete production tree'
          assert git('rev-parse', 'HEAD^') == source_base, 'Unexpected direct parent'
          assert len(git('rev-list', '--parents', '-n', '1', 'HEAD').split()) == 2
          changed = git('diff', '--name-only', source_base, 'HEAD').splitlines()
          assert changed == ['.github/workflows/mom-engine-step-a2-first-divisor-pool-native.yml', 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/FirstDivisorPoolTerminal.lean', 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/PoolFiniteLeaves.lean'], 'Only the three proof repairs, Pool local registration and this workflow are permitted'
          assert git('diff', '--name-status', source_base, 'HEAD').splitlines() == ['A\t.github/workflows/mom-engine-step-a2-first-divisor-pool-native.yml', 'M\tHeckeSkeleton/Moments/MOM_ENGINE_STEP/FirstDivisorPoolTerminal.lean', 'M\tHeckeSkeleton/Moments/MOM_ENGINE_STEP/PoolFiniteLeaves.lean']
