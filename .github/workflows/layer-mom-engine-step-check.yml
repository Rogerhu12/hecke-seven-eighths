name: MOM_ENGINE_STEP layer check (temporary)

# TEMPORARY workflow for the MOM_ENGINE_STEP lower-layer PR; drop it at merge.
# Builds every STEP module present on the branch as an explicit Lake target,
# then checks the axioms reported by the modules' own `#print axioms` lines
# and re-prints the axioms of a sample of their declarations in a fresh file
# that imports every STEP module of the branch.
on:
  pull_request:
    branches: [dtests-handoff]
    paths:
      - "HeckeSkeleton/Moments/MOM_ENGINE_STEP/**"
      - ".github/workflows/layer-mom-engine-step-check.yml"
  push:
    branches: ["layer-probe/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer-mom-engine-step-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reserve space for the pinned toolchain and artifacts
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          df -h /
      - name: Set up the pinned Lean and Mathlib environment
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: List the STEP modules on this branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/layer
          git show --no-patch --format=fuller HEAD > /tmp/layer/checkout.txt
          ls HeckeSkeleton/Moments/MOM_ENGINE_STEP/*.lean | sed 's#\.lean$##; s#/#.#g' | sort > /tmp/layer/modules.txt
          echo "STEP modules: $(wc -l < /tmp/layer/modules.txt)"
          sha256sum HeckeSkeleton/Moments/MOM_ENGINE_STEP/*.lean > /tmp/layer/sources-before.sha256
      - name: Build every STEP module as an explicit target
        shell: bash
        run: |
          set -uo pipefail
          limit="${{ github.event_name == 'push' && '60m' || '200m' }}"
          status=0
          timeout --signal=TERM --kill-after=60s "$limit" lake build $(cat /tmp/layer/modules.txt) > /tmp/layer/build.log 2>&1 || status=$?
          grep -E '^(✖|error:)' /tmp/layer/build.log | head -200 || true
          tail -5 /tmp/layer/build.log
          echo "lake build exit status: $status"
          exit "$status"
      - name: Summarize module status and axioms from the build log
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          log = open('/tmp/layer/build.log', encoding='utf-8', errors='replace').read()
          mods = open('/tmp/layer/modules.txt').read().split()
          line = re.compile(r'^(?:✔|⚠|ℹ|✖)\s+\[\d+/\d+\]\s+(Built|Replayed|Building)\s+(\S+)(?:\s+\(([^)]*)\))?', re.M)
          status = {}
          for m in line.finditer(log):
              status[m.group(2)] = [m.group(1), m.group(3)]
          ok = [x for x in mods if status.get(x, [''])[0] in ('Built', 'Replayed')]
          failed = [x for x in mods if status.get(x, [''])[0] == 'Building']
          silent = [x for x in mods if x not in status]
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          axioms = {}
          for m in re.finditer(r"'(\S+)' depends on axioms: \[([^\]]*)\]", log):
              axioms[m.group(1)] = sorted(a.strip() for a in m.group(2).split(',') if a.strip())
          for m in re.finditer(r"'(\S+)' does not depend on any axioms", log):
              axioms[m.group(1)] = []
          nonstandard = {k: v for k, v in axioms.items() if not set(v) <= allowed}
          sorry_warnings = len(re.findall(r"declaration uses 'sorry'", log))
          summary = {
              'modules': len(mods), 'ok': len(ok), 'failed': failed, 'no_status_line': silent,
              'declarations_with_axiom_report': len(axioms),
              'axiom_sets': sorted({', '.join(v) for v in axioms.values()}),
              'nonstandard_axioms': nonstandard, 'sorry_warnings': sorry_warnings,
          }
          json.dump({'summary': summary, 'status': status, 'axioms': axioms},
                    open('/tmp/layer/status.json', 'w'), indent=1)
          print(json.dumps(summary, indent=1))
          kw = {'def', 'end', 'fun', 'have', 'show', 'from', 'at', 'by', 'do', 'then', 'else', 'if', 'let', 'in', 'match', 'with', 'where', 'theorem', 'lemma', 'instance', 'structure', 'class', 'open', 'namespace', 'section', 'variable', 'universe', 'local', 'private', 'protected', 'noncomputable', 'example', 'abbrev', 'deriving', 'mutual', 'calc', 'Type', 'Sort', 'Prop'}
          ident = re.compile(r"^[A-Za-z_][\w'.]*$")
          public = sorted(k for k in axioms if ident.match(k) and not k.startswith('_private')
                          and not any(c in kw or not c for c in k.split('.')))
          step = max(1, len(public) // 60)
          open('/tmp/layer/sample.txt', 'w').write('\n'.join(public[::step][:60]) + '\n')
          if nonstandard or sorry_warnings:
              raise SystemExit('nonstandard axioms or sorry warnings found')
          PY
      - name: Re-print axioms of a sample of declarations in a fresh file
        shell: bash
        run: |
          set -euo pipefail
          {
            sed 's/^/import /' /tmp/layer/modules.txt
            echo
            sed 's/^/#print axioms /' /tmp/layer/sample.txt
          } > LayerAxiomSample.lean
          cp LayerAxiomSample.lean /tmp/layer/LayerAxiomSample.lean
          lake env lean LayerAxiomSample.lean 2>&1 | tee /tmp/layer/sample-axioms.log
          python3 - <<'PY'
          import re
          log = open('/tmp/layer/sample-axioms.log', encoding='utf-8').read()
          names = open('/tmp/layer/sample.txt').read().split()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          found = {}
          for m in re.finditer(r"'(\S+)' depends on axioms: \[([^\]]*)\]", log):
              found[m.group(1)] = {a.strip() for a in m.group(2).split(',') if a.strip()}
          for m in re.finditer(r"'(\S+)' does not depend on any axioms", log):
              found[m.group(1)] = set()
          bad = {k: sorted(v) for k, v in found.items() if not v <= allowed}
          print(f'sample: {len(names)} names, {len(found)} reports, nonstandard: {bad}')
          if bad or len(found) < len(names) or re.search(r':\d+:\d+: error', log):
              raise SystemExit('sample axiom check failed')
          PY
      - name: Check that the sources were not modified
        if: always()
        shell: bash
        run: sha256sum -c --quiet /tmp/layer/sources-before.sha256
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-mom-engine-step-check-${{ github.sha }}
          path: /tmp/layer
          if-no-files-found: warn
          retention-days: 14
