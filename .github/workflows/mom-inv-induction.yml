name: Canonical inverse induction verification

on:
  push:
    branches: [cloud/mom-inv-induction]
  pull_request:
    branches: [dtests-handoff]
    paths:
      - 'HeckeSkeleton/Moments/MOM_INV_INDUCTION/**'
      - 'HeckeSkeleton/Moments.lean'
      - '.github/workflows/mom-inv-induction.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-inv-induction-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core
            name: Canonical induction and axiom gate
            module: HeckeSkeleton.Moments.MOM_INV_INDUCTION.Audit
            audit: HeckeSkeleton/Moments/MOM_INV_INDUCTION/Audit.lean
            target: ''
          - id: transport
            name: Completed energy transport and axiom gate
            module: HeckeSkeleton.Moments.MOM_INV_INDUCTION.CompletedEnergyTransportAudit
            audit: HeckeSkeleton/Moments/MOM_INV_INDUCTION/CompletedEnergyTransportAudit.lean
            target: ''
          - id: provider
            name: Actual source and provider adapters and axiom gate
            module: HeckeSkeleton.Moments.MOM_INV_INDUCTION.ProviderAudit
            audit: HeckeSkeleton/Moments/MOM_INV_INDUCTION/ProviderAudit.lean
            target: ''
          - id: original
            name: Original skeleton statement and axiom gate
            module: HeckeSkeleton.Moments
            audit: HeckeSkeleton/Moments/MOM_INV_INDUCTION/OriginalAudit.lean
            target: HeckeSkeleton.canonical_inverse_models
    env:
      LEAN_NUM_THREADS: '2'
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      AUDIT_FILE: ${{ matrix.audit }}
      AUDIT_TARGET: ${{ matrix.target }}
      EVIDENCE_DIR: /tmp/mom-inv-induction-${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the repository's pinned Lean and Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@ci/lake-cache-test
      - name: Record the compilation environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'Requested head: %s\nPR base: %s\n' "$CI_HEAD_SHA" "$CI_BASE_SHA"
            git rev-parse HEAD
            cat lean-toolchain
            lake env lean --version
            git -C .lake/packages/mathlib rev-parse HEAD
          } | tee "$EVIDENCE_DIR/environment.log"
      - name: Compile the selected target with normal Lake dependency checking
        shell: bash
        run: |
          set -euo pipefail
          lake build '${{ matrix.module }}' 2>&1 |
            tee "$EVIDENCE_DIR/build.log"
      - name: Print and enforce the axiom allowlist
        shell: bash
        run: |
          set -euo pipefail
          lake env lean "$AUDIT_FILE" 2>&1 | tee "$EVIDENCE_DIR/axioms.log"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          directory = Path(os.environ['EVIDENCE_DIR'])
          source = Path(os.environ['AUDIT_FILE']).read_text()
          declared = set(re.findall(r'^#print axioms (\S+)', source, re.M))
          target = os.environ['AUDIT_TARGET']
          expected = {target} if target else declared
          assert expected, 'The audit module contains no declarations'
          assert expected <= declared, 'A required target is absent from the audit module'
          output = (directory / 'axioms.log').read_text()
          pattern = r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)"
          records = dict(re.findall(pattern, output, re.S))
          missing = expected - records.keys()
          assert not missing, f'Missing audit records: {sorted(missing)}'
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          report = {}
          unexpected = {}
          for name in sorted(expected):
              axioms = {item.strip() for item in records[name].split(',') if item.strip()}
              report[name] = sorted(axioms)
              if axioms - allowed:
                  unexpected[name] = sorted(axioms - allowed)
          (directory / 'axiom-report.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## {os.environ["AUDIT_FILE"]}\n\n')
              summary.write(f'Audited declarations: {len(expected)}.\n\n')
              summary.write(f'Unexpected axioms: `{unexpected}`.\n')
          assert not unexpected, f'Unexpected axioms: {unexpected}'
          print(f'PASS: {len(expected)} declarations; axioms within {sorted(allowed)}')
          PY
      - name: Preserve compiler and axiom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-inv-induction-${{ matrix.id }}-${{ env.CI_HEAD_SHA }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn
          retention-days: 14
