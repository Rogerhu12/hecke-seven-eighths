           assert process.stdout is not None\n                for line in process.stdout:\n                    log.write(line); log.flush(); print(line,end=\'\',flush=True)\n                code = process.wait()\n            result.update(status=\'diagnostic_finished\', driver_wrapper_exit_code=code)\n    except BaseException as exc:\n        result.update(status=\'harness_error\', error=repr(exc)); code = 1\n    finally:\n        # Restrict fallback signals to the fresh session created by this harness.\n        if process is not None and process.poll() is None:\n            try:\n                os.killpg(process.pid, signal.SIGTERM); process.wait(timeout=12)\n            except subprocess.TimeoutExpired:\n                os.killpg(process.pid, signal.SIGKILL); process.wait(timeout=3)\n            except ProcessLookupError:\n                pass\n        for sig, handler in handlers.items():\n            signal.signal(sig, handler)\n        driver_report = evidence/\'driver/stack-result.json\'\n        if driver_report.exists():\n            result[\'driver_result\'] = json.loads(driver_report.read_text())\n            result[\'sample_count\'] = result[\'driver_result\'][\'snapshot_count\']\n            if not result[\'driver_result\'].get(\'cleanup_complete\'):\n                code = 1; result[\'status\'] = \'driver_cleanup_failed\'\n        if compile_input is not None:\n            compile_input.unlink(missing_ok=True)\n            result[\'temporary_input_removed\'] = not compile_input.exists()\n        if temporary is not None:\n            temporary.cleanup(); result[\'temporary_outputs_removed\'] = True\n        if original is not None:\n            result[\'source_unchanged\'] = (repo/contract[\'target_path\']).read_bytes() == original\n            if not result[\'source_unchanged\']:\n                code = 1; result[\'status\'] = \'original_source_changed\'\n        result.update(flags, elapsed_seconds=time.monotonic()-started, harness_exit_code=code)\n        save(); print(json.dumps(result,ensure_ascii=False),flush=True)\n    return code\n\n\nif __name__ == \'__main__\':\n    raise SystemExit(main())\n', 'provenance.py': "import hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\nimport sys\nimport tomllib\n\n\ndef identity(data):\n    return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),\n            'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\\0' + data).hexdigest()}\n\n\ndef verify_source_pair(original, candidate, contract):\n    assert identity(original) == contract['base_target']\n    assert identity(candidate) == contract['candidate']\n    forward = original\n    for entry in reversed(contract['source_edits']):\n        offset = entry['original_offset']\n        forward = forward[:offset] + entry['inserted_text'].encode() + forward[offset:]\n    assert forward == candidate\n    backward = candidate\n    for entry in reversed(contract['source_edits']):\n        offset = entry['candidate_offset']; addition = entry['inserted_text'].encode()\n        assert backward[offset:offset+len(addition)] == addition\n        backward = backward[:offset] + backward[offset+len(addition):]\n    assert backward == original\n    for prefix in [b'import ', b'#print axioms ']:\n        assert [x for x in original.splitlines() if x.startswith(prefix)] == [\n            x for x in candidate.splitlines() if x.startswith(prefix)]\n    assert candidate.count(b'set_option ') == 1\n    assert b'set_option linter.unusedSectionVars false\\n' in candidate\n    return True\n\n\ndef main():\n    evidence = Path(__file__).resolve().parent\n    contract = json.loads((evidence/'contract.json').read_text())\n    root = Path.cwd()\n    def git(*args):\n        return subprocess.check_output(['git', *args], text=True).strip()\n    def digest(path):\n        return hashlib.sha256((root/path).read_bytes()).hexdigest()\n    head = git('rev-parse', 'HEAD'); tree = git('rev-parse', 'HEAD^{tree}')\n    assert head == os.environ['EXPECTED_SHA']\n    assert git('rev-list', '--parents', '-n', '1', 'HEAD').split() == [head, contract['base']]\n    assert git('rev-parse', contract['base']+'^{tree}') == contract['base_tree']\n    changed = git('diff', '--name-only', contract['base'], 'HEAD').splitlines()\n    assert set(changed) == {contract['target_path'], contract['workflow_path']}\n    assert set(git('diff', '--name-status', contract['base'], 'HEAD').splitlines()) == {\n        'M\\t'+contract['target_path'], 'A\\t'+contract['workflow_path']}\n    original = subprocess.check_output(['git', 'show', contract['base']+':'+contract['target_path']])\n    candidate = (root/contract['target_path']).read_bytes()\n    assert verify_source_pair(original, candidate, contract)\n    assert identity((root/contract['pool_path']).read_bytes()) == contract['pool_identity']\n    assert git('rev-parse', 'HEAD:'+contract['target_path']) == contract['candidate']['git_blob']\n    tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\\0')[:-1]\n    task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')\n    sources = sorted(str(x) for x in task.glob('*.lean'))\n    imports = sorted(set(re.findall(r'^import (HeckeSkeleton\\.Moments\\.MOM_ENGINE_STEP\\.\\S+)$',\n                                   (task/'Interface.lean').read_text(), re.M)))\n    lakefile = tomllib.loads(Path('lakefile.toml').read_text())\n    libraries = [x['name'] for x in lakefile['lean_lib']]\n    assert lakefile['weakLeanArgs'] == ['-j2']\n    assert lakefile['leanOptions'] == {'autoImplicit': False, 'relaxedAutoImplicit': False}\n    assert os.environ['LEAN_NUM_THREADS'] == '2'\n    assert len(tracked) == contract['tracked_file_count']\n    assert len(sources) == contract['task_module_count'] == 1009\n    assert len(imports) == contract['interface_import_count'] == 1008\n    assert len(libraries) == contract['library_count'] == 20\n    configs = {x:digest(x) for x in contract['config_sha256']}\n    assert configs == contract['config_sha256'] and len(configs) == 7\n    status = git('status', '--porcelain=v1', '--untracked-files=no')\n    assert not status\n    record = {\n        'head': head, 'tree': tree, 'source_base': contract['base'],\n        'source_base_tree': contract['base_tree'], 'changed_paths': changed,\n        'candidate': contract['candidate'], 'candidate_origin': 'A2 complete c127 source; no proof changes in this diagnostic',\n        'pool': contract['pool_identity'], 'original_prints': contract['original_prints'],\n        'tracked_status': status, 'tracked_sha256': {x:digest(x) for x in tracked},\n        'task_source_sha256': {x:digest(x) for x in sources},\n        'config_sha256': configs, 'interface_imports': imports, 'libraries': libraries,\n        'source_existing_option': contract['source_existing_option'],\n        'diagnostic_lean_option_overrides': {'stderrAsMessages': False},\n        'heartbeat_override': None, 'async_override': None,\n        'diagnostic_only': True, 'acceptance_evidence': False,\n        'original_module_acceptance': False, 'fresh_axiom_audit_performed': False,\n        'compiler_outputs_can_be_restored_as_project_cache': False,\n    }\n    phase = sys.argv[1]\n    assert phase in ['before', 'after']\n    (evidence/(phase+'-source.json')).write_text(json.dumps(record, indent=2)+'\\n')\n    if phase == 'after':\n        assert json.loads((evidence/'before-source.json').read_text()) == record\n        (evidence/'source-integrity.json').write_text(json.dumps({\n            'unchanged': True, 'head': head, 'tree': tree, 'tracked_files': len(tracked),\n            'task_modules': len(sources), 'interface_imports': len(imports),\n            'libraries': len(libraries), 'diagnostic_only': True,\n            'acceptance_evidence': False}, indent=2)+'\\n')\n    print(phase, head, tree, len(tracked), len(sources), len(imports), len(libraries), flush=True)\n\n\nif __name__ == '__main__':\n    main()\n", 'run.py': "import datetime, json, re, subprocess, sys, time\nfrom pathlib import Path\nname, seconds, *command = sys.argv[1:]\nevidence = Path('a-recovery-first-block-gdb')\nwrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]\nrecord = {'command': command, 'wrapper': wrapper, 'completed': False,\n          'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}\nreceipt = evidence / (name + '-result.json')\nreceipt.write_text(json.dumps(record, indent=2) + '\\n')\nstart = time.monotonic()\ncompact = name == 'dependencies'\nshow_block = not compact\nwith (evidence / (name + '-console.log')).open('w') as log:\n    process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)\n    for line in process.stdout:\n        log.write(line)\n        log.flush()\n        if compact:\n            clean = re.sub(r'\\x1b\\[[0-9;]*m', '', line)\n            if re.match(r'^[✔✖⚠ℹ]\\s+\\[\\d+/\\d+\\]', clean):\n                show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')\n            elif re.match(r'^(error|warning|info):', clean):\n                show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')\n            elif clean.startswith('Some required targets logged failures:'):\n                show_block = True\n        if show_block:\n            print(line, end='', flush=True)\n    code = process.wait()\nrecord.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,\n              finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())\nreceipt.write_text(json.dumps(record, indent=2) + '\\n')\nprint(json.dumps(record), flush=True)\nsys.exit(code if code >= 0 else 128 - code)\n"}
        expected = {'contract.json': 'cbd977cddd43ed601600d17ff38f1badd3e8b183f878e71e4161051ef3102d30', 'driver.py': 'ac4b7f310acb82521ecd4e03f9e5736b04feedd769268232806a38600d4e6bec', 'harness.py': '20376130e8e0da4e9beb986e5296a8405f5ec87b43e6e22a808cb766445dbbe9', 'provenance.py': '1c8b8b1048d54c5007c6dcf22215565d172c5dd09855cadad175f12f86b0ec15', 'run.py': '6f583974d0c3f2f8e539336993be144a20600e081a752d8cb1e423d98cf24168'}
