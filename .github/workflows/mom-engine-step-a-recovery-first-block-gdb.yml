result["snapshot_count"] = len(result["snapshots"])\n        result["driver_exit_code"] = exit_status\n        (evidence / "stack-result.json").write_text(json.dumps(result, indent=2) + "\\n")\n        print(json.dumps(result), flush=True)\n    return exit_status\n\n\ndef main() -> int:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument("--input", required=True, type=Path)\n    parser.add_argument("--output", required=True, type=Path)\n    parser.add_argument("--evidence", required=True, type=Path)\n    args = parser.parse_args()\n    signal.signal(signal.SIGTERM, request_abort)\n    signal.signal(signal.SIGINT, request_abort)\n    return run(args)\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n', 'harness.py': '#!/usr/bin/env python3\n"""Full reversible FirstBlock source, one own-inferior GDB sample, never acceptance."""\nimport argparse\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport signal\nimport subprocess\nimport sys\nimport tempfile\nimport time\n\n\ndef digest(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef instrument(original, contract):\n    assert len(original) == contract[\'candidate\'][\'bytes\']\n    assert digest(original) == contract[\'candidate\'][\'sha256\']\n    marked = bytearray(); previous = 0\n    for entry in contract[\'markers\']:\n        offset = entry[\'original_offset\']; assert offset >= previous\n        marked.extend(original[previous:offset]); previous = offset\n        assert len(marked) == entry[\'marked_offset\']\n        marked.extend(entry[\'inserted_line\'].encode())\n    marked.extend(original[previous:]); marked = bytes(marked)\n    assert len(marked) == contract[\'marked\'][\'bytes\']\n    assert digest(marked) == contract[\'marked\'][\'sha256\']\n    restored = marked\n    for entry in reversed(contract[\'markers\']):\n        offset = entry[\'marked_offset\']; addition = entry[\'inserted_line\'].encode()\n        assert restored[offset:offset+len(addition)] == addition\n        restored = restored[:offset]+restored[offset+len(addition):]\n    assert restored == original\n    marker_lines = {x[\'inserted_line\'].encode() for x in contract[\'markers\']}\n    assert len(marker_lines) == len(contract[\'markers\']) == 61\n    assert b\'\'.join(x for x in marked.splitlines(keepends=True) if x not in marker_lines) == original\n    for prefix in [b\'import \', b\'#print axioms \', b\'set_option \']:\n        assert [x for x in original.splitlines() if x.startswith(prefix)] == [\n            x for x in marked.splitlines() if x.startswith(prefix)]\n    assert marked.count(b\'set_option \') == 1\n    return marked\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\'--repo\', required=True, type=Path)\n    parser.add_argument(\'--evidence\', required=True, type=Path)\n    parser.add_argument(\'--prepare-only\', action=\'store_true\')\n    args = parser.parse_args()\n    repo = args.repo.resolve(); evidence = args.evidence.resolve()\n    helper_dir = Path(__file__).resolve().parent\n    contract = json.loads((helper_dir/\'contract.json\').read_text())\n    driver = helper_dir/\'driver.py\'\n    assert digest(driver.read_bytes()) == contract[\'driver_identity\'][\'sha256\']\n    evidence.mkdir(parents=True, exist_ok=True)\n    assert \'.lake\' not in evidence.parts\n    report = evidence/\'harness-result.json\'; assert not report.exists()\n    flags = dict(diagnostic_only=True, acceptance_evidence=False,\n                 original_module_native_was_run=False, original_module_acceptance=False,\n                 fresh_axiom_audit_performed=False, complete_target_module_compiled=False,\n                 compiler_outputs_can_be_restored_as_project_cache=False,\n                 full_task_acceptance=False, production_approval=False)\n    result = dict(flags, status=\'preflight\', source_identity=contract[\'candidate\'],\n                  marked_identity=contract[\'