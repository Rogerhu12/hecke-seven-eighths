    - name: Provide the normal import-closure memory mapping setting
      shell: bash
      run: |
        MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
        if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
          sudo sysctl -w vm.max_map_count=262144
        fi
        sysctl vm.max_map_count > a-recovery-first-block-gdb/memory-mapping.txt
    - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
      with:
        auto-config: 'false'
        build: 'false'
        test: 'false'
        lint: 'false'
        use-mathlib-cache: 'true'
        use-github-cache: 'false'
    - name: Restore normal precompiled project dependencies
      uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
    - name: Verify pinned Lean and mathlib before the original dependency build
      shell: bash
      run: |
        python3 -u - <<'PYENV'
        import json, subprocess
        from pathlib import Path
        evidence = Path('a-recovery-first-block-gdb')
        version = subprocess.check_output(['lake', 'env', 'lean', '--version'], text=True).strip()
        mathlib = subprocess.check_output(['git', '-C', '.lake/packages/mathlib', 'rev-parse', 'HEAD'], text=True).strip()
        assert '4.35.0-rc3' in version and '470d5ce1400764999581fd26d5d72b00d990b0f4' in version
        assert mathlib == '0493595ecd5da8ef14742febab99728f98e948e8'
        (evidence/'environment.json').write_text(json.dumps({'lean':version,'mathlib':mathlib,'diagnostic_only':True,'acceptance_evidence':False},indent=2)+'\n')
        PYENV
    - name: Build only the original imports using normal Lake
      id: dependencies
      shell: bash
      run: |
        python3 -u a-recovery-first-block-gdb/run.py dependencies 1200 \
          lake build +HeckeSkeleton.Moments.MOM_ENGINE_STEP.FirstBlockFiniteLeaves:deps
    - name: Install and verify the standard unprivileged GDB dependency
      id: debugger
      timeout-minutes: 8
      shell: bash
      run: |
        python3 -u - <<'PYGDB'
        import json, pathlib, shutil, subprocess
        evidence = pathlib.Path('a-recovery-first-block-gdb')
        evidence.mkdir(exist_ok=True)
        gdb = shutil.which('gdb')
        result = {
            'scope': 'diagnostic-only GDB harness dependency setup',
            'gdb_preinstalled': gdb is not None,
            'dependency_install_attempted': False,
            'installed_or_modified_any_dependency': False,
            'changed_system_security_settings': False,
            'debugger_runs_as_root': False,
            'complete_target_module_compiled': False,
            'original_module_acceptance': False,
            'full_task_acceptance': False,
            'exit_code': 1,
        }
        try:
            if gdb is None:
                result['dependency_install_attempted'] = True
                result['installed_or_modified_any_dependency'] = True
                with (evidence / 'gdb-install.log').open('w') as log:
                    for command in [
                        ['sudo', 'apt-get', 'update'],
                        ['sudo', 'apt-get', 'install', '--yes', '--no-install-recommends', 'gdb'],
                    ]:
                        log.write('COMMAND: ' + ' '.join(command) + '\n')
                        log.flush()
                        subprocess.run(command, stdout=log, stderr=subprocess.STDOUT,
                                       stdin=subprocess.DEVNULL, timeout=180, check=True)
                gdb = shutil.which('gdb')
            result['gdb_available'] = gdb is not None
            result['gdb_path'] = gdb
            if gdb is None:
                result['reason'] = 'The standard package install did not provide gdb'
            else:
                process = subprocess.run([gdb, '--version'], text=True, capture_output=True, timeout=10)
                result['gdb_version_first_line'] = process.stdout.splitlines()[0] if process.stdout else ''
                result['version_exit_code'] = process.returncode
                result['exit_code'] = 0 if process.returncode == 0 else 1
        except (OSError, subprocess.SubprocessError) as error:
            result['reason'] = str(error)
        (evidence / 'harness-dependency.json').write_text(json.dumps(result, indent=2) + '\n')
        print(json.dumps(result), flush=True)
        raise SystemExit(result['exit_code'])
        PYGDB
    - name: Sample the complete reversible FirstBlock source exactly once
      id: diagnostic
      shell: bash
      run: |
        python3 -u a-recovery-first-block-gdb/harness.py --repo "$GITHUB_WORKSPACE" --evidence a-recovery-first-block-gdb/diagnostic
    - name: Check every tracked source and configuration after diagnosis
      if: always()
      shell: bash
      run: |
        python3 a-recovery-first-block-gdb/provenance.py after
    - name: Keep original dependency logs, one real stack, full source and false acceptance flags
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: a-recovery-first-block-gdb-${{ github.sha }}-${{ github.run_attempt }}
        path: a-recovery-first-block-gdb/
        if-no-files-found: error
        retention-days: 14
