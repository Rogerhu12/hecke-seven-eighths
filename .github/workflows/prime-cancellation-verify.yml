name: Prime cancellation wiring

on:
  push:
    branches: [wire/prime-cancellation-20261031]
  pull_request:
    branches: [dtests-handoff]
    paths:
      - 'HeckeSkeleton/PrimeCancellation*.lean'
      - 'cloud_tasks/WIRE_PRIME_CANCELLATION_REPORT.md'
      - '.github/workflows/prime-cancellation-verify.yml'
      - '.github/workflows/prime-cancellation-foundation.yml'
      - 'scripts/prime_cancellation_foundation.py'

permissions:
  contents: read

concurrency:
  group: prime-cancellation-staged-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      foundation_cached: ${{ steps.foundation_cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fingerprint the actual baseline dependency sources
        id: plan
        run: |
          set -euo pipefail
          PRIME_FINGERPRINT=$(python scripts/prime_cancellation_foundation.py --fingerprint)
          printf 'fingerprint=%s\n' "$PRIME_FINGERPRINT" >> "$GITHUB_OUTPUT"
      - name: Check for the previously verified dependency prefix
        id: foundation_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-foundation-complete-300-v1-${{ runner.os }}-${{ steps.plan.outputs.fingerprint }}
          lookup-only: true

  foundation_40:
    needs: prepare
    if: needs.prepare.outputs.foundation_cached != 'true'
    uses: ./.github/workflows/prime-cancellation-foundation.yml
    with:
      lower: 0
      upper: 40

  foundation_100:
    needs: [prepare, foundation_40]
    if: needs.prepare.outputs.foundation_cached != 'true'
    uses: ./.github/workflows/prime-cancellation-foundation.yml
    with:
      lower: 40
      upper: 100

  foundation_180:
    needs: [prepare, foundation_100]
    if: needs.prepare.outputs.foundation_cached != 'true'
    uses: ./.github/workflows/prime-cancellation-foundation.yml
    with:
      lower: 100
      upper: 180

  foundation_260:
    needs: [prepare, foundation_180]
    if: needs.prepare.outputs.foundation_cached != 'true'
    uses: ./.github/workflows/prime-cancellation-foundation.yml
    with:
      lower: 180
      upper: 260

  foundation_300:
    needs: [prepare, foundation_260]
    if: needs.prepare.outputs.foundation_cached != 'true'
    uses: ./.github/workflows/prime-cancellation-foundation.yml
    with:
      lower: 260
      upper: 300

  proofs:
    needs: [prepare, foundation_300]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.foundation_cached == 'true' || needs.foundation_300.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reserve disk space for the complete Lean artifacts
        run: |
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift
          df -h /
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore project compilation cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-cancellation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            prime-cancellation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore the complete dependency prefix
        if: needs.prepare.outputs.foundation_cached == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-foundation-complete-300-v1-${{ runner.os }}-${{ needs.prepare.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Download the newly verified dependency groups
        if: needs.prepare.outputs.foundation_cached != 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: prime-foundation-*
          path: prime-foundation-downloads
      - name: Merge complete native artifact groups
        if: needs.prepare.outputs.foundation_cached != 'true'
        run: python scripts/prime_cancellation_foundation.py --restore prime-foundation-downloads
      - name: Preserve the complete dependency prefix
        if: needs.prepare.outputs.foundation_cached != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-foundation-complete-300-v1-${{ runner.os }}-${{ needs.prepare.outputs.fingerprint }}
      - name: Compile the actual Hecke and moment wiring
        run: |
          set -euo pipefail
          mkdir -p prime-verification
          lean --version | tee prime-verification/environment.log
          nproc >> prime-verification/environment.log
          lake --fail-fast build +HeckeSkeleton.PrimeCancellationWiring:olean 2>&1 | tee prime-verification/build.log
      - name: Audit exported theorem dependencies
        run: |
          set -euo pipefail
          lake env lean HeckeSkeleton/PrimeCancellationAudit.lean 2>&1 | tee prime-verification/axioms.log
      - name: Stop cancelled compiler processes before caching
        if: cancelled()
        run: |
          pkill -TERM -x lake || true
          pkill -TERM -x lean || true
          for PRIME_POLL in {1..10}; do
            if ! pgrep -x lake > /dev/null && ! pgrep -x lean > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          pkill -KILL -x lake || true
          pkill -KILL -x lean || true
      - name: Save checked project artifacts for the next revision
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            vendor/class-field-theory/.lake/build
          key: prime-cancellation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: prime-cancellation-verification
          path: prime-verification/
          if-no-files-found: ignore
