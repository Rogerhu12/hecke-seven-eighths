name: Canonical inverse single step

on:
  pull_request:
    branches: [dtests-handoff]
    paths:
      - HeckeSkeleton/Moments/MOM_INV_STEP/**
      - .github/workflows/mom-inv-step.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-inv-step-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned Lean and Mathlib environment
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build the single-step modules with Lake and check recursive axioms
        run: python3 -u HeckeSkeleton/Moments/MOM_INV_STEP/verify.py
      - name: Upload compiler logs, environment and axiom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-inv-step-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/mom-inv-step-verification/
          if-no-files-found: error
          retention-days: 14
