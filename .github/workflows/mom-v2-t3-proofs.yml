name: MOM V2 T3 proof closure
on:
  pull_request:
    branches: [dtests-handoff]
    paths:
      - 'HeckeSkeleton/Moments/MOM_ENGINE_STEP_V2/**'
      - '.github/v2/**'
      - '.github/workflows/mom-v2-t3-proofs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-v2-t3-proofs-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  t3-proofs:
    if: github.head_ref == 'cloud/mom-v2-t3a-t3b' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reserve runner space and configure memory mappings
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build T3 closure and recursively audit every loaded V2 declaration
        run: python3 -u .github/v2/t3_build.py
      - name: Upload T3 proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-v2-t3-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          path: t3-build/
          retention-days: 14
