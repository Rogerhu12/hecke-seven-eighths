name: A2 DirectParent restored instances normal build and fresh audit

on:
  push:
    branches: [cloud/mom-engine-step-a2-direct-parent-restored-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-direct-parent-restored-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original_root:
    name: Normal ${{ matrix.root }}
    strategy:
      fail-fast: false
      matrix:
        root: [DirectParentLeaves]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      ROOT_MODULE: ${{ matrix.root }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-direct-parent-restored-native
          git show --no-patch --format=fuller HEAD > a2-direct-parent-restored-native/checkout.txt
          cat > a2-direct-parent-restored-native/provenance.py <<'PY'
