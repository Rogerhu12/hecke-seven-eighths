      - name: Provide enough memory mappings for the full legacy import closure
        run: |
          MOM_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$MOM_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > a2-direct-parent-restored-native/memory-mapping.txt
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build this original root's import closure separately
        id: dependencies
        run: |
          python3 -u a2-direct-parent-restored-native/run.py dependencies 1200 \
            lake build "+HeckeSkeleton.Moments.MOM_ENGINE_STEP.${ROOT_MODULE}:deps"
      - name: Compile DirectParentLeaves and freshly audit every loaded task declaration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.root == 'DirectParentLeaves' }}
        run: |
          python3 -u a2-direct-parent-restored-native/run.py verification 1200 \
            python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py \
            HeckeSkeleton.Moments.MOM_ENGINE_STEP.DirectParentLeaves \
            --namespace HeckeSkeleton.Moments.EngineStep \
            --declaration HeckeSkeleton.Moments.EngineStep.ActualDirectFirstSource.SecondStages.finiteCost_eq_budgets_leaves \
            --declaration HeckeSkeleton.Moments.EngineStep.actual_parent_direct_two_stage_finite_leaf_bound \
            --evidence a2-direct-parent-restored-native/verify
      - name: Check all tracked sources and configuration again
        if: always()
        run: python3 a2-direct-parent-restored-native/provenance.py after
      - name: Preserve original compiler logs, timings, source hashes and fresh axiom audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-direct-parent-restored-native-${{ matrix.root }}-${{ github.sha }}-${{ github.run_attempt }}
          path: a2-direct-parent-restored-native/
          if-no-files-found: error
          retention-days: 14
