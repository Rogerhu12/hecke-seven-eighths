name: V2 slow-declaration probes

# Coordinator diagnosis only (branch diag/v2-kernel, never merged). For each
# slow declaration, elaborate three copies: kernel check skipped, a small
# heartbeat budget with diagnostics, and the signature with a sorry body.
on:
  push:
    branches: [diag/v2-kernel]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [R, O]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reserve runner space and configure memory mappings
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
        with:
          branch-cache: restore
      - name: Build the imports of the probed module
        run: |
          D=HeckeSkeleton/Moments/MOM_ENGINE_STEP_V2
          f=$([ "${{ matrix.side }}" = R ] && echo RawContracts || echo OrdinaryData)
          lake build $(sed -n 's/^import \(HeckeSkeleton\.[^ ]*\)$/+\1:olean/p' $D/$f.lean) 2>&1 | tail -5; test ${PIPESTATUS[0]} -eq 0
      - name: Install gdb for stack samples
        run: sudo apt-get install -y -qq gdb > /dev/null
      - name: Elaborate the probes one at a time, sampling stacks
        run: |
          mkdir -p kdiag-out
          for v in orig curried nolint; do
            [ -f .github/kdiag/${{ matrix.side }}_$v.lean ] || continue
            n=${{ matrix.side }}_$v
            echo "===== $n"
            start=$(date +%s)
            lake env lean -DstderrAsMessages=false .github/kdiag/$n.lean > kdiag-out/$n.log 2>&1 &
            wrapper=$!
            for t in 100 160 220; do
              while [ $(( $(date +%s) - start )) -lt $t ] && kill -0 $wrapper 2>/dev/null; do sleep 2; done
              kill -0 $wrapper 2>/dev/null || break
              pid=$(pgrep -n -x lean || true)
              [ -n "$pid" ] || continue
              echo "--- KDIAG_STACK $n at ${t}s pid $pid rss $(( $(ps -o rss= -p $pid) / 1024 ))MiB"
              sudo gdb -p $pid -batch -ex "set pagination off" -ex "thread apply all bt 60" 2>/dev/null                 | grep -E '^#|^Thread' | sed -E 's/ \(.*\) at / at /; s/0x[0-9a-f]+ in //' | cut -c1-200                 > kdiag-out/$n.stack.$t.txt
              grep -B1 -A45 -E 'Thread 1 ' kdiag-out/$n.stack.$t.txt | head -50
              grep -c '^#' kdiag-out/$n.stack.$t.txt | sed 's/^/frames total: /'
            done
            if kill -0 $wrapper 2>/dev/null; then pkill -KILL -x lean; code=killed; else wait $wrapper; code=$?; fi
            echo "KDIAG_RESULT $n exit=$code seconds=$(( $(date +%s) - start ))"
            head -c 4000 kdiag-out/$n.log
          done
      - name: Upload the probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-kdiag-${{ matrix.side }}-${{ github.run_id }}
          path: kdiag-out/
          retention-days: 14
