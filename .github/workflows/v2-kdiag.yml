name: V2 slow-declaration probes

# Coordinator diagnosis only (branch diag/v2-kernel, never merged). One job per
# probe file: elaborate it with a time limit; if it is still running at the
# limit, take a complete gdb stack and list the distinct Lean functions on it.
on:
  push:
    branches: [diag/v2-kernel]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        probe: [r1_namedFibers, o1_rflK, o2_rflHole]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reserve runner space and configure memory mappings
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sudo apt-get install -y -qq gdb > /dev/null
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
        with:
          branch-cache: restore
      - name: Build the imports of the probe
        run: |
          lake build $(sed -n 's/^import \(HeckeSkeleton\.[^ ]*\)$/+\1:olean/p' .github/kdiag/${{ matrix.probe }}.lean) 2>&1 | tail -3; test ${PIPESTATUS[0]} -eq 0
      - name: Elaborate the probe
        run: |
          mkdir -p kdiag-out
          n=${{ matrix.probe }}
          limit=150
          start=$(date +%s)
          lake env lean -DstderrAsMessages=false .github/kdiag/$n.lean > kdiag-out/$n.log 2>&1 &
          wrapper=$!
          while [ $(( $(date +%s) - start )) -lt $limit ] && kill -0 $wrapper 2>/dev/null; do sleep 2; done
          if kill -0 $wrapper 2>/dev/null; then
            pid=$(pgrep -n -x lean || true)
            sudo gdb -p $pid -batch -ex "set pagination off" -ex "thread apply all bt" 2>/dev/null > kdiag-out/$n.full.txt || true
            echo "--- distinct Lean functions on the busy thread, outermost last"
            awk '/^Thread/{t=$0} {a[t]=a[t] ORS $0} /collectDeps/{busy=t} END{print a[busy]}' kdiag-out/$n.full.txt \
              | sed -E 's/ \(.*$//; s/^#[0-9]+ +(0x[0-9a-f]+ in )?//' | grep -E '^l_|^lean' \
              | awk '!seen[$0]++' | sed -E 's/___redArg|___lam__[0-9]+|___boxed//g' | cut -c1-170 | head -120
            pkill -KILL -x lean; code=killed
          else wait $wrapper; code=$?; fi
          echo "KDIAG_RESULT $n exit=$code seconds=$(( $(date +%s) - start ))"
          grep -v -E 'semireducible|checkpoint' kdiag-out/$n.log | head -c 3000
      - name: Upload the probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-kdiag-${{ matrix.probe }}-${{ github.run_id }}
          path: kdiag-out/
          retention-days: 14
