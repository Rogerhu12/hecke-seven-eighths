name: V2 slow-declaration probes

# Scheme A diagnosis only (branch diag/v2-fix-a, never merged). One job per
# probe file: elaborate it with a time limit; if it is still running at the
# limit, take a complete gdb stack and list the distinct Lean functions on it.
on:
  push:
    branches: [diag/v2-fix-a]

concurrency:
  group: v2-kdiag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        probe: [a13_b3_slots, a14_b3_named_slots]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reserve runner space and configure memory mappings
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
        with:
          branch-cache: 'true'
      - name: Select B's adopted Raw dependency for compatibility probes
        run: |
          cp .github/kdiag/b3_rawleaf_adopted.lean HeckeSkeleton/Moments/MOM_ENGINE_STEP_V2/RawLeafData.lean
          git hash-object HeckeSkeleton/Moments/MOM_ENGINE_STEP_V2/RawLeafData.lean
      - name: Build the imports of the probe
        run: |
          mkdir -p kdiag-out
          lake build $(sed -n 's/^import \(HeckeSkeleton\.[^ ]*\)$/+\1:olean/p' .github/kdiag/${{ matrix.probe }}.lean) 2>&1 | tee kdiag-out/imports.log | tail -20
          test ${PIPESTATUS[0]} -eq 0
      - name: Elaborate the probe
        run: |
          mkdir -p kdiag-out
          n=${{ matrix.probe }}
          limit=100
          start=$(date +%s)
          lake env lean -DstderrAsMessages=false .github/kdiag/$n.lean > kdiag-out/$n.log 2>&1 &
          wrapper=$!
          while [ $(( $(date +%s) - start )) -lt $limit ] && kill -0 $wrapper 2>/dev/null; do sleep 2; done
          elapsed=$(( $(date +%s) - start ))
          if kill -0 $wrapper 2>/dev/null; then
            pid=$(pgrep -n -x lean || true)
            sudo apt-get install -y -qq gdb > /dev/null
            sudo gdb -p $pid -batch -ex "set pagination off" -ex "thread apply all bt" 2>/dev/null > kdiag-out/$n.full.txt || true
            echo "--- distinct Lean functions on the busy thread, outermost last"
            awk '/^Thread/{t=$0} {a[t]=a[t] ORS $0} /collectDeps/{busy=t} END{print a[busy]}' kdiag-out/$n.full.txt \
              | sed -E 's/ \(.*$//; s/^#[0-9]+ +(0x[0-9a-f]+ in )?//' | grep -E '^l_|^lean' \
              | awk '!seen[$0]++' | sed -E 's/___redArg|___lam__[0-9]+|___boxed//g' | cut -c1-170 | sed -n '1,120p' || true
            pkill -KILL -x lean || true
            wait $wrapper || true
            code=124
          else
            if wait $wrapper; then code=0; else code=$?; fi
          fi
          echo "KDIAG_RESULT $n exit=$code seconds=$elapsed" | tee kdiag-out/$n.result.txt
          cat kdiag-out/$n.log
          exit "$code"
      - name: Upload the probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-kdiag-${{ matrix.probe }}-${{ github.run_id }}
          path: kdiag-out/
          retention-days: 14

