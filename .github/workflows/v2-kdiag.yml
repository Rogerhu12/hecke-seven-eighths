name: V2 slow-declaration probes

# Coordinator diagnosis only (branch diag/v2-kernel, never merged). For each
# slow declaration, elaborate three copies: kernel check skipped, a small
# heartbeat budget with diagnostics, and the signature with a sorry body.
on:
  push:
    branches: [diag/v2-kernel]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [R, O]
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reserve runner space and configure memory mappings
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
        with:
          branch-cache: restore
      - name: Build the imports of the probed module
        run: |
          D=HeckeSkeleton/Moments/MOM_ENGINE_STEP_V2
          f=$([ "${{ matrix.side }}" = R ] && echo RawContracts || echo OrdinaryData)
          lake build $(sed -n 's/^import \(HeckeSkeleton\.[^ ]*\)$/+\1:olean/p' $D/$f.lean) 2>&1 | tail -5; test ${PIPESTATUS[0]} -eq 0
      - name: Install gdb for stack samples
        run: sudo apt-get install -y -qq gdb > /dev/null
      - name: Elaborate the probes one at a time
        run: |
          mkdir -p kdiag-out
          for path in .github/kdiag/${{ matrix.side }}_*.lean; do
            n=$(basename $path .lean)
            limit=90; case $n in *_0orig) limit=60;; esac
            echo "===== $n (limit ${limit}s)"
            start=$(date +%s)
            lake env lean -DstderrAsMessages=false $path > kdiag-out/$n.log 2>&1 &
            wrapper=$!
            while [ $(( $(date +%s) - start )) -lt $limit ] && kill -0 $wrapper 2>/dev/null; do sleep 2; done
            if kill -0 $wrapper 2>/dev/null; then
              pid=$(pgrep -n -x lean || true)
              if [ -n "$pid" ]; then
                sudo gdb -p $pid -batch -ex "set pagination off" -ex "thread apply all bt -70" 2>/dev/null > kdiag-out/$n.outer.txt
                echo "--- outer frames of the busy thread"
                awk '/^Thread/{t=$0} /collectDeps/{busy=t} {a[t]=a[t] ORS $0} END{print a[busy]}' kdiag-out/$n.outer.txt                   | sed -E 's/ \(.*\) from .*//; s/^#[0-9]+ +(0x[0-9a-f]+ in )?//' | grep -v -E 'collectDeps|SnapshotTree|^$' | cut -c1-170 | head -70
              fi
              pkill -KILL -x lean; code=killed
            else wait $wrapper; code=$?; fi
            echo "KDIAG_RESULT $n exit=$code seconds=$(( $(date +%s) - start ))"
            grep -v -E 'semireducible|checkpoint' kdiag-out/$n.log | head -c 2500
          done
      - name: Upload the probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-kdiag-${{ matrix.side }}-${{ github.run_id }}
          path: kdiag-out/
          retention-days: 14
