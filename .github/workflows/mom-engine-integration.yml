name: Paired moment engine integration (unconditional)

# Run after the STEP producer is available. This preserves the original strict
# integration/axiom gate; it is not the conditional induction acceptance job.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-integration-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-original-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "4"
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned Lean environment and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Compile all induction and producer integration modules
        shell: bash
        run: |
          set -euo pipefail
          task_dir=HeckeSkeleton/Moments/MOM_ENGINE_INTEGRATION
          proof_logs="$RUNNER_TEMP/mom-engine-integration"
          mkdir -p "$proof_logs"
          python3 "$task_dir/verify.py" preflight --expected-sha "$EXPECTED_SHA" --output "$proof_logs" 2>&1 | tee "$proof_logs/preflight.log"
          mapfile -t targets < "$proof_logs/build-targets.txt"
          timeout --signal=TERM --kill-after=30s 280m lake build "${targets[@]}" 2>&1 | tee "$proof_logs/build.log"
          printf '\nMOM_ENGINE_INTEGRATION_BUILD_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/build.log"
          lake env lean "$proof_logs/IntegrationAudit.lean" 2>&1 | tee "$proof_logs/axioms.log"
          printf '\nMOM_ENGINE_INTEGRATION_AUDIT_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/axioms.log"
          lake env lean "$proof_logs/UpstreamAudit.lean" 2>&1 | tee "$proof_logs/upstream-axioms.log"
          printf '\nMOM_ENGINE_INTEGRATION_UPSTREAM_AUDIT_OK %s\n' "$EXPECTED_SHA" | tee -a "$proof_logs/upstream-axioms.log"
          python3 "$task_dir/verify.py" check --expected-sha "$EXPECTED_SHA" --output "$proof_logs" 2>&1 | tee "$proof_logs/verification.log"
      - name: Enforce the original three unconditional axiom requirements
        shell: bash
        run: |
          set -euo pipefail
          proof_logs="$RUNNER_TEMP/mom-engine-integration"
          python3 HeckeSkeleton/Moments/MOM_ENGINE_INTEGRATION/verify.py original-check --expected-sha "$EXPECTED_SHA" --output "$proof_logs" 2>&1 | tee "$proof_logs/original-targets.log"
      - name: Preserve unconditional integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-engine-integration-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mom-engine-integration/
          if-no-files-found: warn
          retention-days: 14
