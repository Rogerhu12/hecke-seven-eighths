name: MOM_ENGINE_STEP isolated native diagnostics

# Auxiliary timing only. The owner PR keeps its complete Interface,
# fresh namespace axiom audit, and whole-project build unchanged.
on:
  push:
    branches: [cloud/mom-engine-step-a-performance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Instrumented diagnosis ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        target: [ExceptionalOriginalLabel, ActualGaussFiniteLeaves]
    env:
      LEAN_NUM_THREADS: '2'
      PERF_TARGET: ${{ matrix.target }}
      PERF_SOURCE_COMMIT: 7d274396dec526cecf2d9a67dacd70b7535a554f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare runner resources
        run: |
          mkdir -p isolated-native-evidence
          git show --no-patch --format=fuller HEAD > isolated-native-evidence/checkout.txt
          git diff --exit-code "$PERF_SOURCE_COMMIT" HEAD -- '*.lean' lakefile.toml lake-manifest.json lean-toolchain
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > isolated-native-evidence/memory-mapping.txt
          df -h /
      - name: Install the pinned Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore ordinary Lake artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Record exact source and toolchain provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          version = run('lake', 'env', 'lean', '--version')
          mathlib = run('git', '-C', '.lake/packages/mathlib', 'rev-parse', 'HEAD')
          assert '4.35.0-rc3' in version and '470d5ce1400764999581fd26d5d72b00d990b0f4' in version
          assert mathlib == '0493595ecd5da8ef14742febab99728f98e948e8'
          sources = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(pathlib.Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP').glob('*.lean'))}
          assert len(sources) == 1009
          evidence = {'commit': run('git', 'rev-parse', 'HEAD'),
                      'tree': run('git', 'rev-parse', 'HEAD^{tree}'),
                      'source_commit': os.environ['PERF_SOURCE_COMMIT'],
                      'target': os.environ['PERF_TARGET'],
                      'lean': version, 'mathlib': mathlib,
                      'source_sha256': sources,
                      'scope': 'temporary instrumented original-source diagnosis; not original complete-module or task acceptance'}
          pathlib.Path('isolated-native-evidence/environment.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Build the complete unchanged target dependencies
        timeout-minutes: 60
        shell: bash
        run: |
          set -o pipefail
          status=0
          timeout --signal=TERM --kill-after=30s 58m lake build "+HeckeSkeleton.Moments.MOM_ENGINE_STEP.${PERF_TARGET}:deps" 2>&1 |
            tee isolated-native-evidence/dependencies.log || status=$?
          echo "$status" > isolated-native-evidence/dependencies-exit-code.txt
          exit "$status"
      - name: Locate progress inside the unchanged slow declarations
        timeout-minutes: 4
        run: |
          python3 -u - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time
          evidence = pathlib.Path('isolated-native-evidence')
          target = os.environ['PERF_TARGET']
          assert target in {'ExceptionalOriginalLabel', 'ActualGaussFiniteLeaves'}
          source = pathlib.Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP') / (target + '.lean')
          original_bytes = source.read_bytes()
          original = original_bytes.decode()
          expected_source_hashes = {
              'ExceptionalOriginalLabel': 'dcef6c25192de6a24aae34312c0628946e88bc85ee802c2a0ce0a81f519faecb',
              'ActualGaussFiniteLeaves': 'dea70c3b22e89ff2818719b88c60ddeb90368f1da5f1034a23f4f43f316528f1',
          }
          assert hashlib.sha256(original_bytes).hexdigest() == expected_source_hashes[target]
          insertions = []
          def add(position, indent, label, syntax):
              assert position == 0 or original[position - 1] == '\n'
              line = indent + syntax + ' IO.eprintln ' + json.dumps('MOM_TRACE ' + target + ' ' + label) + '\n'
              insertions.append({'offset_characters': position,
                                 'original_line': original[:position].count('\n') + 1,
                                 'label': label, 'text': line})
          def one(marker):
              assert original.count(marker) == 1, (target, marker, original.count(marker))
              return original.index(marker)
          if target == 'ActualGaussFiniteLeaves':
              theorem = 'phase_class_eq_leaf_sum'
              declaration = one('theorem phase_class_eq_leaf_sum ')
              start_comment = one('/-- This is the actual phase multiplication from the first transform,\n')
              stop = one('\nend CoveredClassKey\n')
              original_part = original[:stop]
              closing = '\nend CoveredClassKey\nend ActualGaussStage\nend HeckeSkeleton.Moments.EngineStep\nend\n'
          else:
              theorem = 'exceptional_original_label_from_atoms'
              declaration = one('theorem exceptional_original_label_from_atoms\n')
              start_comment = one('/-- The public source estimate has no per-leaf exceptional inequality\n')
              stop = one('\nend SecondSideFrame\nend HeckeSkeleton.Moments.EngineStep\n')
              original_part = original
              closing = ''
          add(start_comment, '', 'BEFORE_HEADER_' + theorem, 'run_cmd')
          body_start = original.index(' := by\n', declaration) + len(' := by\n')
          assert declaration < body_start < stop
          position = body_start
          for line in original[body_start:stop].splitlines(keepends=True):
              if line.startswith(('  let ', '  have ', '  change ', '  calc', '  exact ')):
                  label = 'BODY_BEFORE_LINE_' + str(original[:position].count('\n') + 1)
                  add(position, '  ', label, 'run_tac')
              elif target == 'ActualGaussFiniteLeaves' and line.startswith(
                      ('    funext ', '    dsimp only ', '    exact phase_mul_four_factors ')):
                  label = 'NESTED_BEFORE_LINE_' + str(original[:position].count('\n') + 1)
                  add(position, '    ', label, 'run_tac')
              position += len(line)
          assert position == stop
          if target == 'ExceptionalOriginalLabel':
              add(stop + 1, '', 'COMMAND_CONTINUED_AFTER_' + theorem, 'run_cmd')
              print_marker = '#print axioms HeckeSkeleton.Moments.EngineStep.SecondSideFrame.exceptional_original_label_from_atoms\n'
              print_start = one(print_marker)
              add(print_start, '', 'BEFORE_PRINT_AXIOMS', 'run_cmd')
              add(print_start + len(print_marker), '', 'COMMAND_CONTINUED_AFTER_PRINT_AXIOMS', 'run_cmd')
          else:
              # Command elaboration can continue before asynchronous proof/kernel work finishes.
              # This marker is only command progress, never proof completion evidence.
              closing = '\nrun_cmd IO.eprintln ' + json.dumps('MOM_TRACE ' + target +
                  ' COMMAND_CONTINUED_AFTER_' + theorem) + '\n' + closing
          contents = original_part
          for insertion in sorted(insertions, key=lambda x: x['offset_characters'], reverse=True):
              position = insertion['offset_characters']
              assert position <= len(original_part)
              contents = contents[:position] + insertion['text'] + contents[position:]
          recovered = contents
          for insertion in insertions:
              assert recovered.count(insertion['text']) == 1
              recovered = recovered.replace(insertion['text'], '', 1)
          assert recovered == original_part
          contents += closing
          basename = 'MomEngineInstrumented_' + target
          diagnostic = pathlib.Path(basename + '.lean')
          diagnostic.write_text(contents)
          (evidence / diagnostic.name).write_text(contents)
          manifest = {'target': target, 'source_sha256': hashlib.sha256(original_bytes).hexdigest(),
                      'diagnostic_sha256': hashlib.sha256(contents.encode()).hexdigest(),
                      'original_prefix_bytes': len(original_part.encode()),
                      'original_file_bytes': len(original_bytes), 'insertions': insertions,
                      'closing_added': closing,
                      'exact_source_recovered_after_removing_instrumentation': True,
                      'scope': 'temporary instrumented source diagnostic, never native acceptance',
                      'note': 'COMMAND_CONTINUED markers do not imply asynchronous proof or kernel completion'}
          (evidence / 'instrumentation.json').write_text(json.dumps(manifest, indent=2) + '\n')
          output = pathlib.Path('/tmp/mom-engine-step-native')
          output.mkdir(exist_ok=True)
          command = ['/usr/bin/time', '-v', 'timeout', '--signal=TERM', '--kill-after=5s', '120s',
                     'lake', 'env', 'lean', '-j2',
                     '-DautoImplicit=false', '-DrelaxedAutoImplicit=false', '-Dprofiler=true',
                     '-DstderrAsMessages=false',
                     '-o', str(output / (basename + '.olean')),
                     '-i', str(output / (basename + '.ilean')), str(diagnostic)]
          started = time.monotonic()
          with (evidence / 'instrumented.log').open('w') as log:
              log.write(json.dumps({'command': command}) + '\n')
              log.flush()
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              assert process.stdout is not None
              for line in process.stdout:
                  print(line, end='', flush=True)
                  log.write(line)
                  log.flush()
              code = process.wait()
          expected = json.loads((evidence / 'environment.json').read_text())['source_sha256']
          unchanged = all(hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest
                          for path, digest in expected.items())
          result = {'target': target, 'exit_code': code, 'elapsed_seconds': time.monotonic() - started,
                    'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                    'diagnostic_sha256': hashlib.sha256(contents.encode()).hexdigest(),
                    'all_task_sources_unchanged': unchanged,
                    'scope': 'instrumented diagnostic only; never original complete-module acceptance',
                    'complete_target_module_compiled': False,
                    'heartbeat_changed': False, 'proof_sources_changed': not unchanged,
                    'diagnostic_stderr_as_messages': False,
                    'instrumentation_removed_matches_original': recovered == original_part}
          (evidence / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result), flush=True)
          if not unchanged:
              raise SystemExit('Original source changed during diagnostic')
          raise SystemExit(code)
          PY
      - name: Preserve exact native timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-instrumented-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: isolated-native-evidence/
          if-no-files-found: error
          retention-days: 14
