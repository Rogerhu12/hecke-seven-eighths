# Generated shadow or frozen owner-only normal workflow; see replacement-manifest.json.
name: MOM_ENGINE_STEP A downstream verification

'on':
  push:
    branches: [cloud/mom-engine-step-a-roots]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a-roots-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  roots:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LEAN_NUM_THREADS: '2'
      A_ROOT_SOURCE_STATE: owner-after-a2-adoption
      A_ROOT_SOURCE_COMMIT: b7861fc79412d5c9bd5725c0058377b89c61da37
      A_ROOT_SOURCE_TREE: d0b757d0b927bce51a419bdd08cb4bbd01e7a2f5
      A_ROOT_ACTUAL_SHA256: cc98c8a2c5c3c3f6c59695935245f463c84e6e7f7c8292b5062e2d1813d94c87
      A_ROOT_VERIFY_SHA256: 1be80b89c66818fa20e680a6850818ed4499ddf2d7d5789a9b63398c3279c148
      A_ROOT_TARGETS: |-
        [
          {
            "target": "OriginalAllocationFingerprint",
            "source_sha256": "30f35dba5d488d40a93fbee78c1eca888aee327a109af235a9320b2c8e2c1e5b",
            "declarations": [
              "HeckeSkeleton.Moments.EngineStep.hybridAllocationFingerprint_injective",
              "HeckeSkeleton.Moments.EngineStep.original_index_fibre_card_eq_class_image"
            ]
          },
          {
            "target": "DirectCoveredStage",
            "source_sha256": "243ed35cc7230b41cd4dbaae596b1332e98da6707253d08ba7de58c4650f8372",
            "declarations": [
              "HeckeSkeleton.Moments.EngineStep.actual_direct_fourier_covered_terminal_bound"
            ]
          },
          {
            "target": "PoolFiniteLeaves",
            "source_sha256": "7fafdf5687b18cf53f9e6f4792e999198a0ab875396376690e1c625f0a718c01",
            "declarations": [
              "HeckeSkeleton.Moments.EngineStep.ActualPoolStages.TerminalCalibration.phase_cost_eq_budgets_leaves",
              "HeckeSkeleton.Moments.EngineStep.ActualPoolStages.TerminalCalibration.integral_phase_cost_eq_budgets_leaves"
            ]
          },
          {
            "target": "GatedGaussStages",
            "source_sha256": "74103e801a3bcb1326d9c9dbf5f7b4238b66e034bba021436ad5d7059faf1d96",
            "declarations": [
              "HeckeSkeleton.Moments.EngineStep.ActualGaussStage.gated",
              "HeckeSkeleton.Moments.EngineStep.ActualGaussStage.gated_leaf_left_nonzero",
              "HeckeSkeleton.Moments.EngineStep.actual_parent_gated_two_stage_covered_terminal_bound"
            ]
          },
          {
            "target": "DualGaussHybridTerminal",
            "source_sha256": "b2be306ecb762e87a7ccd695a3cd870e438d74b7e5eb1cb32396f89bf24f4b06",
            "declarations": [
              "HeckeSkeleton.Moments.EngineStep.ActualGaussStage.DualTerminalCalibration.rawCost_le_coverHybrid",
              "HeckeSkeleton.Moments.EngineStep.ActualGaussStage.DualTerminalCalibration.integral_rawPhaseCost_le_cover",
              "HeckeSkeleton.Moments.EngineStep.ActualGaussStage.DualTerminalCalibration.integral_phase_cost_eq_budgets_leaves",
              "HeckeSkeleton.Moments.EngineStep.actual_gauss_dual_cover_hybrid_terminal_bound",
              "HeckeSkeleton.Moments.EngineStep.actual_gauss_dual_hybrid_terminal_bound"
            ]
          }
        ]
      A_ROOT_EXPECTED_HEAD: ${{ github.sha }}
      A_ROOT_EVIDENCE: mom-engine-step-a-downstream-verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record exact checkout and all tracked file hashes
        run: |
          mkdir -p "$A_ROOT_EVIDENCE"
          git show --no-patch --format=fuller HEAD > "$A_ROOT_EVIDENCE/checkout.txt"
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          evidence = Path(os.environ['A_ROOT_EVIDENCE'])
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['A_ROOT_EXPECTED_HEAD']
          if head != expected:
              raise SystemExit(f'Unexpected checkout: {head}, expected {expected}')
          if os.environ['A_ROOT_SOURCE_STATE'] != 'owner-after-a2-adoption':
              raise SystemExit('Shadow template: freeze the adopted A2 owner commit/tree and Actual hash before publishing')
          source_commit = os.environ['A_ROOT_SOURCE_COMMIT']
          source_tree = subprocess.check_output(['git', 'rev-parse', source_commit+'^{tree}'], text=True).strip()
          if source_tree != os.environ['A_ROOT_SOURCE_TREE']:
              raise SystemExit('Owner source tree differs from the frozen reviewed tree')
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^1'], text=True).strip()
          if parent != source_commit:
              raise SystemExit('Auxiliary first parent must be the exact frozen owner source')
          changes = subprocess.check_output(['git', 'diff', '--name-only', source_commit, 'HEAD'], text=True).splitlines()
          if changes != ['.github/workflows/mom-engine-step-a-roots.yml']:
              raise SystemExit('Auxiliary delta must contain only its own workflow')
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if p}
          (evidence / 'tracked-sha256-before.json').write_text(json.dumps(hashes, indent=2) + '\n')
          targets = json.loads(os.environ['A_ROOT_TARGETS'])
          expected_targets = ['OriginalAllocationFingerprint', 'DirectCoveredStage', 'PoolFiniteLeaves',
                              'GatedGaussStages', 'DualGaussHybridTerminal']
          if [item['target'] for item in targets] != expected_targets:
              raise SystemExit('All five original A downstream targets must be present exactly once')
          original_prints = []
          for item in targets:
              source = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' + item['target'] + '.lean'
              if hashes[source] != item['source_sha256']:
                  raise SystemExit('Downstream source hash differs from the frozen owner file: ' + source)
              declarations = re.findall(r'^#print axioms ([^\n]+)$', Path(source).read_text(), flags=re.M)
              if declarations != item['declarations']:
                  raise SystemExit('Explicit fresh audit targets must match every original print command: ' + source)
              original_prints.extend(declarations)
          if len(original_prints) != 13 or len(set(original_prints)) != 13:
              raise SystemExit('All thirteen distinct original print commands must remain explicit')
          actual = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualGaussFiniteLeaves.lean'
          if hashes[actual] != os.environ['A_ROOT_ACTUAL_SHA256']:
              raise SystemExit('Actual source differs from the explicitly adopted A2 source')
          verify = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py'
          if hashes[verify] != os.environ['A_ROOT_VERIFY_SHA256']:
              raise SystemExit('The original normal verifier changed')
          step_paths = [p for p in hashes if p.startswith('HeckeSkeleton/Moments/MOM_ENGINE_STEP/') and p.endswith('.lean')]
          if len(step_paths) != 1009:
              raise SystemExit('The complete STEP source inventory must remain intact')
          (evidence / 'source.json').write_text(json.dumps({
              'head': head, 'source_commit': source_commit, 'source_tree': source_tree,
              'source_state': os.environ['A_ROOT_SOURCE_STATE'], 'targets': targets,
              'actual_source': actual, 'actual_source_sha256': hashes[actual],
              'verify_source_sha256': hashes[verify], 'original_print_axioms': original_prints,
              'tracked_file_count': len(hashes),
          }, indent=2) + '\n')
          PY
      - name: Provide enough memory mappings for the full import closure
        run: |
          A_ROOT_MAP_LIMIT=$(sysctl -n vm.max_map_count)
          if [ "$A_ROOT_MAP_LIMIT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          sysctl vm.max_map_count > "$A_ROOT_EVIDENCE/memory-mapping.txt"
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@b7861fc79412d5c9bd5725c0058377b89c61da37
      - name: Verify the pinned compiler, Mathlib and unchanged default build settings
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tomllib
          evidence = pathlib.Path(os.environ['A_ROOT_EVIDENCE'])
          version = subprocess.check_output(['lake', 'env', 'lean', '--version'], text=True).strip()
          mathlib = subprocess.check_output(['git', '-C', '.lake/packages/mathlib', 'rev-parse', 'HEAD'], text=True).strip()
          project = tomllib.loads(pathlib.Path('lakefile.toml').read_text())
          assert '4.35.0-rc3' in version and '470d5ce1400764999581fd26d5d72b00d990b0f4' in version
          assert mathlib == '0493595ecd5da8ef14742febab99728f98e948e8'
          assert project.get('leanOptions') == {'autoImplicit': False, 'relaxedAutoImplicit': False}
          assert project.get('weakLeanArgs') == ['-j2']
          assert len(project['lean_lib']) == 20
          (evidence / 'toolchain-and-options.json').write_text(json.dumps({
              'lean': version, 'mathlib': mathlib, 'lean_options': project['leanOptions'],
              'weak_lean_args': project['weakLeanArgs'], 'lean_lib_count': len(project['lean_lib']),
          }, indent=2) + '\n')
          PY
      - name: Build all five complete modules once and run a fresh namespace axiom audit
        shell: bash
        run: |
          mapfile -t A_ROOT_ARGUMENTS < <(python3 - <<'PY'
          import json, os
          targets = json.loads(os.environ['A_ROOT_TARGETS'])
          arguments = ['HeckeSkeleton.Moments.MOM_ENGINE_STEP.' + item['target'] for item in targets]
          arguments += ['--namespace', 'HeckeSkeleton.Moments.EngineStep',
                        '--evidence', os.environ['A_ROOT_EVIDENCE']]
          for item in targets:
              for declaration in item['declarations']:
                  arguments += ['--declaration', declaration]
          print('\n'.join(arguments))
          PY
          )
          A_ROOT_COMMAND=(python3 -u HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py "${A_ROOT_ARGUMENTS[@]}")
          A_ROOT_STARTED=$(date +%s)
          set +e
          timeout --signal=TERM --kill-after=30s 35m "${A_ROOT_COMMAND[@]}" 2>&1 |
            tee "$A_ROOT_EVIDENCE/verification.log"
          A_ROOT_STATUS=${PIPESTATUS[0]}
          set -e
          A_ROOT_FINISHED=$(date +%s)
          printf '{"exit_code": %s, "elapsed_seconds": %s, "timeout_seconds": 2100}\n' \
            "$A_ROOT_STATUS" "$((A_ROOT_FINISHED - A_ROOT_STARTED))" \
            > "$A_ROOT_EVIDENCE/verification-status.json"
          exit "$A_ROOT_STATUS"
      - name: Preserve and compare tracked file hashes after every outcome
        if: always()
        run: |
          mkdir -p "$A_ROOT_EVIDENCE"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          evidence = Path(os.environ['A_ROOT_EVIDENCE'])
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
                    if Path(p).is_file() else None for p in paths if p}
          (evidence / 'tracked-sha256-after.json').write_text(json.dumps(hashes, indent=2) + '\n')
          before = evidence / 'tracked-sha256-before.json'
          if not before.is_file():
              raise SystemExit('The pre-verification source snapshot is missing')
          original = json.loads(before.read_text())
          changed = sorted(p for p in original.keys() | hashes.keys() if original.get(p) != hashes.get(p))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          unchanged = not changed and head == os.environ['A_ROOT_EXPECTED_HEAD']
          (evidence / 'source-identity.json').write_text(json.dumps({
              'head': head, 'unchanged': unchanged, 'changed_files': changed,
          }, indent=2) + '\n')
          if not unchanged:
              raise SystemExit('Tracked sources or checkout identity changed during verification')
          PY
      - name: Preserve complete compiler logs and fresh axiom reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-engine-step-a-downstream-five-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.A_ROOT_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
