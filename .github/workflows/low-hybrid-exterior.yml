name: Exterior mixed-energy verification

on:
  push:
    branches: [codex/wire-low-hybrid-20261031]
  pull_request:
    paths:
      - 'HeckeSkeleton/LowHybrid/Exterior*.lean'
      - 'HeckeSkeleton/LowFrozenCube/Exterior*.lean'
      - 'HeckeSkeleton/LowHybridExterior*.lean'
      - 'scripts/verify_low_hybrid_exterior.py'
      - '.github/workflows/low-hybrid-exterior.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: low-hybrid-exterior-${{ github.event_name == 'push' && github.ref || github.head_ref }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
      WIRE_BUILD_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore validated project objects
        id: project-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: low-hybrid-exterior-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            low-hybrid-exterior-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-
            low-hybrid-exterior-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Find a verified push checkpoint after a PR cache miss
        id: push-checkpoint
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.project-cache.outputs.cache-matched-key == ''
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          head = os.environ["PR_HEAD_SHA"]
          branch = os.environ["PR_HEAD_BRANCH"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}

          def get(path, **query):
              url = os.environ["GITHUB_API_URL"] + path + "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          deadline = time.monotonic() + 20 * 60
          selected = None
          while time.monotonic() < deadline and selected is None:
              try:
                  runs = get(f"/repos/{repo}/actions/workflows/low-hybrid-exterior.yml/runs",
                             event="push", head_sha=head, branch=branch, per_page=100)
                  for run in runs.get("workflow_runs", []):
                      if time.monotonic() >= deadline:
                          break
                      if (run.get("event") != "push" or run.get("head_sha") != head
                          or run.get("head_branch") != branch
                          or (run.get("head_repository") or {}).get("full_name") != repo
                          or run.get("status") != "completed" or run.get("conclusion") != "success"):
                          continue
                      name = f"low-hybrid-project-build-{head}-{run['run_attempt']}"
                      artifacts = get(f"/repos/{repo}/actions/runs/{run['id']}/artifacts",
                                      name=name, per_page=100)
                      matches = [a for a in artifacts.get("artifacts", [])
                                 if a.get("name") == name and not a.get("expired", True)]
                      if len(matches) == 1:
                          selected = (run["id"], name, matches[0]["id"])
                          break
              except urllib.error.HTTPError as error:
                  print(f"::notice::Push checkpoint lookup returned HTTP {error.code}.")
                  if error.code in (401, 403):
                      break
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError):
                  print("::notice::Push checkpoint lookup temporarily unavailable; retrying within the deadline.")
              if selected is None:
                  time.sleep(min(20, max(0, deadline - time.monotonic())))
          if selected is None:
              print("::notice::No successful push checkpoint is available; original complete source verification follows.")
          else:
              run_id, name, artifact_id = selected
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"run_id={run_id}\nartifact_name={name}\n")
              print(f"Using verified push run {run_id}, artifact {artifact_id}; all source and object checks still follow.")
          PY
      - name: Download the verified push checkpoint
        id: checkpoint-download
        if: steps.push-checkpoint.outputs.run_id != ''
        # This transport is optional; the two proof steps below remain mandatory.
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.push-checkpoint.outputs.artifact_name }}
          run-id: ${{ steps.push-checkpoint.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/low-hybrid-push-checkpoint
      - name: Install the checkpoint for normal source and object verification
        if: steps.push-checkpoint.outputs.run_id != ''
        env:
          CHECKPOINT_DOWNLOAD: ${{ steps.checkpoint-download.outcome }}
        run: |
          if [ "$CHECKPOINT_DOWNLOAD" = success ]; then
            tar --zstd -xf "$RUNNER_TEMP/low-hybrid-push-checkpoint/low-hybrid-project-build.tar.zst" .lake/build
          else
            echo "::notice::Push checkpoint download failed; original complete source verification follows."
          fi
      - name: Compile arithmetic, symbols and literal reflected coefficients
        run: python3 -u scripts/verify_low_hybrid_exterior.py HeckeSkeleton.LowFrozenCube.ExteriorCoefficientBounds
      - name: Compile both sieve providers and audit every new declaration
        timeout-minutes: 300
        run: python3 -u scripts/verify_low_hybrid_exterior.py
      - name: Archive the successfully verified project objects
        if: github.event_name == 'push' && success()
        run: tar --zstd -cf "$RUNNER_TEMP/low-hybrid-project-build.tar.zst" .lake/build
      - name: Share the verified project checkpoint with PR verification
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: low-hybrid-project-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/low-hybrid-project-build.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Save successfully compiled objects
        if: ${{ !cancelled() }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: low-hybrid-exterior-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-final
      - name: Preserve complete verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-hybrid-exterior-verification
          path: wire-low-hybrid-verification/
          if-no-files-found: error
