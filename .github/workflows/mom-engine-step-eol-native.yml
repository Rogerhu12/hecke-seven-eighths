    - name: Upload diagnostic-only stack and provenance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stack-diagnostic-ExceptionalOriginalLabel-${{ github.sha }}-${{ github.run_attempt }}
        path: isolated-native-evidence/
        if-no-files-found: error
        retention-days: 14
