name: Low reflected energy verification

on:
  push:
    branches: [codex/low-reflected-energy-ade19eee]
  pull_request:
    paths:
      - 'HeckeSkeleton/LowEnergy/**'
      - 'HeckeSkeleton/LowFrozenCube/**'
      - 'HeckeSkeleton/Principal.lean'
      - 'scripts/low_energy_verify.py'
      - 'scripts/lean_imports.py'
      - 'docs/low-energy/**'
      - '.github/workflows/low-energy-verify.yml'

permissions:
  contents: read

concurrency:
  group: low-energy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  proofs:
    strategy:
      fail-fast: false
      matrix:
        phase: [core, actual]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore exact verified module cache
        id: proof-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build/lib/lean
            .low-energy-verification
          key: low-energy-v2-${{ runner.os }}-${{ matrix.phase }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            low-energy-v2-${{ runner.os }}-${{ matrix.phase }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Compile real sources and preserve axiom output
        run: python3 scripts/low_energy_verify.py ${{ matrix.phase }}
      - name: Save verified module checkpoints
        if: always() && steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build/lib/lean
            .low-energy-verification
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-energy-verification-${{ matrix.phase }}
          path: .low-energy-verification/
          if-no-files-found: ignore
          include-hidden-files: true
