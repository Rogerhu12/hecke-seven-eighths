name: Low reflected energy verification

on:
  push:
    branches:
      - codex/low-reflected-energy-ade19eee
  workflow_dispatch:
  pull_request:
    paths:
      - HeckeSkeleton/LowEnergy/**
      - HeckeSkeleton/LowFrozenCube/**
      - HeckeSkeleton/Principal.lean
      - Expansion/PhysicalFourierNormalization.lean
      - HeckeGeneral/Analysis/PhysicalProbePrincipal.lean
      - HeckeGeneral/Analysis/PhysicalProbeContours.lean
      - HeckeGeneral/Analysis/CompensatedRowKernelFactorization.lean
      - HeckeAxiom/ProbeNormalization.lean
      - scripts/low_energy_lake_verify.py
      - scripts/low_energy_diagnostic_bundle.py
      - scripts/low_energy_axioms.py
      - scripts/lean_imports.py
      - tests/test_low_energy_lake_verify.py
      - tests/test_low_energy_axioms.py
      - docs/low-energy/**
      - .github/workflows/low-energy-verify.yml
      - lean-toolchain
      - lakefile.toml
      - lake-manifest.json

permissions:
  contents: read

concurrency:
  group: low-energy-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '2'
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check build and axiom verification gates
        run: >-
          python3 -m unittest discover -s tests -p 'test_low_energy_lake_verify.py'
      - name: Record exact sources and reject new-source admissions
        run: python3 scripts/low_energy_lake_verify.py prepare --expected-head "$EXPECTED_SOURCE_HEAD"
      - name: Prepare runner space and memory-map capacity
        run: |
          sudo rm -rf -- /usr/local/lib/android/sdk /usr/share/dotnet
          lean_map_limit="$(sysctl -n vm.max_map_count)"
          if [ "$lean_map_limit" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          df -h /
      - name: Install the pinned Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore the pinned native dependency release
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@5f3c782680be2c74365b4d8e5760fc16f1f222c5
        with:
          repository: Rogerhu12/hecke-seven-eighths
          tag: lake-cache-76c696e
      - name: Build every new proof source and run the strict target audits
        id: native_build
        timeout-minutes: 155
        run: >-
          python3 scripts/low_energy_lake_verify.py verify
          --expected-head "$EXPECTED_SOURCE_HEAD"
          --cache-metadata-dir "$RUNNER_TEMP/lake-cache-download"
      - name: Diagnose the complete source chain after a failed native build
        if: failure() && steps.native_build.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import time

          evidence = Path('.low-energy-lake-verification')
          destination = evidence / 'diagnostics'
          destination.mkdir(parents=True, exist_ok=True)
          result = {
              'scope': 'Source diagnostics only; the ordinary native build and axiom gates remain authoritative.',
              'expected_head': os.environ['EXPECTED_SOURCE_HEAD'],
              'compiler_outputs_requested': [],
          }

          def finish(status, code=0):
              result['status'] = status
              (destination / 'run.json').write_text(json.dumps(result, indent=2) + '\n')
              print(json.dumps(result, indent=2))
              raise SystemExit(code)

          report_path = evidence / 'report.json'
          report = json.loads(report_path.read_text()) if report_path.is_file() else {}
          primary_exit = report.get('lake_build', {}).get('exit_code')
          result['ordinary_lake_exit_code'] = primary_exit
          if primary_exit is None:
              finish('unavailable: ordinary native build did not produce a result')
          if primary_exit == 0:
              finish('skipped: ordinary native build succeeded; inspect the strict axiom gate instead')

          prefix = subprocess.check_output(['lean', '--print-prefix'], text=True).strip()
          generation = [
              'lake', 'env', 'python3', 'scripts/low_energy_diagnostic_bundle.py',
              '--repo-root', str(Path.cwd()), '--output-dir', str(destination),
              '--lean-source-root', str(Path(prefix) / 'src/lean'),
              '--expected-head', os.environ['EXPECTED_SOURCE_HEAD'],
              '--check-native-imports', '--include-terminal',
          ]
          with (destination / 'generation.log').open('w') as stream:
              generated = subprocess.run(generation, stdout=stream, stderr=subprocess.STDOUT)
          result['generation_exit_code'] = generated.returncode
          if generated.returncode != 0:
              print((destination / 'generation.log').read_text())
              finish('unavailable: source, head, import closure or native dependency check failed', 1)

          unit = destination / 'GeneralNativeDiagnostic.lean'
          command = ['lake', 'env', 'lean', '-j2', '-DautoImplicit=false',
                     '-DrelaxedAutoImplicit=false', '-DElab.async=false', str(unit)]
          result['command'] = command
          result['bundle_sha256'] = hashlib.sha256(unit.read_bytes()).hexdigest()
          started = time.monotonic()
          result['timed_out'] = False
          log_path = destination / 'native-lean.log'
          with log_path.open('wb') as stream:
              process = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT,
                                         start_new_session=True)
              try:
                  code = process.wait(timeout=600)
              except subprocess.TimeoutExpired:
                  result['timed_out'] = True
                  os.killpg(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  code = 124
          result.update(native_exit_code=code, seconds=round(time.monotonic() - started, 3),
                        log_sha256=hashlib.sha256(log_path.read_bytes()).hexdigest())
          mapping = json.loads((destination / 'GeneralNativeDiagnostic.map.json').read_text())
          raw = log_path.read_text(errors='replace')
          headers = list(re.finditer(
              r'(?m)^.*GeneralNativeDiagnostic\.lean:(\d+):(\d+): (error|warning|info)(?:\([^\n)]*\))?: (.*)$', raw))
          errors = []
          for index, match in enumerate(headers):
              if match.group(3) != 'error':
                  continue
              line, column = int(match.group(1)), int(match.group(2))
              source = next((entry for entry in mapping
                             if entry['first_diagnostic_line'] <= line <= entry['last_diagnostic_line']), None)
              end = headers[index + 1].start() if index + 1 < len(headers) else len(raw)
              error = {'diagnostic_line': line, 'column': column,
                       'message': match.group(4) + raw[match.end():end]}
              if source is not None:
                  error.update(source_path=source['source_path'],
                               source_line=line - source['first_diagnostic_line'] + source['source_line_offset'] + 1,
                               source_sha256=source['sha256'])
              errors.append(error)
          (destination / 'mapped-errors.json').write_text(json.dumps(errors, indent=2) + '\n')
          result['mapped_error_count'] = len(errors)
          print(raw)
          finish('diagnostic command finished', 1 if code else 0)
          PY
      - name: Preserve native Lake evidence and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: low-energy-native-lake-${{ github.run_id }}-${{ github.run_attempt }}
          path: .low-energy-lake-verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Collect native build outputs for diagnosis
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          log = root / '.low-energy-lake-verification/lake-build.log'
          raw_log = log.read_bytes() if log.is_file() else b''
          built = set(re.findall(
              r'(?m)^[^\r\n]*\[\d+/\d+\]\s+Built\s+([A-Za-z_][A-Za-z0-9_.]*)\s+\(',
              raw_log.decode('utf-8', errors='replace')))
          normalization = {
              'Expansion.PhysicalFourierNormalization',
              'HeckeGeneral.Analysis.PhysicalProbePrincipal',
              'HeckeGeneral.Analysis.PhysicalProbeContours',
              'HeckeGeneral.Analysis.CompensatedRowKernelFactorization',
              'HeckeAxiom.ProbeNormalization',
          }
          native = root / '.lake/build/lib/lean'
          destination = root / '.low-energy-native-outputs'
          if destination.is_symlink():
              raise RuntimeError('The diagnostic output directory must be local.')
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir()
          source_roots = [root, *(root / p for p in (
              'SkeletonInputs', 'GramCoreInputs', 'GramAssemblyInputs',
              'PrimeCancellation', 'vendor/openai', 'vendor/flt',
              'vendor/zeta23', 'vendor/tauceti'))]
          entries = []
          unresolved_sources = []
          for module in sorted(built):
              relative = Path(*module.split('.'))
              candidates = [p / relative.with_suffix('.lean') for p in source_roots]
              sources = [p for p in candidates if p.is_file()]
              source = sources[0] if len(sources) == 1 else None
              if source is None:
                  unresolved_sources.append(module)
                  continue
              for suffix in ('.olean', '.olean.private', '.olean.server', '.ir', '.ir.sig'):
                  path = native / (str(relative) + suffix)
                  if not path.is_file():
                      continue
                  target = destination / path.relative_to(native)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, target)
                  entries.append({
                      'module': module, 'path': str(target.relative_to(destination)),
                      'bytes': target.stat().st_size,
                      'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                      'built_event': module in built,
                      'source': str(source.relative_to(root)),
                      'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                  })
          manifest = {
              'scope': 'Diagnostic outputs; not a CI restore cache or acceptance evidence.',
              'head': os.environ['EXPECTED_SOURCE_HEAD'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'build_log_sha256': hashlib.sha256(raw_log).hexdigest(),
              'selection': 'Native Built events with an exact project source path.',
              'normalization_without_built_event': sorted(normalization - built),
              'unresolved_source_modules': sorted(unresolved_sources),
              'files': entries,
          }
          (destination / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(f'Collected {len(entries)} native output files from '
                f'{len({entry["module"] for entry in entries})} modules for diagnosis.')
          PY
      - name: Preserve native proof outputs for diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: low-energy-native-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .low-energy-native-outputs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
