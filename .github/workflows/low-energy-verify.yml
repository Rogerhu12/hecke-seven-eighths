name: Low reflected energy verification

on:
  push:
    branches: [codex/low-reflected-energy-ade19eee]
  workflow_dispatch:
    inputs:
      export_replay:
        description: Export the pinned compiler and libraries for local replay
        type: boolean
        default: false
  pull_request:
    paths:
      - 'HeckeSkeleton/LowEnergy/**'
      - 'HeckeSkeleton/LowFrozenCube/**'
      - 'HeckeSkeleton/Principal.lean'
      - 'scripts/low_energy_verify.py'
      - 'scripts/low_energy_native_foundation.py'
      - 'scripts/low_energy_axioms.py'
      - 'tests/test_low_energy_axioms.py'
      - 'tests/test_low_energy_scheduler.py'
      - 'tests/test_low_energy_native_receipts.py'
      - 'tests/test_low_energy_native_foundation.py'
      - 'scripts/low_energy_restore_ci.py'
      - 'scripts/low_energy_export_ci.py'
      - 'scripts/lean_imports.py'
      - 'docs/low-energy/**'
      - '.github/workflows/low-energy-verify.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: low-energy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  proofs:
    strategy:
      fail-fast: false
      matrix:
        phase: [core, actual]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Audit the published proof source; integration follows an explicit base merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check verification gates and cache scheduling
        if: matrix.phase == 'core'
        run: python3 -m unittest discover -s tests -p 'test_low_energy_*.py'
      - uses: leanprover/lean-action@bd5cb0b830eda614ce3fc186d8429b9409b16c47
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Export pinned compiler, library, and tracked-source replay
        if: matrix.phase == 'actual' && github.event_name == 'workflow_dispatch' && inputs.export_replay
        continue-on-error: true
        run: python3 scripts/low_energy_export_ci.py
      - name: Preserve local replay environment
        if: matrix.phase == 'actual' && github.event_name == 'workflow_dispatch' && inputs.export_replay
        uses: actions/upload-artifact@v4
        with:
          name: low-energy-replay
          path: .low-energy-replay/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
      - name: Restore exact verified module cache
        id: proof-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build/lib/lean
            .low-energy-verification
            .lake/packages/TauCeti/.lake/build
          key: low-energy-v2-${{ runner.os }}-${{ matrix.phase }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            low-energy-v2-${{ runner.os }}-${{ matrix.phase }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore previous workflow checkpoint after a cache miss
        if: steps.proof-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/low_energy_restore_ci.py ${{ matrix.phase }}
      - name: Build pinned package dependencies required by the integration target
        if: matrix.phase == 'actual'
        run: >-
          lake --fail-fast build
          +Mathlib.Basic.Real.Sign:olean
          +Mathlib.Analysis.SpecialFunctions.Gaussian.PoissonSummation:olean
          +Mathlib.NumberTheory.LSeries.AbstractFuncEq:olean
          +Mathlib.Analysis.SpecialFunctions.Stirling:olean
          +Mathlib.NumberTheory.NumberField.ProductFormula:olean
          +Mathlib.Analysis.Complex.RemovableSingularity:olean
          +Mathlib.Analysis.SpecialFunctions.Gamma.Deligne:olean
          +Mathlib.NumberTheory.MulChar.Lemmas:olean
          +Mathlib.NumberTheory.NumberField.Completion.FinitePlace:olean
          +Mathlib.NumberTheory.NumberField.Ideal.Asymptotics:olean
          +Mathlib.Algebra.Order.Chebyshev:olean
          +Mathlib.Analysis.PSeries:olean
          +Mathlib.NumberTheory.Harmonic.Bounds:olean
          +Mathlib.Analysis.Distribution.SchwartzSpace.Fourier:olean
          +Mathlib.Analysis.SpecialFunctions.Complex.Circle:olean
          +TauCeti.NumberTheory.ArithmeticDirichletSeries.Prime.PrimeIdealTheorem:olean
      - name: Revalidate pinned native dependency traces
        if: matrix.phase == 'actual'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/low_energy_native_foundation.py actual
      - name: Compile real sources and preserve axiom output
        run: python3 scripts/low_energy_verify.py ${{ matrix.phase }} --diagnostic-seconds 600
      - name: Save verified module checkpoints
        if: always() && steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build/lib/lean
            .low-energy-verification
            .lake/packages/TauCeti/.lake/build
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}
      - name: Preserve compiled checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-energy-compiled-${{ matrix.phase }}
          path: |
            .lake/build/lib/lean/
            .low-energy-verification/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-energy-verification-${{ matrix.phase }}
          path: .low-energy-verification/
          if-no-files-found: ignore
          include-hidden-files: true
