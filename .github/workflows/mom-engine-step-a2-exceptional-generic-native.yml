          original_target_identity = {'bytes': 9738, 'sha256': '98eb0c130db3036a2f941e2ca15bbacbdbcfa7c6a750ff0d652f8ab89302e826', 'git_blob': 'c288f9a677295d4f95d50dc54bf1bbc95d62bb71'}
          intermediate_target_identity = {'bytes': 9892, 'sha256': 'fec067cdb97d93611d970ab1254499c8fabadaf6934c0f6d42a4a46b087cdf75', 'git_blob': 'bfc05768e06827b01ccf80828397a1d4c64b45d5'}
          candidate_target_identity = {'bytes': 11004, 'sha256': 'd1bd8023844ed9ada11dd87430e5b10017d748d8e99227b889c730359ab30488', 'git_blob': '25ea175212e611ada41b68dd6bf5593bb86cead2'}
          def source_identity(data):
              return {'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),
                      'git_blob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
          def apply_exact_edits(original, edits):
              data=original
              for edit in reversed(edits):
                  assert data[edit['start']:edit['end']] == edit['old'].encode(), edit['name']
                  data=data[:edit['start']]+edit['new'].encode()+data[edit['end']:]
              return data
          def reverse_exact_edits(candidate, edits):
              data=candidate
              for edit in reversed(edits):
                  assert data[edit['candidate_start']:edit['candidate_end']] == edit['new'].encode(), edit['name']
                  data=data[:edit['candidate_start']]+edit['old'].encode()+data[edit['candidate_end']:]
              return data
          def verify_complete_owner_to_generic_chain(original, candidate):
              assert source_identity(original) == {'bytes': 9738, 'sha256': '98eb0c130db3036a2f941e2ca15bbacbdbcfa7c6a750ff0d652f8ab89302e826', 'git_blob': 'c288f9a677295d4f95d50dc54bf1bbc95d62bb71'}
              assert source_identity(candidate) == {'bytes': 11004, 'sha256': 'd1bd8023844ed9ada11dd87430e5b10017d748d8e99227b889c730359ab30488', 'git_blob': '25ea175212e611ada41b68dd6bf5593bb86cead2'}
              owner_to_intermediate = [{'name': 'file_linter_option_43B', 'start': 207, 'end': 207, 'old': '', 'new': '\nset_option linter.unusedSectionVars false\n', 'candidate_start': 207, 'candidate_end': 250}, {'name': 'local_Pool_registration_100B', 'start': 1031, 'end': 1031, 'old': '', 'new': 'attribute [local instance] HeckeSkeleton.Moments.EngineStep.ActualPoolStages.coveredLeafKeyFintype\n\n', 'candidate_start': 1074, 'candidate_end': 1174}, {'name': 'retained_rfl_by_exact_syntax_11B', 'start': 3272, 'end': 3279, 'old': ':= rfl\n', 'new': ':= by\n  exact rfl\n', 'candidate_start': 3415, 'candidate_end': 3433}, {'name': 'leafTag_original_equations_to_two_rec_intermediate', 'start': 3594, 'end': 3807, 'old': 'def leafTag : s.CoveredLeafKey B → PoolSourceTag P\n  | .inl _ => .inl ()\n  | .inr (.inl j) => .inr (.inl j.1)\n  | .inr (.inr (.inl j)) => .inr (.inr (.inl j.1))\n  | .inr (.inr (.inr j)) => .inr (.inr (.inr j.1))', 'new': 'def leafTag : s.CoveredLeafKey B → PoolSourceTag P :=\n  Sum.rec (fun _ => .inl ())\n    (Sum.rec (fun j => .inr (.inl j.1))\n      (Sum.rec (fun j => .inr (.inr (.inl j.1)))\n        (fun j => .inr (.inr (.inr j.1)))))', 'candidate_start': 3748, 'candidate_end': 3965}, {'name': 'leafStageKey_original_equations_to_two_rec_intermediate', 'start': 3883, 'end': 4131, 'old': 'def leafStageKey : ∀ j : s.CoveredLeafKey B,\n    (s.tag (s.leafTag B j)).CoveredLeafKey\n      (B.tag (s.leafTag B j)) (B.tag (s.leafTag B j))\n  | .inl j => j\n  | .inr (.inl j) => j.2\n  | .inr (.inr (.inl j)) => j.2\n  | .inr (.inr (.inr j)) => j.2', 'new': 'def leafStageKey : ∀ j : s.CoveredLeafKey B,\n    (s.tag (s.leafTag B j)).CoveredLeafKey\n      (B.tag (s.leafTag B j)) (B.tag (s.leafTag B j)) :=\n  Sum.rec (fun j => j)\n    (Sum.rec (fun j => j.2)\n      (Sum.rec (fun j => j.2) (fun j => j.2)))', 'candidate_start': 4041, 'candidate_end': 4285}]
              intermediate_to_generic = [{'name': 'insert_four_ambient_free_private_abbrevs', 'start': 1174, 'end': 1174, 'old': '', 'new': 'universe uExceptionalPool vExceptionalKey\n\nprivate abbrev canonicalExceptionalTag (P : Type uExceptionalPool) :=\n  Unit ⊕ (P ⊕ (P ⊕ P))\n\nprivate abbrev canonicalExceptionalCarrier {P : Type uExceptionalPool}\n    (F : canonicalExceptionalTag P → Type vExceptionalKey) :=\n  F (.inl ()) ⊕\n    ((Σ p : P, F (.inr (.inl p))) ⊕\n      ((Σ p : P, F (.inr (.inr (.inl p)))) ⊕\n        (Σ p : P, F (.inr (.inr (.inr p))))))\n\nprivate abbrev canonicalExceptionalLeafTag {P : Type uExceptionalPool}\n    (F : canonicalExceptionalTag P → Type vExceptionalKey) :\n    canonicalExceptionalCarrier F → canonicalExceptionalTag P :=\n  Sum.rec (fun _ => .inl ())\n    (Sum.rec (fun j => .inr (.inl j.1))\n      (Sum.rec (fun j => .inr (.inr (.inl j.1)))\n        (fun j => .inr (.inr (.inr j.1)))))\n\nprivate abbrev canonicalExceptionalLeafPayload {P : Type uExceptionalPool}\n    (F : canonicalExceptionalTag P → Type vExceptionalKey) :\n    ∀ j : canonicalExceptionalCarrier F, F (canonicalExceptionalLeafTag F j) :=\n  Sum.rec (fun j => j)\n    (Sum.rec (fun j => j.2)\n      (Sum.rec (fun j => j.2) (fun j => j.2)))\n\n', 'candidate_start': 1174, 'candidate_end': 2288}, {'name': 'leafTag_rhs_only', 'start': 3804, 'end': 3965, 'old': '  Sum.rec (fun _ => .inl ())\n    (Sum.rec (fun j => .inr (.inl j.1))\n      (Sum.rec (fun j => .inr (.inr (.inl j.1)))\n        (fun j => .inr (.inr (.inr j.1)))))', 'new': '  canonicalExceptionalLeafTag (P := ↥P.primes)\n    (fun t : PoolSourceTag P => (s.tag t).CoveredLeafKey (B.tag t) (B.tag t))', 'candidate_start': 4918, 'candidate_end': 5044}, {'name': 'leafStageKey_rhs_only', 'start': 4188, 'end': 4285, 'old': '  Sum.rec (fun j => j)\n    (Sum.rec (fun j => j.2)\n      (Sum.rec (fun j => j.2) (fun j => j.2)))', 'new': '  canonicalExceptionalLeafPayload (P := ↥P.primes)\n    (fun t : PoolSourceTag P => (s.tag t).