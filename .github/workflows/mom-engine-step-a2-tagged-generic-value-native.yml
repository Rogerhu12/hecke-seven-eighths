name: A2 Tagged shared dependent value and original fresh audit

on:
  push:
    branches: [cloud/mom-engine-step-a2-tagged-generic-value-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-a2-tagged-generic-value-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tagged_index:
    name: Normal OriginalTaggedLocalIndex
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
      ROOT_MODULE: 'OriginalTaggedLocalIndex'
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record the exact source tree and prepare evidence-only helpers
        shell: bash
        run: |
          mkdir -p a2-tagged-generic-value-native
          git show --no-patch --format=fuller HEAD > a2-tagged-generic-value-native/checkout.txt
          cat > a2-tagged-generic-value-native/provenance.py <<'PY'
          import hashlib, json, os, re, subprocess, sys, tomllib
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'a2-tagged-generic-value-native'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def digest(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          task = Path('HeckeSkeleton/Moments/MOM_ENGINE_STEP')
          sources = sorted(str(p) for p in task.glob('*.lean'))
          configs = ['lean-toolchain', 'lakefile.toml', 'lake-manifest.json',
                     'vendor/class-field-theory/lean-toolchain',
                     'vendor/class-field-theory/lakefile.toml',
                     'vendor/class-field-theory/lake-manifest.json', str(task / 'verify.py')]
          interface = (task / 'Interface.lean').read_text()
          imports = sorted(set(re.findall(r'^import (HeckeSkeleton\.Moments\.MOM_ENGINE_STEP\.\S+)$', interface, re.M)))
          libraries = [x['name'] for x in tomllib.loads(Path('lakefile.toml').read_text())['lean_lib']]
          normal_root = os.environ['ROOT_MODULE']
          assert normal_root == 'OriginalTaggedLocalIndex', 'Unexpected normal root'
          source_base = '565885588c313a5e8001a1a8bc24d1ec431b7cbc'
          source_base_tree = git('rev-parse', source_base + '^{tree}')
          assert source_base_tree == '8f80da228523ba670cdb006c670df9ba3407cd65', 'Unexpected frozen production owner tree'
          assert git('rev-parse', 'HEAD^') == source_base, 'Unexpected direct parent'
          assert len(git('rev-list', '--parents', '-n', '1', 'HEAD').split()) == 2
          changed = git('diff', '--name-only', source_base, 'HEAD').splitlines()
          candidate_path = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalTaggedLocalIndex.lean'
          allowed = {'.github/workflows/mom-engine-step-a2-tagged-generic-value-native.yml', candidate_path}
          assert set(changed) == allowed, 'Only the complete reviewed Tagged shared-value candidate and this new normal workflow may differ'
          assert git('diff', '--name-status', source_base, 'HEAD').splitlines() == [
              'A\t' + '.github/workflows/mom-engine-step-a2-tagged-generic-value-native.yml', 'M\t' + candidate_path]
          reviewed_source_pins = {
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalAmplifiedCarrier.lean": "788de94c079afcf9428eb0c592abd1b0090c662ae0949ee3d699a8ac597f871b",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/PoolFiniteLeaves.lean": "7984bec055c28f421ccd1b8cc8215290763cb58d14c49bc9dbc436ce08813b98",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DualGaussHybridTerminal.lean": "6de73fb29bd9434bf272000b7b3dd506b6b24d592a23ddcbc99d8192ca295cff",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalAllocationFingerprint.lean": "30f35dba5d488d40a93fbee78c1eca888aee327a109af235a9320b2c8e2c1e5b",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DirectCoveredStage.lean": "b57bf05548ee52e0cc5a4b60ae24a74247e54b08021218e54bd6b015b3155cc8",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/GatedGaussStages.lean": "9bfd8faeb0505dd7f47b1d824ba2562ab6cd8d168ceecc077429071c6d7cedef",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualGaussFiniteLeaves.lean": "b81c8566cf067792b4e25363381a746281df5460a1e81dad68590ec090d742e2",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralExtraction.lean": "b1bc990df3791577b2e1c0cf609a65fd185715e808253f43533f1b9f9bbcd1bd",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralAtlas.lean": "ff8ab19caf36f5a9ec27ec7a6d9612511644a47b05ff33ee1bf8e4d05484b5b2",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralMovingTwist.lean": "a9639e024d61244af768073acca6479c31bc217ef0a79e0004b2ed943d9e37a5",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OrdinaryLiteralExceptionalLeaf.lean": "09e4b083c71e6773b55fda90ab3412e7f4214552afc8e74f8b96c79705f72a7f",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualExceptionalColumnOrientation.lean": "2304963616c4daf16c15b860f1bfe5634f31d984f996a4205ef00362c9b2c77c",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/Interface.lean": "db81dff1d17c12c72746738c9296a1d4bc87ec27d33958124ce36c79455bb5df",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/verify.py": "1be80b89c66818fa20e680a6850818ed4499ddf2d7d5789a9b63398c3279c148",
              "lean-toolchain": "bc84812c94489d1e3e191baa1dc10d5eb684382d7fe9d2a5ab085e72c1c67e47",
              "lakefile.toml": "2d4deb66cc8a08f069ce72e873ea53f0877ac8aa181a57b08676a7a73aad1af0",
              "lake-manifest.json": "ded459271a8b831db1213d0e0f56e84072a4743f735eb90ed1b65a571459e32c",
              "vendor/class-field-theory/lean-toolchain": "8dc8d6f560141069d9073e370611716ef77ada0da8ffa37e2149f44b2e63ac7a",
              "vendor/class-field-theory/lakefile.toml": "04bb109b87b6bdd3a9fb66b2aaf6d33c97dd6e642718fa944dbb6db1464706cf",
              "vendor/class-field-theory/lake-manifest.json": "ee22b45c98f5346f1bbd99a16305641d0571ee1244ccbff3b11c079b420d0d49",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralChartLocations.lean": "6e84e05f89df4db4512f988af15378d1dcd681e3c336b66c0a07aad253d57e89",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralCommonLeaf.lean": "b890ed1e86998f7c78d52f216b7bd407310fcffd5b3a9eaed30f07c51f6a31a0",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalOriginalGaussTuples.lean": "dfa4e97d244f5b237d9401422e9adcd686e03635a7c1376aa76666ee99a5fb9f",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DirectSecondStages.lean": "884eae448a40b42c145a4bba77d44aa19c3a79463a9825436a272f2c6e7559f0",
              "cloud_tasks/MOM_ENGINE_STEP_E.md": "fd62b1e3f7891148293159587a60d7beaa4bfb42dbcf416d1c74bf08c9ac231f",
              "cloud_tasks/MOM_ENGINE_STEP_GROUPS.md": "3c3bc0add6f48504dbc3acab59441677acbb3f79f1f978a92f3e0ff8980a667f",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualCoveredFibre.lean": "92eedf513225df33bfdd8d35baeccf3ce8f86af3e6ad5422226a2b6d4425834e",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralPoolAtlas.lean": "3bdbc3c828fd32f8e90efdd423a5a458592c964596c50e52dfa53e937a4f931c",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralTwoStages.lean": "850fcbe46f3a80b175e3379d098d135d7990c78a819b0939958ae46ced373619",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/NormalizedOriginalImageMass.lean": "5f4d2fa7eddc0bdcd87877ec71716f06f0fc8972d511c864b6d4cea453cf6363",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/ActualCoveredFibreMass.lean": "4959a7555a13623709b19490b3b5df4f10ec7b380b3c98b6118eb79cd0e5d1b2",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralProfileData.lean": "960bde1fa37dcf22398f8aa13382c7100b33b39b60771dcb0c4adc0bffde038c",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/CanonicalLiteralSourceCoefficients.lean": "20e060a7f870b0110866e4a0ed9cc9b667e57b0a36b29cb6334c0eccee464532",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/DualPoolTerminal.lean": "95072a7d70746559fe2d603f82999ea5160a4bea18a9b74cd2a6b0db867fa3c7",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalTaggedLocalIndex.lean": "fd9cdd0a85ebb61f60864bbc39769c8cab83d52a16791b1d07233710ded08efc",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/OriginalArithmeticCarrier.lean": "f8f9b8fe1fc3e430c330da270b924e5a074bd9ac949b21289610782fa34781c8",
              "HeckeSkeleton/Moments/MOM_ENGINE_STEP/FiniteBranchIndex.lean": "238f0b27b692a1eccd6abfa85afda6951829f873e17f2c572b54b072d9746adc"
          }
          for path, expected in reviewed_source_pins.items():
              assert digest(path) == expected, 'Unexpected reviewed source or original configuration: ' + path
          original_target_identity = {'bytes': 3268, 'sha256': '2a4b131c3b9682d1c852ff8d18c8ed93e3bc1328bf1874cfcf9a6dfc533b020e', 'git_blob': '4c23104791f361f22ca06baea55c818934c046b0'}
          candidate_target_identity = {'bytes': 6166, 'sha256': 'fd9cdd0a85ebb61f60864bbc39769c8cab83d52a16791b1d07233710ded08efc', 'git_blob': 'fa5d2ce1f23b09d418db7afd3bc19b555ede2fd4'}
          combined_D_B2_identity = {'bytes': 6019, 'sha256': '5142394ecda462f3562588a24e154c7f728e7aff907390cb8c60db11b9e4fdf1', 'git_blob': '9789ffba11b00e823bff769b75d9016aa1704bb2'}
          original_target_bytes = subprocess.check_output(['git', 'show', source_base + ':' + candidate_path])
          candidate_target_bytes = (root / candidate_path).read_bytes()
          def source_identity(data):
              return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                      'git_blob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
          
          def verify_tagged_shared_value_chain(original, candidate):
              assert source_identity(original) == original_target_identity
              assert source_identity(candidate) == candidate_target_identity
              names = ['localIndex_first', 'localIndex_firstDivisor', 'localIndex_second',
                       'localIndex_secondDivisor', 'amplifiedIndexWeight_local']
              terminators = [b'\n\n@[simp] theorem ' + n.encode() + b' ' for n in names[1:4]] + [
                  b'\n\nvariable {bad :', b'\n\nend OriginalArithmeticLabels']
              def bounds(data, name):
                  token = b'theorem ' + name.encode() + b' '
                  assert data.count(token) == 1
                  head = data.index(token)
                  body = data.index(b' := by\n', head) + len(b' := by\n')
                  end = data.index(terminators[names.index(name)], body) + 1
                  return head, body, end
              option = b'set_option linter.unusedSectionVars false\n'
              import_line = b'import HeckeSkeleton.Moments.MOM_ENGINE_STEP.OriginalAmplifiedCarrier\n'
              value = 'private def option_dependent_value\n    {α : Type*} {β : Option α → Sort*}\n    (o : Option α) (f0 : o = none → β none)\n    (fs : ∀ a, o = some a → β (some a)) : β o :=\n  match (generalizing := false) h : o with\n  | none => f0 h\n  | some a => fs a h\n\n'.encode()
              old_index = 'def localIndex (i : I) : (L.localBranch tag i).Index :=\n  show (match tag i with\n    | none => L.mainCarrier tag\n    | some q => L.errorCarrier tag q.1 q.2).Index from\n  match h : tag i with\n  | none => (L.mainLabels tag).index ⟨i, h⟩\n  | some q => (L.errorLabels tag q.1 q.2).index ⟨i, h⟩\n'.encode()
              new_index = 'def localIndex (i : I) : (L.localBranch tag i).Index :=\n  option_dependent_value\n    (β := fun q => (match q with\n      | none => L.mainCarrier tag\n      | some p => L.errorCarrier tag p.1 p.2).Index)\n    (tag i)\n    (fun h => (L.mainLabels tag).index ⟨i, h⟩)\n    (fun q h => (L.errorLabels tag q.1 q.2).index ⟨i, h⟩)\n'.encode()
              old_conclusion = '    P o (match (generalizing := false) h : o with\n      | none => f0 h\n      | some a => fs a h) := by\n'.encode()
              new_conclusion = '    P o (option_dependent_value o f0 fs) := by\n'.encode()
              prefix = b'  unfold localIndex\n  dsimp only\n'
              assert len(option) == 42 and candidate.startswith(import_line + option)
              assert candidate.count(option) == candidate.count(b'set_option ') == 1
              assert candidate.count(value) == candidate.count(new_index) == candidate.count(new_conclusion) == 1
              assert b'sorry' not in candidate and b'axiom ' not in candidate
              reconstructed = candidate.replace(option, b'', 1)
              reconstructed = reconstructed.replace(value, b'', 1)
              reconstructed = reconstructed.replace(new_index, old_index, 1)
              reconstructed = reconstructed.replace(new_conclusion, old_conclusion, 1)
              projection_proofs = {}
              public_headers = {}
              for name in reversed(names[:4]):
                  _, body, end = bounds(reconstructed, name)
                  assert reconstructed[body:end].startswith(b'  exact option_dependent_match_property\n')
                  projection_proofs[name] = {'candidate': source_identity(reconstructed[body:end]),
                                             'D6019': source_identity(prefix + reconstructed[body:end])}
                  reconstructed = reconstructed[:body] + prefix + reconstructed[body:]
              assert source_identity(reconstructed) == combined_D_B2_identity
              # Forward the exact same seven mathematical changes and the existing file option.
              forward = reconstructed.replace(import_line, import_line + option, 1)
              forward = forward.replace(b'private theorem option_dependent_match_property\n',
                  value + b'private theorem option_dependent_match_property\n', 1)
              forward = forward.replace(old_conclusion, new_conclusion, 1).replace(old_index, new_index, 1)
              for name in reversed(names[:4]):
                  _, body, end = bounds(forward, name)
                  assert forward[body:end].startswith(prefix)
                  forward = forward[:body] + forward[body + len(prefix):]
              assert forward == candidate
              # Independently reverse D's helper insertion and all five real proof bodies to the owner.
              var_anchor = b'variable {K : Type} [Field K] [NumberField K]\n'
              start = reconstructed.index(b'private theorem option_dependent_match_property\n')
              stop = reconstructed.index(var_anchor, start)
              D_helper = reconstructed[start:stop]
              stripped = reconstructed[:start] + reconstructed[stop:]
              original_proofs = {}
              D_proofs = {}
              for name in reversed(names):
                  oh, ob, oe = bounds(original, name)
                  dh, db, de = bounds(stripped, name)
                  ch, cb, ce = bounds(candidate, name)
                  assert original[oh:ob] == stripped[dh:db] == candidate[ch:cb], name
                  public_headers[name] = source_identity(original[oh:ob])
                  original_proofs[name] = original[ob:oe]
                  D_proofs[name] = stripped[db:de]
                  if name == 'amplifiedIndexWeight_local':
                      assert candidate[cb:ce] == stripped[db:de]
                      assert len(candidate[cb:ce]) == 1050
                      assert hashlib.sha256(candidate[cb:ce]).hexdigest() == '375dc143e8ae13b7cbdf24de21f56788004bc230af4bbc0673194d4b12d06b24'
                  stripped = stripped[:db] + original[ob:oe] + stripped[de:]
              assert stripped == original, 'Any owner bytes outside the one D helper and five proof bodies changed'
              forward_D = original.replace(var_anchor, D_helper + var_anchor, 1)
              for name in reversed(names):
                  _, body, end = bounds(forward_D, name)
                  assert forward_D[body:end] == original_proofs[name]
                  forward_D = forward_D[:body] + D_proofs[name] + forward_D[end:]
              assert forward_D == reconstructed
              # The public computational change is explicit; both public definition headers remain fixed.
              definition_headers = {}
              for name in ['localBranch', 'localIndex']:
                  token = b'def ' + name.encode() + b' '
                  oh = original.index(token)
                  ch = candidate.index(token)
                  oend = original.index(b':=', oh)
                  cend = candidate.index(b':=', ch)
                  assert original[oh:oend] == candidate[ch:cend]
                  definition_headers[name] = source_identity(original[oh:oend])
              assert original[original.index(b'def localBranch '):original.index(b'def localIndex ')] == candidate[candidate.index(b'def localBranch '):candidate.index(b'def localIndex ')]
              assert reconstructed[reconstructed.index(b'variable {bad :'):] == candidate[candidate.index(b'variable {bad :'):]
              for token in [b'import ', b'#print axioms ']:
                  assert [line for line in original.splitlines() if line.startswith(token)] == [line for line in candidate.splitlines() if line.startswith(token)]
              assert candidate.count(b'private def ') == candidate.count(b'private theorem ') == 1
              assert candidate.index(value) < candidate.index(var_anchor)
              return reconstructed, {
                  'complete_candidate_to_D6019_and_back_exact': True,
                  'complete_D6019_to_owner_and_back_exact': True,
                  'D6019_identity': source_identity(reconstructed),
                  'seven_mathematical_edits_and_one_existing_file_option': True,
                  'new_private_value': source_identity(value[:-1]),
                  'two_public_definition_headers': definition_headers,
                  'five_public_theorem_headers': public_headers,
                  'original_localBranch_full_definition_unchanged': True,
                  'public_localIndex_old': source_identity(old_index),
                  'public_localIndex_new': source_identity(new_index),
                  'four_projection_proofs': projection_proofs,
                  'B2_weight_1050_bytes_and_entire_suffix_unchanged': True,
                  'original_import_and_three_prints_unchanged': True,
                  'only_source_option': {'name': 'linter.unusedSectionVars', 'value': False,
                                         'scope': 'whole file', 'bytes': 42},
                  'no_heartbeat_async_import_or_budget_change': True}
          assert git('rev-parse', source_base + ':' + candidate_path) == original_target_identity['git_blob']
          assert git('rev-parse', 'HEAD:' + candidate_path) == candidate_target_identity['git_blob']
          combined_D_B2_bytes, source_rewrite = verify_tagged_shared_value_chain(original_target_bytes, candidate_target_bytes)
          original_prints = ['HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.localIndex_first', 'HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.localIndex_secondDivisor', 'HeckeSkeleton.Moments.EngineStep.OriginalArithmeticLabels.amplifiedIndexWeight_local']
          assert re.findall(r'^#print axioms (\S+)$', candidate_target_bytes.decode(), re.M) == original_prints
          record = {'source_base': source_base, 'source_base_tree': source_base_tree,
                    'normal_root': normal_root,
                    'one_complete_original_root_and_its_three_original_prints': True,
                    'changed_paths_from_base': changed,
                    'owner_claim_comment': 6569542416,
                    'exact_public_definition_and_private_head_change_announcement': 6573573897,
                    'all_other_production_sources_unchanged_from_frozen_owner': True,
                    'source_candidate_not_yet_owner_adopted': True,
                    'candidate_path': candidate_path,
                    'original_target_identity': original_target_identity,
                    'combined_D_B2_identity': combined_D_B2_identity,
                    'candidate_target_identity': candidate_target_identity,
                    'exact_owner_D6019_shared_value_source_chain': source_rewrite,
                    'public_definition_body_change': 'OriginalArithmeticLabels.localIndex uses the same private transparent dependent value as its property theorem',
                    'new_private_computational_definition': 'option_dependent_value',
                    'private_property_conclusion_change': 'P o (option_dependent_value o f0 fs)',
                    'B2_weight_proof_preserved_1050_bytes': True,
                    'original_prints': original_prints,
                    'no_diagnostic_auxiliary_or_probe_files_added': True,
                    'original_verifier_and_all_original_declaration_prints_used': True,
                    'fresh_audit_scope': 'Every loaded EngineStep declaration, including the new private value and generated matcher declarations, through the original privateToUserName and collectAxioms verifier',
                    'all_G1_81_or_ready_not_claimed_by_this_single_root_run': True,
                    'final_Interface_fullfresh_Whole20_after_eight_groups_not_claimed': True,
                    'reviewed_source_pins': reviewed_source_pins,
                    'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
                    'expected_head': os.environ['EXPECTED_SHA'],
                    'tracked_status': git('status', '--porcelain=v1', '--untracked-files=no'),
                    'tracked_sha256': {p: digest(p) for p in tracked},
                    'task_source_sha256': {p: digest(p) for p in sources},
                    'config_sha256': {p: digest(p) for p in configs},
                    'interface_imports': imports, 'libraries': libraries}
          assert json.loads(json.dumps(record)) == record, 'Provenance must use only stable JSON-native types'
          phase = sys.argv[1]
          (evidence / (phase + '-source.json')).write_text(json.dumps(record, indent=2) + '\n')
          assert record['head'] == record['expected_head'], 'Unexpected checkout SHA'
          assert not record['tracked_status'], 'Tracked source changes detected'
          assert len(tracked) == 9585, 'Complete tracked inventory changed'
          assert len(sources) == 1009, 'Task module inventory changed'
          assert len(imports) == 1008, 'Complete Interface import inventory changed'
          assert set(imports) == {'HeckeSkeleton.Moments.MOM_ENGINE_STEP.' + Path(p).stem for p in sources if Path(p).name != 'Interface.lean'}, 'Interface does not import the complete task inventory'
          assert len(libraries) == 20, 'Library inventory changed'
          assert len(configs) == 7, 'Configuration inventory changed'
          if phase == 'after':
              before = json.loads((evidence / 'before-source.json').read_text())
              assert before == record, 'Source, configuration, index inventory or HEAD changed'
              (evidence / 'source-integrity.json').write_text(json.dumps({
                  'unchanged': True, 'head': record['head'], 'tree': record['tree'],
                  'tracked_files': len(tracked), 'task_modules': len(sources),
                  'interface_imports': len(imports), 'libraries': len(libraries)}, indent=2) + '\n')
          print(f'{phase}: {record["head"]} tree={record["tree"]}; {len(tracked)} tracked files, {len(sources)} task modules, {len(libraries)} libraries')
          PY
          cat > a2-tagged-generic-value-native/run.py <<'PY'
          import datetime, json, re, subprocess, sys, time
          from pathlib import Path
          name, seconds, *command = sys.argv[1:]
          evidence = Path('a2-tagged-generic-value-native')
          wrapper = ['timeout', '--signal=TERM', '--kill-after=30s', seconds + 's', *command]
          record = {'command': command, 'wrapper': wrapper, 'completed': False,
                    'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          receipt = evidence / (name + '-result.json')
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          start = time.monotonic()
          compact = name == 'dependencies'
          show_block = not compact
          with (evidence / (name + '-console.log')).open('w') as log:
              process = subprocess.Popen(wrapper, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  log.write(line)
                  log.flush()
                  if compact:
                      clean = re.sub(r'\x1b\[[0-9;]*m', '', line)
                      if re.match(r'^[✔✖⚠ℹ]\s+\[\d+/\d+\]', clean):
                          show_block = 'HeckeSkeleton.Moments.MOM_ENGINE_STEP' in clean or clean.startswith('✖')
                      elif re.match(r'^(error|warning|info):', clean):
                          show_block = 'HeckeSkeleton/Moments/MOM_ENGINE_STEP/' in clean or clean.startswith('error:')
                      elif clean.startswith('Some required targets logged failures:'):
                          show_block = True
                  if show_block:
                      print(line, end='', flush=True)
              code = process.wait()
          record.update(completed=True, exit_code=code, elapsed_seconds=time.monotonic() - start,
                        finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record), flush=True)
          sys.exit(code if code >= 0 else 128 - code)
