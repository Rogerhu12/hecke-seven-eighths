name: MOM Engine Step V2 modules
on:
  pull_request:
    branches: [dtests-handoff]
    paths:
      - 'HeckeSkeleton/Moments/MOM_ENGINE_STEP_V2/**'
      - '.github/workflows/mom-engine-step-v2.yml'
      - '.github/v2/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mom-engine-step-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  v2-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reserve runner space and configure memory mappings
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Build every V2 module and audit proved groups
        run: python3 -u .github/v2/build.py
      - name: Upload V2 build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mom-engine-step-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: v2-build/
          retention-days: 14

  raw-contracts-diagnostics:
    name: RawContracts diagnostics (not proof evidence)
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'cloud/mom-v2-n2-n3') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'cloud/mom-v2-n2-n3') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reserve runner space and configure memory mappings
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Restore precompiled project artifacts
        uses: Rogerhu12/hecke-seven-eighths/.github/actions/restore-lake-cache@dtests-handoff
      - name: Diagnose RawContracts with only an explicit noncomputable leaf modifier
        run: python3 -u .github/v2/n7_dependency_diagnostics.py --module RawContracts --raw-noncomputable-leaf --output v2-build/n2-n3-rawcontracts-diagnostics
      - name: Upload RawContracts diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2-n3-rawcontracts-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: v2-build/n2-n3-rawcontracts-diagnostics/
          retention-days: 14

